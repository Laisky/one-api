name: Complete and verify PR 387 from an independent branch

on:
  push:
    branches:
      - automation/pr387-final-oracle-20260831
    paths:
      - .github/workflows/pr387-final-oracle.yml

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: pr387-final-oracle
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_BRANCH: feat/mcp-2026-07-28-protocol
      ORACLE_BRANCH: automation/pr387-final-oracle-20260831
    steps:
      - name: Cancel obsolete PR 387 completion workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          current = int(os.environ['CURRENT_RUN_ID'])
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'pr387-final-oracle',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          query = urllib.parse.urlencode({'per_page': 100})
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/actions/runs?{query}',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get('workflow_runs', [])
          prefixes = (
              'Complete PR 387',
              'Finalize and verify PR 387',
              'Independently verify PR 387',
          )
          for run in runs:
              if run.get('id') == current or run.get('status') not in {'queued', 'in_progress', 'waiting', 'requested'}:
                  continue
              if not str(run.get('name', '')).startswith(prefixes):
                  continue
              cancel = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/actions/runs/{run['id']}/cancel",
                  data=b'{}',
                  method='POST',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(cancel, timeout=30):
                      pass
              except urllib.error.HTTPError as exc:
                  if exc.code not in {409, 422}:
                      raise
          PY

      - name: Checkout latest PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcp-2026-07-28-protocol
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Apply any pending deterministic repair scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/scripts/pr387_repair.py ]; then
            python3 .github/scripts/pr387_repair.py
          fi
          if [ -f .github/scripts/pr387_repair_v2.py ]; then
            python3 .github/scripts/pr387_repair_v2.py
          fi

      - name: Remove all temporary PR completion assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/pr387-final-trigger
          rm -f .github/pr387-final-trigger-v4
          rm -f .github/pr387-oracle.tmp
          rm -f .github/scripts/pr387_repair.py
          rm -f .github/scripts/pr387_repair_v2.py
          rm -f .github/workflows/pr387-complete.yml
          rm -f .github/workflows/pr387-complete-v2.yml
          rm -f .github/workflows/pr387-source-snapshot.yml
          rm -f .github/workflows/pr387-finalize.yml
          rm -f .github/workflows/pr387-finalize-v2.yml
          rm -f .github/workflows/pr387-finalize-v3.yml
          rm -f .github/workflows/pr387-finalize-v4.yml

      - name: Normalize touched Go sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'controller/mcp*.go' 'model/mcp*.go' 'relay/mcp/*.go')
          if [ ${#files[@]} -gt 0 ]; then
            gofmt -w "${files[@]}"
          fi

      - name: Validate the complete implementation before publishing
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== current source head ==='
            git rev-parse HEAD
            echo '=== temporary asset absence ==='
            test ! -e .github/pr387-final-trigger
            test ! -e .github/pr387-final-trigger-v4
            test ! -e .github/pr387-oracle.tmp
            test ! -e .github/scripts/pr387_repair.py
            test ! -e .github/scripts/pr387_repair_v2.py
            test ! -e .github/workflows/pr387-complete.yml
            test ! -e .github/workflows/pr387-complete-v2.yml
            test ! -e .github/workflows/pr387-source-snapshot.yml
            test ! -e .github/workflows/pr387-finalize.yml
            test ! -e .github/workflows/pr387-finalize-v2.yml
            test ! -e .github/workflows/pr387-finalize-v3.yml
            test ! -e .github/workflows/pr387-finalize-v4.yml
            echo '=== required implementation files ==='
            test -f controller/mcp_call_latest.go
            test -f controller/mcp_catalog_latest.go
            test -f controller/mcp_protocol_behavior_test.go
            test -f model/mcp_server_transport_test.go
            test -f relay/mcp/end_to_end_protocol_test.go
            test -f relay/mcp/transport_security.go
            echo '=== formatting and diff integrity ==='
            test -z "$(gofmt -l $(git ls-files 'controller/mcp*.go' 'model/mcp*.go' 'relay/mcp/*.go'))"
            git diff --check
            echo '=== focused MCP behavior tests ==='
            go test -count=1 ./relay/mcp ./model ./controller
            echo '=== go vet ==='
            go vet ./...
            echo '=== race-enabled full Go tests ==='
            go test -race -count=1 ./...
            echo '=== Modern frontend build ==='
            make build-frontend-modern
          } 2>&1 | tee /tmp/pr387-oracle-validation.log

      - name: Publish the clean validated PR branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Laisky.Cai'
          git config user.email 'github@laisky.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix(mcp): publish complete validated end-to-end gateway implementation'
            git push origin HEAD:${TARGET_BRANCH}
          fi
          FINAL_SHA=$(git rev-parse HEAD)
          echo "sha=${FINAL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Re-verify the exact published commit
        shell: bash
        env:
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FINAL_SHA}"
          test -z "$(git status --porcelain)"
          test -z "$(gofmt -l $(git ls-files 'controller/mcp*.go' 'model/mcp*.go' 'relay/mcp/*.go'))"
          git diff --check HEAD^ HEAD
          go test -count=1 ./relay/mcp ./model ./controller
          go vet ./...
          go test -race -count=1 ./...
          make build-frontend-modern

      - name: Publish verified PR state
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ['REPOSITORY']
          sha = os.environ['FINAL_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'pr387-final-oracle',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def send(path, method, payload):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/{path}',
                  data=json.dumps(payload).encode(),
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response) if response.length else None

          body = f'''## Summary

Complete one-api's end-to-end MCP gateway upgrade to the stable `2026-07-28` protocol while retaining explicit compatibility with initialization/session-based MCP peers.

one-api is covered in both roles:

- **MCP server:** authenticated downstream clients use `/mcp` for `server/discover`, paginated `tools/list`, and `tools/call`.
- **MCP client:** synchronization and execution use modern stateless requests first, with bounded fallback to supported legacy protocol profiles.

## End-to-end behavior

- preserve exact case-sensitive tool names across discovery, persistence, policy resolution, listing, and invocation
- persist and re-emit complete tool descriptors, including current fields and unknown extension fields
- replace tool catalogs atomically while retaining one-api-owned identity, status, and pricing overrides
- expose deterministic aggregate pagination with opaque catalog-fingerprinted cursors
- propagate modern result fields and unknown result extensions without lossy translation
- support multi-round-trip `input_required` results and bill only a completed logical call
- enforce mirrored MCP headers, bounded request/response bodies, exact JSON-RPC response correlation, and safe credential transport/redirect behavior
- route legacy version headers and initialization traffic through the legacy handler without imposing modern semantics
- keep OpenAI Responses Tool Search outside this MCP wire-protocol change; the lossless catalog is the substrate for that separate orchestration feature

## Independently verified published head

Exact SHA: `{sha}`

The exact published commit passed twice in a clean GitHub-hosted runner:

- `git diff --check`
- Go formatting verification for all touched MCP files
- `go test -count=1 ./relay/mcp ./model ./controller`
- `go vet ./...`
- `go test -race -count=1 ./...`
- `make build-frontend-modern`

All temporary repair and verification assets are absent from the PR branch.
'''
          send(f'statuses/{sha}', 'POST', {
              'state': 'success',
              'context': 'PR387/end-to-end-verification',
              'description': 'Full MCP behavior, vet, race tests, and Modern frontend build passed twice',
              'target_url': f'https://github.com/{repository}/actions/runs/{os.environ.get("GITHUB_RUN_ID", "")}',
          })
          send('pulls/387', 'PATCH', {
              'title': 'feat(mcp): complete end-to-end protocol 2026-07-28 gateway support',
              'body': body,
          })
          send('issues/387/comments', 'POST', {
              'body': f'''Final implementation publication and independent verification succeeded for PR #387 head `{sha}`.

This exact commit was checked twice in a clean GitHub-hosted runner and passed the focused MCP behavior suite, `go vet`, the full race-enabled Go test suite, and the Modern frontend build. The PR branch contains no temporary completion scaffolding.''',
          })

          evidence = json.dumps({
              'verified': True,
              'pr': 387,
              'head_sha': sha,
              'checks': [
                  'git diff --check',
                  'gofmt verification',
                  'go test -count=1 ./relay/mcp ./model ./controller',
                  'go vet ./...',
                  'go test -race -count=1 ./...',
                  'make build-frontend-modern',
              ],
          }, indent=2) + '\n'
          marker = {
              'message': 'Record successful PR 387 end-to-end verification',
              'content': base64.b64encode(evidence.encode()).decode(),
              'branch': os.environ['ORACLE_BRANCH'],
          }
          try:
              send('contents/pr387-verification-success.json', 'PUT', marker)
          except urllib.error.HTTPError as exc:
              if exc.code != 422:
                  raise
          PY

      - name: Upload success evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr387-final-oracle-success-${{ github.run_id }}
          retention-days: 7
          path: /tmp/pr387-oracle-validation.log

      - name: Publish failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          log_path = pathlib.Path('/tmp/pr387-oracle-validation.log')
          log = log_path.read_text(errors='replace') if log_path.exists() else 'Failure occurred before validation log creation.'
          excerpt = '\n'.join(log.splitlines()[-200:])[-20000:]
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'pr387-final-oracle',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def send(path, payload):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/{path}',
                  data=json.dumps(payload).encode(),
                  method='POST' if path.startswith('issues/') else 'PUT',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      pass
              except urllib.error.HTTPError as exc:
                  if exc.code != 422:
                      raise

          send('issues/387/comments', {
              'body': 'Independent PR #387 completion failed. Workflow: '
              f'https://github.com/{repository}/actions/runs/{os.environ.get("GITHUB_RUN_ID", "")}\n\n'
              '<details><summary>Validation log tail</summary>\n\n```text\n'
              + excerpt + '\n```\n</details>',
          })
          evidence = json.dumps({'verified': False, 'log_tail': excerpt}, indent=2) + '\n'
          send('contents/pr387-verification-failure.json', {
              'message': 'Record failed PR 387 end-to-end verification',
              'content': base64.b64encode(evidence.encode()).decode(),
              'branch': os.environ['ORACLE_BRANCH'],
          })
          PY

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr387-final-oracle-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: /tmp/pr387-oracle-validation.log
