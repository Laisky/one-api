# Temporary read-only evidence collection for PR #425; removed after collection.
name: Catalog final evidence
on:
  push:
    branches: [feat/adaptor-catalog-audit-20260924]
    paths: [.github/workflows/catalog-audit-final-evidence.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read official public catalogs without inference or credentials
        env:
          OUT: ${{ runner.temp }}/catalog-final
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, pathlib, urllib.request
          out = pathlib.Path(os.environ['OUT'])
          sources = {
              'openrouter-all': 'https://openrouter.ai/api/v1/models?output_modalities=all',
              'openrouter-models': 'https://openrouter.ai/api/v1/models',
              'openrouter-openapi': 'https://openrouter.ai/openapi.json',
              'deepinfra-models': 'https://api.deepinfra.com/models/list',
              'novita-models': 'https://api.novita.ai/v3/openai/models',
              'cerebras-models': 'https://api.cerebras.ai/public/v1/models',
              'mistral-reasoning': 'https://docs.mistral.ai/studio/conversations/reasoning',
              'mistral-models': 'https://docs.mistral.ai/models',
              'mistral-pricing': 'https://docs.mistral.ai/inference/pricing',
              'mistral-openapi': 'https://raw.githubusercontent.com/mistralai/platform-docs/main/public/openapi.yaml',
              'bigmodel-pricing': 'https://docs.bigmodel.cn/cn/guide/start/pricing',
              'bigmodel-models': 'https://docs.bigmodel.cn/cn/guide/start/model-overview',
              'jina-home': 'https://jina.ai/',
              'jina-openapi': 'https://api.jina.ai/openapi.json',
              'jina-pricing': 'https://jina.ai/pricing/',
              'aws-pricing': 'https://aws.amazon.com/bedrock/pricing/',
              'aws-opus55': 'https://docs.aws.amazon.com/ja_jp/bedrock/latest/userguide/model-card-anthropic-claude-opus-5-5.html',
              'aws-models': 'https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html',
              'claude-pricing': 'https://platform.claude.com/docs/en/about-claude/pricing',
              'claude-deprecations': 'https://platform.claude.com/docs/en/about-claude/model-deprecations',
              'gemini-models': 'https://ai.google.dev/gemini-api/docs/models',
              'gemini-pricing': 'https://ai.google.dev/gemini-api/docs/pricing',
              'openai-models': 'https://developers.openai.com/api/docs/models',
              'openai-pricing': 'https://developers.openai.com/api/docs/pricing',
              'vertex-models': 'https://cloud.google.com/vertex-ai/generative-ai/docs/learn/models',
              'xai-models': 'https://docs.x.ai/developers/models',
              'xai-pricing': 'https://docs.x.ai/developers/pricing',
              'baidu-pricing': 'https://cloud.baidu.com/doc/qianfan/s/wmh4sv6ya',
              'stepfun-pricing': 'https://platform.stepfun.com/docs/zh/guides/pricing/details.md',
              'tencent-pricing': 'https://cloud.tencent.com/document/product/1729/97731',
              'together-models': 'https://docs.together.ai/docs/serverless-models',
              'siliconflow-models': 'https://docs.siliconflow.cn/cn/userguide/introduction',
              'ollama-models': 'https://ollama.com/library',
              'palm-retirement': 'https://ai.google.dev/palm_docs/deprecation',
          }
          def collect(item):
              name, url = item
              result = {'name': name, 'url': url, 'retrieved_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'one-api-catalog-audit/1.0'})
                  with urllib.request.urlopen(request, timeout=45) as response:
                      data = response.read(20 * 1024 * 1024 + 1)
                      if len(data) > 20 * 1024 * 1024:
                          raise ValueError('response exceeds 20 MiB')
                      result.update(status=response.status, final_url=response.url, content_type=response.headers.get('Content-Type', ''), bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
                  (out / (name + '.data')).write_bytes(data)
              except Exception as exc:
                  result['error'] = str(exc)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
              results = list(executor.map(collect, sources.items()))
          (out / 'sources.json').write_text(json.dumps(results, indent=2) + '\n')
          for result in results:
              print(result['name'], result.get('status', 'unavailable'), result.get('bytes', 0))
          PY
      - name: Archive source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-final-evidence
          path: ${{ runner.temp }}/catalog-final
          retention-days: 7
