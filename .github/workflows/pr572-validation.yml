name: PR 572 isolated frontend qualification
on:
  push:
    branches: [validation/pr572-frontend-20261014]
permissions:
  contents: read
jobs:
  export_source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f31f442cf95149352b1ef283b00e46859b1a1d84
          persist-credentials: false
      - name: Export source and verify the archive is populated
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git archive --format=tar HEAD web/modern web/legacy .github/scripts .github/workflows AGENTS.md Makefile | gzip > evidence/source.tar.gz
          tar -tzf evidence/source.tar.gz > evidence/inventory.txt
          grep -Fx 'web/modern/src/hooks/useTableSort.ts' evidence/inventory.txt
          test "$(wc -l < evidence/inventory.txt)" -gt 500
          sha256sum evidence/source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr572-source
          path: evidence
          retention-days: 7
          if-no-files-found: error
