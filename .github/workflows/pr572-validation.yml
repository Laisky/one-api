name: PR 572 isolated frontend qualification
on:
  push:
    branches: [validation/pr572-frontend-20261014]
    paths: [.github/workflows/pr572-validation.yml]
permissions:
  contents: read
concurrency:
  group: pr572-isolated-qualification
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    env:
      EXPECTED_HEAD: 409d31808861f393aff0fa108deae8cf29ae36ef
      TARGET_BRANCH: feat/persistent-table-sort-shift-selection-20261014
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 409d31808861f393aff0fa108deae8cf29ae36ef
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Commit only browser-driver lifecycle synchronization
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --check ../driver/.github/scripts/pr572-browser-lifecycle.patch
          git apply ../driver/.github/scripts/pr572-browser-lifecycle.patch
          git diff --check
          test "$(git diff --name-only)" = 'web/modern/scripts/test-table-interactions-browser.py'
          git add web/modern/scripts/test-table-interactions-browser.py
          git commit -m 'test(frontend): synchronize browser actions with dropdown closing transitions'
      - name: Publish with an exact expected-head lease
        id: publish
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --oneline
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify parity with the fully tested runtime before reusing its results
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git diff --exit-code 3166fac4bf7cddcaf0d906fe021f2755c62bf490 HEAD -- . ':!docs/table-sort-and-range-selection.md' ':!web/modern/scripts/test-table-interactions-browser.py'
          git diff --stat 3166fac4bf7cddcaf0d906fe021f2755c62bf490 HEAD > evidence/parity.txt
          echo 'The 1063 passing tests, one existing skip, lint and translations in run38510777943 qualify byte-identical runtime/tests/configuration. This run qualifies the corrected browser driver and rebuilds production assets.' >> evidence/parity.txt
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock
      - name: Install locked dependencies and pinned browser tools
        working-directory: web/modern
        run: |
          yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Build the production frontend with compiler and unchanged release guard
        run: |
          set -euo pipefail
          mkdir -p web/modern/test-results/pr572
          make build-frontend-modern 2>&1 | tee web/modern/test-results/pr572/build.log
      - name: Verify all twelve real production page and viewport cases
        run: |
          set -euo pipefail
          python3 web/modern/scripts/test-table-interactions-browser.py 2>&1 | tee web/modern/test-results/pr572/browser.log
      - name: Preserve exact source and browser receipts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          git diff --exit-code
          git status --short > evidence/source-status.txt
          cp -r web/modern/test-results evidence/
          tar -czf evidence/compiled-modern.tar.gz web/build/modern
          git archive HEAD web/modern/src web/modern/scripts web/legacy/browser-release-inputs.json | gzip > evidence/reviewed-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr572-browser-acceptance
          path: evidence
          retention-days: 7
          if-no-files-found: warn
