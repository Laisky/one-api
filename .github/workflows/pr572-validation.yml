name: PR 572 isolated frontend qualification
on:
  push:
    branches: [validation/pr572-frontend-20261014]
permissions:
  contents: read
concurrency:
  group: pr572-isolated-qualification
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    env:
      EXPECTED_HEAD: ce7f53856db25421ae82eb1fb73fefa07c3646b2
      TARGET_BRANCH: feat/persistent-table-sort-shift-selection-20261014
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ce7f53856db25421ae82eb1fb73fefa07c3646b2
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Commit the exact reviewed regressions before their repair
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --check ../driver/.github/scripts/pr572-followup.patch
          git apply --include=web/modern/src/components/ui/__tests__/table-selection-range.test.tsx --include=web/modern/src/hooks/__tests__/useTableSort.test.tsx ../driver/.github/scripts/pr572-followup.patch
          git add web/modern/src/components/ui/__tests__/table-selection-range.test.tsx web/modern/src/hooks/__tests__/useTableSort.test.tsx
          git commit -m 'test(frontend): reproduce obsolete sort columns and stale range anchors'
          git apply --exclude=web/modern/src/components/ui/__tests__/table-selection-range.test.tsx --exclude=web/modern/src/hooks/__tests__/useTableSort.test.tsx ../driver/.github/scripts/pr572-followup.patch
          git diff --check
          git add web/modern/src
          git commit -m 'fix(frontend): validate saved columns and invalidate range anchors on view changes'
      - name: Publish with the original expected-head lease
        id: publish
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log -2 --oneline
  qualify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock
      - name: Install locked frontend dependencies
        id: install
        working-directory: web/modern
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
      - name: Reproduce both defects against original runtime bytes and retain final-source regressions
        working-directory: web/modern
        run: |
          set -euo pipefail
          mkdir -p test-results/pr572
          FILES='src/components/ui/data-table.tsx src/components/ui/enhanced-data-table.tsx src/components/ui/table-selection.tsx src/hooks/useTableSort.ts src/lib/table-sort-preference.ts'
          trap 'git restore --source=HEAD -- $FILES' EXIT
          git restore --source=f31f442cf95149352b1ef283b00e46859b1a1d84 -- $FILES
          set +e
          yarn vitest run --maxWorkers=2 --reporter=json --outputFile=test-results/pr572/edge-red.json src/hooks/__tests__/useTableSort.test.tsx src/components/ui/__tests__/table-selection-range.test.tsx > test-results/pr572/edge-red.log 2>&1
          CODE=$?
          set -e
          test "$CODE" = 1
          node -e 'const r=require("./test-results/pr572/edge-red.json"); if(r.numFailedTests!==22 || r.numPassedTests!==58) process.exit(1); console.log("RED reproduced: 22 failed, 58 passed.");'
          git restore --source=HEAD -- $FILES
          git diff --exit-code
      - name: Run complete Modern frontend suite on the exact repaired source
        working-directory: web/modern
        run: |
          set -euo pipefail
          yarn vitest run --maxWorkers=2 2>&1 | tee test-results/pr572/full.log
      - name: Lint and check translations
        if: always() && steps.install.outcome == 'success'
        working-directory: web/modern
        run: |
          set -euo pipefail
          yarn lint 2>&1 | tee test-results/pr572/lint.log
          yarn check:i18n 2>&1 | tee test-results/pr572/i18n.log
      - name: Build production frontend with compiler and real release guard
        id: build
        if: always() && steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          make build-frontend-modern 2>&1 | tee web/modern/test-results/pr572/build.log
      - name: Install pinned browser test tools
        if: steps.build.outcome == 'success'
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify all six actual production pages on desktop and mobile
        if: steps.build.outcome == 'success'
        working-directory: web/modern
        run: |
          set -euo pipefail
          python3 scripts/test-table-interactions-browser.py 2>&1 | tee test-results/pr572/browser.log
      - name: Preserve exact-source receipts and browser evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git diff --exit-code
          git status --short > evidence/source-status.txt
          cp -r web/modern/test-results evidence/
          git archive HEAD web/modern/src web/modern/scripts web/legacy/browser-release-inputs.json | gzip > evidence/reviewed-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr572-final-qualification
          path: evidence
          retention-days: 7
          if-no-files-found: warn
