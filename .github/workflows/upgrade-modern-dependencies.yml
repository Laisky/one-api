name: Apply final Modern validation fixes

on:
  pull_request:
    branches:
      - agent/modern-upgrade-staging-20260819
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-final-modern-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/modern-upgrade-work-20260819'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      YARN_NETWORK_TIMEOUT: '600000'

    steps:
      - name: Checkout controlled staging head
        uses: actions/checkout@v4
        with:
          ref: agent/modern-upgrade-work-20260819
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Apply final source and configuration fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          topup = Path('web/modern/src/pages/topup/TopUpPage.tsx')
          text = topup.read_text()
          text = text.replace(
              ".min(minTopUpUSD, { error: tr('stripe.min', `Minimum is ${minTopUpUSD}`, { value: minTopUpUSD }) })",
              ".min(minTopUpUSD, { error: tr('stripe.min', `Minimum is $${minTopUpUSD}`, { value: minTopUpUSD }) })",
          )
          old_submit = """  const onStripeSubmit = async (data: StripeForm) => {
            setIsStripeSubmitting(true);"""
          new_submit = """  const onStripeSubmit = async (data: StripeForm) => {
            if (data.amount_usd < minTopUpUSD) {
              stripeForm.setError('amount_usd', {
                type: 'min',
                message: tr('stripe.min', `Minimum is $${minTopUpUSD}`, { value: minTopUpUSD }),
              });
              return;
            }
            setIsStripeSubmitting(true);"""
          if old_submit in text:
              text = text.replace(old_submit, new_submit)
          elif new_submit not in text:
              raise SystemExit('TopUp submit handler shape changed')
          topup.write_text(text)

          tailwind = Path('web/modern/tailwind.config.js')
          text = tailwind.read_text()
          for line in [
              "      touch: { raw: '(hover: none) and (pointer: coarse)' },\n",
              "      'no-touch': { raw: '(hover: hover) and (pointer: fine)' },\n",
              "      portrait: { raw: '(orientation: portrait)' },\n",
              "      landscape: { raw: '(orientation: landscape)' },\n",
              "      'reduce-motion': { raw: '(prefers-reduced-motion: reduce)' },\n",
              "      'high-contrast': { raw: '(prefers-contrast: high)' },\n",
          ]:
              text = text.replace(line, '')
          tailwind.write_text(text)

          css = Path('web/modern/src/index.css')
          text = css.read_text()
          marker = "@config '../tailwind.config.js';\n"
          variants = """

          @custom-variant touch (@media (hover: none) and (pointer: coarse));
          @custom-variant no-touch (@media (hover: hover) and (pointer: fine));
          @custom-variant portrait (@media (orientation: portrait));
          @custom-variant landscape (@media (orientation: landscape));
          @custom-variant reduce-motion (@media (prefers-reduced-motion: reduce));
          @custom-variant high-contrast (@media (prefers-contrast: high));
          """.strip('\n') + '\n'
          if '@custom-variant touch ' not in text:
              if marker not in text:
                  raise SystemExit('Tailwind config marker missing from index.css')
              text = text.replace(marker, marker + '\n' + variants)
          css.write_text(text)

          vite = Path('web/modern/vite.config.ts')
          text = vite.read_text().replace("        tryCatchDeoptimization: false,\n", '')
          vite.write_text(text)

          package_path = Path('web/modern/package.json')
          package_json = json.loads(package_path.read_text())
          package_json['dependencies']['react-is'] = '^19.2.8'
          package_json['dependencies'] = dict(sorted(package_json['dependencies'].items()))
          package_path.write_text(json.dumps(package_json, indent=2) + '\n')

          for temporary in [
              Path('web/modern/scripts/apply-latest-compat.mjs'),
              Path('web/modern/scripts/finalize-latest-compat.mjs'),
              Path('.github/modern-upgrade-diagnostics.md'),
              Path('.github/modern-upgrade-vitest.json'),
          ]:
              temporary.unlink(missing_ok=True)
          PY

      - name: Regenerate lockfile and validate direct versions
        working-directory: web/modern
        run: |
          rm -rf node_modules
          yarn install --non-interactive --network-timeout "$YARN_NETWORK_TIMEOUT"
          npx --yes npm-check-updates@latest --target latest --errorLevel 2

      - name: Commit final validation fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            web/modern/package.json \
            web/modern/yarn.lock \
            web/modern/tailwind.config.js \
            web/modern/vite.config.ts \
            web/modern/src/index.css \
            web/modern/src/pages/topup/TopUpPage.tsx \
            web/modern/scripts \
            .github/modern-upgrade-diagnostics.md \
            .github/modern-upgrade-vitest.json
          if git diff --cached --quiet; then
            echo 'No final validation fixes remain.'
          else
            git commit -m 'fix(modern): resolve final latest-dependency validation issues'
            git push origin HEAD:agent/modern-upgrade-work-20260819
          fi
