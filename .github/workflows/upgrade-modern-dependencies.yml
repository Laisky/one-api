name: Validate modern latest-stable upgrade

on:
  pull_request:
    branches:
      - agent/modern-upgrade-staging-20260819
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: validate-modern-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/modern-upgrade-work-20260819'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: 'true'
      YARN_NETWORK_TIMEOUT: '600000'

    steps:
      - name: Checkout the immutable pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Frozen install
        working-directory: web/modern
        run: yarn install --frozen-lockfile --non-interactive --network-timeout "$YARN_NETWORK_TIMEOUT"

      - name: Verify every direct dependency is current
        working-directory: web/modern
        run: npx --yes npm-check-updates@latest --target latest --errorLevel 2

      - name: Type-check with TypeScript 7
        if: always()
        working-directory: web/modern
        run: yarn type-check

      - name: Lint with ESLint 10
        if: always()
        working-directory: web/modern
        run: yarn lint

      - name: Validate translations
        if: always()
        working-directory: web/modern
        run: yarn check:i18n

      - name: Run all unit tests
        if: always()
        working-directory: web/modern
        run: yarn test --run --passWithNoTests

      - name: Build the production bundle
        if: always()
        working-directory: web/modern
        run: yarn build:prod
