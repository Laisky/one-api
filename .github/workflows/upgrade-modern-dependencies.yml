name: Apply final amount validation fix

on:
  pull_request:
    branches:
      - agent/modern-upgrade-staging-20260819
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-final-amount-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/modern-upgrade-work-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout controlled staging head
        uses: actions/checkout@v4
        with:
          ref: agent/modern-upgrade-work-20260819
          fetch-depth: 0

      - name: Route dynamic minimum validation through Zod
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('web/modern/src/pages/topup/TopUpPage.tsx')
          text = path.read_text()
          old = '                                min={minTopUpUSD}\n'
          if old in text:
              text = text.replace(old, '', 1)
          elif 'min={minTopUpUSD}' in text:
              raise SystemExit('Unexpected amount-input indentation')
          path.write_text(text)
          PY

      - name: Commit final amount validation fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/modern/src/pages/topup/TopUpPage.tsx
          if git diff --cached --quiet; then
            echo 'Amount input already delegates minimum validation to Zod.'
          else
            git commit -m 'fix(modern): delegate dynamic minimum validation to Zod'
            git push origin HEAD:agent/modern-upgrade-work-20260819
          fi
