name: Apply final modern compatibility fixes

on:
  pull_request:
    branches:
      - agent/modern-upgrade-staging-20260819
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-modern-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/modern-upgrade-work-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout controlled staging head
        uses: actions/checkout@v4
        with:
          ref: agent/modern-upgrade-work-20260819
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply idempotent final compatibility fixes
        run: node web/modern/scripts/finalize-latest-compat.mjs

      - name: Commit final source compatibility fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            web/modern/package.json \
            web/modern/eslint.config.js \
            web/modern/src/index.css \
            web/modern/src/lib/table.ts \
            web/modern/src/pages/channels/schemas.ts \
            web/modern/src/pages/topup/TopUpPage.tsx \
            web/modern/src/pages/dashboard/components/UsageSections.tsx \
            web/modern/src/components/chat/ChatInterface.tsx \
            web/modern/src/components/ui/data-table.tsx \
            web/modern/src/components/ui/enhanced-data-table.tsx \
            web/modern/src/test/setup.ts \
            web/modern/vite.config.ts
          if git diff --cached --quiet; then
            echo 'No final compatibility changes remain.'
          else
            git commit -m 'fix(modern): finalize latest dependency compatibility'
            git push origin HEAD:agent/modern-upgrade-work-20260819
          fi
