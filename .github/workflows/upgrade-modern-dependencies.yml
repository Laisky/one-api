name: Apply final Modern compatibility fixes

on:
  pull_request:
    branches:
      - agent/modern-upgrade-staging-20260819
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-final-modern-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/modern-upgrade-work-20260819'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      YARN_NETWORK_TIMEOUT: '600000'

    steps:
      - name: Checkout controlled staging head
        uses: actions/checkout@v4
        with:
          ref: agent/modern-upgrade-work-20260819
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Delegate amount validation to React Hook Form and Zod
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('web/modern/src/pages/topup/TopUpPage.tsx')
          text = path.read_text()
          old = '<form onSubmit={stripeForm.handleSubmit(onStripeSubmit)} className="space-y-5">'
          new = '<form noValidate onSubmit={stripeForm.handleSubmit(onStripeSubmit)} className="space-y-5">'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Stripe form declaration could not be located')
          path.write_text(text)
          PY

      - name: Install the Vite 8 esbuild peer at latest stable
        working-directory: web/modern
        run: |
          yarn add --dev esbuild@latest --non-interactive --network-timeout "$YARN_NETWORK_TIMEOUT"
          npx --yes npm-check-updates@latest --target latest --errorLevel 2

      - name: Commit final compatibility fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            web/modern/package.json \
            web/modern/yarn.lock \
            web/modern/src/pages/topup/TopUpPage.tsx
          if git diff --cached --quiet; then
            echo 'No final compatibility changes remain.'
          else
            git commit -m 'fix(modern): complete Vite 8 and form validation migration'
            git push origin HEAD:agent/modern-upgrade-work-20260819
          fi
