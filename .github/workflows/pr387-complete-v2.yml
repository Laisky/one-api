name: Complete PR 387 MCP implementation v2

on:
  push:
    branches:
      - feat/mcp-2026-07-28-protocol
    paths:
      - .github/scripts/pr387_repair_v2.py
      - .github/workflows/pr387-complete-v2.yml

permissions:
  contents: write

concurrency:
  group: pr387-complete-v2
  cancel-in-progress: false

jobs:
  repair-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcp-2026-07-28-protocol
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Apply deterministic repairs
        shell: bash
        run: |
          set -o pipefail
          {
            if [ -f .github/scripts/pr387_repair.py ]; then
              python3 .github/scripts/pr387_repair.py
            fi
            python3 .github/scripts/pr387_repair_v2.py
          } 2>&1 | tee /tmp/pr387-repair.log

      - name: Format changed Go files
        shell: bash
        run: |
          set -o pipefail
          {
            mapfile -t files < <(git status --porcelain=v1 | sed -E 's/^.. //' | grep '\.go$' || true)
            if [ ${#files[@]} -gt 0 ]; then
              gofmt -w "${files[@]}"
            fi
          } 2>&1 | tee /tmp/pr387-format.log

      - name: Validate complete implementation
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== git diff --check ==='
            git diff --check
            echo '=== focused MCP behavior tests ==='
            go test -count=1 ./relay/mcp ./model ./controller
            echo '=== go vet ==='
            go vet ./...
            echo '=== race-enabled full Go tests ==='
            go test -race -count=1 ./...
            echo '=== Modern frontend build ==='
            make build-frontend-modern
          } 2>&1 | tee /tmp/pr387-validation.log

      - name: Capture working diff
        if: always()
        shell: bash
        run: |
          git status --short > /tmp/pr387-status.txt
          git diff --stat > /tmp/pr387-diff-stat.txt
          git diff > /tmp/pr387-working.diff

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr387-completion-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            /tmp/pr387-repair.log
            /tmp/pr387-format.log
            /tmp/pr387-validation.log
            /tmp/pr387-status.txt
            /tmp/pr387-diff-stat.txt
            /tmp/pr387-working.diff

      - name: Remove temporary repair assets
        run: |
          rm -f .github/scripts/pr387_repair.py
          rm -f .github/scripts/pr387_repair_v2.py
          rm -f .github/workflows/pr387-complete.yml
          rm -f .github/workflows/pr387-complete-v2.yml
          rm -f .github/workflows/pr387-source-snapshot.yml

      - name: Commit and push validated implementation
        shell: bash
        run: |
          git config user.name 'Laisky.Cai'
          git config user.email 'github@laisky.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No validated changes remain to commit.'
            exit 0
          fi
          git commit -m 'fix(mcp): complete end-to-end gateway protocol behavior' \
            -m 'Preserve lossless case-sensitive tool metadata across synchronization and proxying, harden modern and legacy transports, propagate validation semantics, and add end-to-end behavior coverage.'
          git push origin HEAD:feat/mcp-2026-07-28-protocol
