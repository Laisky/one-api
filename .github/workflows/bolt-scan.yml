name: bolt-paired-diagnostics

on:
  push:
    branches:
      - 'bolt/perf-20260818'

permissions:
  contents: write

jobs:
  go_compare:
    if: github.actor != 'github-actions[bot]'
    name: Go race ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            ref: b59a43af8a32f0f570d70e8e79f799cc539674b7
          - variant: optimized
            ref: 751077d5ef653e404aa5eb2440ea35436ec233f4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oneapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=20s
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d oneapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=10s
    env:
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi?sslmode=disable
      MYSQL_LOG_DSN: root:root@tcp(127.0.0.1:3306)/oneapi_log?charset=utf8mb4&parseTime=True&loc=Local
      PG_LOG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi_log?sslmode=disable
      COMPACT_UUID_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      COMPACT_UUID_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi?sslmode=disable
      COMPACT_UUID_TEST_LOG_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi_log?charset=utf8mb4&parseTime=True&loc=Local
      COMPACT_UUID_TEST_LOG_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi_log?sslmode=disable
      COMPACT_UUID_TEST_POSTGRES_BASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi_workload_base?sslmode=disable
      ONEAPI_REQUIRE_DB_BACKENDS: '1'
      CGO_ENABLED: '1'
    steps:
      - name: Checkout compared revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Install runtime and database clients
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg mysql-client postgresql-client

      - name: Create secondary databases
        env:
          MYSQL_PWD: root
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 3306 -uroot \
            -e "CREATE DATABASE IF NOT EXISTS oneapi_log CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
          for db in oneapi_log oneapi_workload_base; do
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc \
              "SELECT 1 FROM pg_database WHERE datname = '${db}'" | grep -q 1 \
              || psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -c "CREATE DATABASE ${db};"
          done

      - name: Run and capture full race suite
        id: tests
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          go test -race -v ./... > diagnostic/full.log 2>&1
          status=$?
          set -e
          printf 'variant=%s\nref=%s\nstatus=%s\n' \
            '${{ matrix.variant }}' '${{ matrix.ref }}' "$status" > diagnostic/status.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          lines = Path('diagnostic/full.log').read_text(errors='replace').splitlines()
          patterns = re.compile(
              r'(^--- FAIL:|^FAIL(?:\s|$)|panic:|fatal error:|WARNING: DATA RACE|'
              r'Error Trace:|Error:|expected:|actual  :)'
          )
          selected = []
          seen = set()
          for i, line in enumerate(lines):
              if patterns.search(line):
                  for candidate in lines[max(0, i - 3):min(len(lines), i + 8)]:
                      if candidate not in seen:
                          selected.append(candidate)
                          seen.add(candidate)
          selected.extend(['', '=== FINAL 250 LINES ===', *lines[-250:]])
          Path('diagnostic/failure-extract.txt').write_text('\n'.join(selected) + '\n')
          PY
          exit 0

      - name: Upload Go diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.variant }}
          path: diagnostic/
          retention-days: 1

  frontend_compare:
    if: github.actor != 'github-actions[bot]'
    name: Frontend ${{ matrix.app }} ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, optimized]
        app: [modern, air, berry]
        include:
          - variant: baseline
            ref: b59a43af8a32f0f570d70e8e79f799cc539674b7
          - variant: optimized
            ref: 751077d5ef653e404aa5eb2440ea35436ec233f4
    steps:
      - name: Resolve revision
        id: revision
        shell: bash
        run: |
          if [[ '${{ matrix.variant }}' == baseline ]]; then
            echo 'ref=b59a43af8a32f0f570d70e8e79f799cc539674b7' >> "$GITHUB_OUTPUT"
          else
            echo 'ref=751077d5ef653e404aa5eb2440ea35436ec233f4' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout compared revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: web/${{ matrix.app }}/yarn.lock

      - name: Install dependencies
        working-directory: web/${{ matrix.app }}
        run: yarn install --network-timeout 600000

      - name: Run and capture frontend checks
        working-directory: web/${{ matrix.app }}
        env:
          CI: true
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic
          if [[ '${{ matrix.app }}' == modern ]]; then
            yarn test --run --passWithNoTests > diagnostic/test.log 2>&1
          else
            yarn test --watchAll=false --passWithNoTests > diagnostic/test.log 2>&1
          fi
          test_status=$?

          lint_status=0
          type_status=0
          build_status=0
          if [[ '${{ matrix.app }}' == modern ]]; then
            yarn lint > diagnostic/lint.log 2>&1
            lint_status=$?
            yarn type-check > diagnostic/type-check.log 2>&1
            type_status=$?
            yarn build > diagnostic/build.log 2>&1
            build_status=$?
          fi
          set -e

          printf 'variant=%s\nref=%s\napp=%s\ntest_status=%s\nlint_status=%s\ntype_status=%s\nbuild_status=%s\n' \
            '${{ matrix.variant }}' '${{ steps.revision.outputs.ref }}' '${{ matrix.app }}' \
            "$test_status" "$lint_status" "$type_status" "$build_status" \
            > diagnostic/status.txt
          for log in diagnostic/*.log; do
            {
              echo "=== $log ==="
              tail -n 200 "$log"
            } >> diagnostic/failure-extract.txt
          done
          exit 0

      - name: Upload frontend diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.variant }}-${{ matrix.app }}
          path: web/${{ matrix.app }}/diagnostic/
          retention-days: 1

  report:
    if: always() && github.actor != 'github-actions[bot]'
    name: Record paired diagnostic
    needs: [go_compare, frontend_compare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: bolt/perf-20260818

      - name: Download diagnostics
        uses: actions/download-artifact@v4
        with:
          pattern: '*-baseline*'
          path: downloaded
          merge-multiple: false

      - name: Download optimized diagnostics
        uses: actions/download-artifact@v4
        with:
          pattern: '*-optimized*'
          path: downloaded
          merge-multiple: false

      - name: Commit concise comparison
        shell: bash
        run: |
          set -euo pipefail
          result=".bolt-tmp/paired-diagnostic-${GITHUB_SHA}.txt"
          mkdir -p .bolt-tmp
          {
            echo "workflow_commit=${GITHUB_SHA}"
            echo
            echo '=== STATUS FILES ==='
            find downloaded -name status.txt -print0 | sort -z | xargs -0 -r -I{} sh -c 'echo "--- {}"; cat "{}"; echo'
            echo
            echo '=== FAILURE EXTRACTS ==='
            find downloaded -name failure-extract.txt -print0 | sort -z | xargs -0 -r -I{} sh -c 'echo "--- {}"; cat "{}"; echo'
          } > "$result"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$result"
          git commit -m "ci: record paired Bolt diagnostics for ${GITHUB_SHA}"
          git push
