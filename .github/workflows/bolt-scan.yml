name: bolt-verify

on:
  push:
    branches:
      - 'bolt/perf-20260818'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run correctness checks and benchmark
        shell: bash
        run: |
          set -u
          mkdir -p .bolt-tmp
          result=".bolt-tmp/result-${GITHUB_SHA}.txt"

          set +e
          {
            echo "commit=${GITHUB_SHA}"
            go version
            echo
            echo '=== Exact unit test ==='
            go test -count=1 -v ./relay/adaptor/aiproxy -run '^TestAIProxyDocuments2Markdown$' &&
            echo &&
            echo '=== Existing externally observable stream behavior test ===' &&
            go test -count=1 -v ./relay/adaptor/aiproxy -run '^TestStreamHandler_RoutesDocumentsThroughRewriter$' &&
            echo &&
            echo '=== Benchmark (same runner, 10 samples, 750 ms each) ===' &&
            go test ./relay/adaptor/aiproxy -run '^$' -bench '^BenchmarkAIProxyDocuments2Markdown$' -benchmem -benchtime=750ms -count=10
          } > "$result" 2>&1
          status=$?
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$result"
          git commit -m "ci: record Bolt verification for ${GITHUB_SHA}"
          git push
          exit "$status"
