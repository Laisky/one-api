name: bolt-final-package-verification

on:
  push:
    branches:
      - 'bolt/perf-20260818'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout final optimization commit
        uses: actions/checkout@v4
        with:
          ref: 751077d5ef653e404aa5eb2440ea35436ec233f4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run final package verification
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/bolt-result
          result=/tmp/bolt-result/final-package.txt
          set +e
          {
            echo 'commit=751077d5ef653e404aa5eb2440ea35436ec233f4'
            go version
            echo
            echo '=== gofmt ==='
            unformatted="$(gofmt -s -l relay/adaptor/aiproxy/main.go relay/adaptor/aiproxy/documents_benchmark_test.go)"
            test -z "$unformatted" || { echo "$unformatted"; false; }
            echo PASS
            echo
            echo '=== full aiproxy package with race detector ==='
            go test -race -count=1 -v ./relay/adaptor/aiproxy
            echo
            echo '=== focused behavior equivalence tests ==='
            go test -race -count=10 ./relay/adaptor/aiproxy -run '^(TestAIProxyDocuments2Markdown|TestStreamHandler_RoutesDocumentsThroughRewriter)$'
            echo
            echo '=== benchmark smoke check ==='
            go test ./relay/adaptor/aiproxy -run '^$' -bench '^BenchmarkAIProxyDocuments2Markdown$' -benchmem -benchtime=250ms -count=1
          } > "$result" 2>&1
          status=$?
          echo "status=$status" >> "$result"
          set -e

          git checkout bolt/perf-20260818
          mkdir -p .bolt-tmp
          cp "$result" ".bolt-tmp/final-package-${GITHUB_SHA}.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ".bolt-tmp/final-package-${GITHUB_SHA}.txt"
          git commit -m "ci: record final Bolt package verification for ${GITHUB_SHA}"
          git push
          exit "$status"
