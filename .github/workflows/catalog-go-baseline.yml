name: Catalog Go baseline
on:
  push:
    branches: [work/catalog-go-baseline-20260924]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a8782e3dc0dad7704acb0d008e7d30a26096338d
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Record source and initialized catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/toolchain"
          git rev-parse HEAD > "$RUNNER_TEMP/source/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source/tree.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/source/source.tar"
          go mod download
          go test -count=1 -json -run '^TestCompiledAdaptorCatalogSnapshot$' ./relay > "$RUNNER_TEMP/source/catalog-baseline.jsonl"
          go version > "$RUNNER_TEMP/toolchain/go-version.txt"
          tar -C "$(go env GOROOT)" -czf "$RUNNER_TEMP/toolchain/sdk.tgz" .
          tar -C "$(go env GOMODCACHE)" -czf "$RUNNER_TEMP/toolchain/modules.tgz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-go-pinned-source
          path: ${{ runner.temp }}/source
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-go-offline-toolchain
          path: ${{ runner.temp }}/toolchain
          compression-level: 0
          retention-days: 1
