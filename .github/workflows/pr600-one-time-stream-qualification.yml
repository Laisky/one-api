# Temporary on-PR regression qualification for #600. Remove after recording results.
name: PR600 one-time streaming qualification
on:
  pull_request:
    types: [synchronize, opened, reopened]
permissions:
  contents: read
jobs:
  stream_regression:
    if: github.event.pull_request.number == 600
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR head, without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: \${{ github.event.pull_request.head.sha }}
      - name: Use repository-pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
      - name: Focused green acceptance under race detector
        env:
          GOMAXPROCS: '4'
        run: |
          set -euo pipefail
          go test -race -p=4 -count=10 -timeout=240s ./relay/adaptor/openai_compatible \
            -run '^(TestSharedStreamDoneCancellation|TestIssue599NativeHTTPReadAfterDONE|TestIssue599IndependentFailurePreserved|TestIssue599JoinedCancellationCausePreservesIndependentErrors|TestIssue599PureCancellationCauseStillCompletes)$'
      - name: Negative control - reject false transport provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("relay/adaptor/openai_compatible/stream_done_cancellation_test.go")
          old = "func (b *issue599Boundary) Unwrap() io.ReadCloser { return b.ReadCloser }"
          assert path.read_text().count(old) == 1
          path.write_text(path.read_text().replace(old, "func (b *issue599Boundary) Unwrap() io.ReadCloser { return nil }", 1))
          PY
          set +e
          go test -p=4 -count=1 -timeout=90s ./relay/adaptor/openai_compatible \
            -run '^TestIssue599NativeHTTPReadAfterDONE$/^measured_done$/^00$' > "$RUNNER_TEMP/negative-provenance.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/negative-provenance.log"
          git checkout -- relay/adaptor/openai_compatible/stream_done_cancellation_test.go
          if [ "$status" -eq 0 ]; then
            echo "::error::Broken Unwrap was not rejected by the tests"
            exit 1
          fi
          grep -F -- '--- FAIL: TestIssue599NativeHTTPReadAfterDONE/measured_done/00' "$RUNNER_TEMP/negative-provenance.log"
      - name: Negative control - independent error must not be swallowed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("relay/adaptor/openai_compatible/unified_streaming.go")
          old = "if errkind.HasOnlyCause(err, io.EOF) {\n\t\t\t\tbreak"
          new = "if errors.Is(err, net.ErrClosed) || errkind.HasOnlyCause(err, io.EOF) {\n\t\t\t\tbreak"
          assert path.read_text().count(old) == 1
          path.write_text(path.read_text().replace(old, new, 1))
          PY
          set +e
          go test -p=4 -count=1 -timeout=90s ./relay/adaptor/openai_compatible \
            -run '^TestSharedStreamDoneCancellation$/^independent_closed_without_cancel$' > "$RUNNER_TEMP/negative-independent-error.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/negative-independent-error.log"
          git checkout -- relay/adaptor/openai_compatible/unified_streaming.go
          if [ "$status" -eq 0 ]; then
            echo "::error::Independent failure was swallowed without detection"
            exit 1
          fi
          grep -F -- '--- FAIL: TestSharedStreamDoneCancellation/independent_closed_without_cancel' "$RUNNER_TEMP/negative-independent-error.log"
