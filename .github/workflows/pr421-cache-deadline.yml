name: PR 421 refund cache deadline qualification
on:
  push:
    branches: [work/pr421-cache-deadline-20260922]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Apply the already qualified recovery source and deadline guard
        run: python3 .github/pr421-prepare-final.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prove the database read previously ignored cancellation
        run: |
          cp model/cache.go "$RUNNER_TEMP/fixed-cache.go"
          git show c8b2585c1cf962ca755aab564f97480bbdf4893f:model/cache.go > model/cache.go
          set +e
          go test -race -count=1 -timeout=3m -json ./model -run '^TestQuotaRefundCacheRefreshDeadline$' > "$RUNNER_TEMP/cache-negative.jsonl" 2>&1
          result=$?
          set -e
          cp "$RUNNER_TEMP/fixed-cache.go" model/cache.go
          test "$result" -ne 0
          python3 - "$RUNNER_TEMP/cache-negative.jsonl" <<'PY'
          import json,sys
          text=open(sys.argv[1]).read()
          assert '[build failed]' not in text,text[-10000:]
          rows=[json.loads(s) for s in text.splitlines() if s.startswith('{')]
          assert any(r.get('Action')=='fail' and r.get('Test')=='TestQuotaRefundCacheRefreshDeadline' for r in rows),text[-10000:]
          PY
      - name: Verify refund recovery, ledger ownership and cache behavior
        if: always()
        run: go test -race -count=1 -timeout=6m -json ./model ./relay/controller -run '^Test(QuotaRefund|CacheUpdateUserQuota|PR421(TransientRefund|PendingRefund|RollbackRetry)).*' > "$RUNNER_TEMP/cache-positive.jsonl" 2>&1
      - name: Vet the changed model package
        if: always()
        run: go vet ./model > "$RUNNER_TEMP/cache-vet.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr421-refund-cache-deadline
          path: |
            ${{ runner.temp }}/cache-*.jsonl
            ${{ runner.temp }}/cache-vet.log
          retention-days: 7
  publish:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/pr421-cache-deadline-20260922
      - name: Publish the exact qualified source without temporary infrastructure
        env:
          QUALIFIED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          python3 .github/pr421-prepare-final.py
          git rm .github/pr421-refund-recovery.xz .github/workflows/pr421-refund-recovery.yml .github/workflows/pr421-cache-deadline.yml .github/pr421-prepare-final.py
          git add main.go model relay/controller docs/model-protocol-support-20260922.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover owned refunds and bound their cache refresh'
          git push origin HEAD:refs/heads/work/pr421-cache-deadline-20260922
