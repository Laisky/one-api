# Read-only post-release probe; no browser execution, credentials or telemetry events.
name: OneAPI public release smoke
on:
  push:
    branches: [qualification/oneapi-recovery-20261014]
    paths: [.github/workflows/recovery-public-smoke.yml]
permissions:
  contents: read
jobs:
  public_https:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ef27439cd888c4bb5d36270b9a415cfea088d48f
      EXPECTED_COMMIT_TIME: '2026-10-14T03:32:32Z'
    steps:
      - name: Verify expected public release without changing settings or sending events
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,re,time,urllib.error,urllib.parse,urllib.request
          from email.message import Message
          from html.parser import HTMLParser
          origin='https://oneapi.laisky.com';expected=os.environ['EXPECTED_SHA']
          commit_time=os.environ['EXPECTED_COMMIT_TIME']
          out=pathlib.Path('evidence');out.mkdir()
          report={'expected_source':expected,'expected_commit_time':commit_time,'method':'anonymous GET only; TLS verification enabled; no JavaScript execution','passed':False,'observations':[],'assets':[]}
          def expected_display(sha,at):
              """expected_display renders the pinned untagged Go build's public version."""
              if not isinstance(sha,str) or re.fullmatch(r'[0-9a-f]{40}',sha) is None:raise ValueError('Invalid expected source SHA')
              stamp=datetime.datetime.strptime(at,'%Y-%m-%dT%H:%M:%SZ')
              return f'v0.0.0-{stamp:%Y%m%d%H%M%S}-{sha[:12]} {at} ({sha[:7]})'
          def public_version_matches(value,sha,at):
              """public_version_matches compares the complete display, never a substring."""
              return isinstance(value,str) and value==expected_display(sha,at)
          def test_version_contract():
              """test_version_contract preserves positive, mismatch and dirty-build controls."""
              sha='ef27439cd888c4bb5d36270b9a415cfea088d48f';at='2026-10-14T03:32:32Z'
              displayed='v0.0.0-20261014033232-ef27439cd888 2026-10-14T03:32:32Z (ef27439)'
              assert displayed!=sha, 'Original comparison must reproduce the false failure'
              assert public_version_matches(displayed,sha,at)
              invalid=[None,{},'',sha,sha[:7],displayed+'-dirty',displayed.replace('(ef27439)','(ef27439-dirty)'),displayed.replace('ef27439cd888','ef27439fffff'),displayed.replace('03:32:32Z','03:32:31Z'),displayed.replace('20261014033232','20261014033231'),'prefix '+displayed,displayed+' suffix']
              for value in invalid:assert not public_version_matches(value,sha,at)
              return 1+len(invalid)
          def response_headers(message):
              """response_headers retains every Cache-Control field in wire order (RFC9110 5.3)."""
              headers={key.lower():value for key,value in message.items()}
              headers['cache-control']=', '.join(message.get_all('Cache-Control',[]))
              return headers
          def forbids_storage(value):
              """forbids_storage recognizes an exact no-store directive, excluding quoted copies."""
              parts=[];start=0;quoted=False;escaped=False
              for index,char in enumerate(value):
                  if escaped:escaped=False;continue
                  if quoted and char=='\\':escaped=True;continue
                  if char=='"':quoted=not quoted
                  elif char==',' and not quoted:parts.append(value[start:index].strip().lower());start=index+1
              if quoted or escaped:return False
              parts.append(value[start:].strip().lower())
              return 'no-store' in parts and not any(part.partition('=')[0].strip()=='must-understand' for part in parts)
          def test_header_contract():
              """test_header_contract reproduces duplicate-field loss and rejects lookalike directives."""
              message=Message();message['Cache-Control']='no-store';message['Cache-Control']='public, max-age=86400'
              assert not forbids_storage({k.lower():v for k,v in message.items()}['cache-control'])
              assert response_headers(message)['cache-control']=='no-store, public, max-age=86400'
              assert forbids_storage(response_headers(message)['cache-control'])
              cases=[('no-store',True),('public, NO-STORE',True),('no-store, public, max-age=86400',True),('public, max-age=86400',False),('x-no-store',False),('no-store=false',False),('extension="private,no-store"',False),('extension="no-store", public',False),('extension="x, y", no-store',True),('extension="no-store',False),('no-store, must-understand',False),('',False)]
              for value,wanted in cases:assert forbids_storage(value)==wanted,(value,wanted)
              return 1+len(cases)
          report['version_contract_cases']=test_version_contract()
          report['header_contract_cases']=test_header_contract()
          report['expected_public_version']=expected_display(expected,commit_time)
          class SameOriginRedirect(urllib.request.HTTPRedirectHandler):
              """SameOriginRedirect refuses cross-origin redirects before another request."""
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  """redirect_request follows only the approved HTTPS origin."""
                  target=urllib.parse.urlsplit(newurl)
                  if target.scheme!='https' or target.netloc!='oneapi.laisky.com':raise ValueError('Cross-origin redirect refused')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(SameOriginRedirect())
          def get(path,limit=4*1024*1024):
              """get performs one bounded anonymous same-origin request with verified TLS."""
              target=urllib.parse.urlsplit(urllib.parse.urljoin(origin,path))
              assert target.scheme=='https' and target.netloc=='oneapi.laisky.com'
              request=urllib.request.Request(target.geturl(),headers={'User-Agent':'OneAPI-release-readonly-verification/1.0','Cache-Control':'no-cache'},method='GET')
              try:response=opener.open(request,timeout=10)
              except urllib.error.HTTPError as error:response=error
              with response:
                  data=response.read(limit+1);assert len(data)<=limit,'Public response exceeded bound'
                  return response.status,response_headers(response.headers),data
          try:
              deadline=time.monotonic()+900
              while True:
                  observation={'at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
                  try:
                      status,headers,raw=get('/api/status?release_probe='+expected,256*1024)
                      body=json.loads(raw)
                      version=body.get('data',{}).get('version')
                      observation.update(status=status,success=body.get('success'),public_version=version)
                      if status==200 and body.get('success') is True and public_version_matches(version,expected,commit_time):
                          report['observations'].append(observation);report['observed_public_version']=version;break
                  except (ValueError,urllib.error.URLError,TimeoutError):observation['transport_or_parse_failure']=True
                  report['observations'].append(observation)
                  assert time.monotonic()<deadline,'Expected release did not become visible within the bounded probe'
                  time.sleep(15)
              status,headers,raw=get('/api/browser-config',4096)
              config=json.loads(raw)
              assert status==200 and set(config)=={'sentry'},'Unexpected public configuration projection'
              report['browser_headers']={name:headers.get(name) for name in ['cache-control','x-content-type-options','cf-cache-status','age']}
              assert forbids_storage(headers.get('cache-control','')),'No valid no-store directive'
              assert headers.get('x-content-type-options')=='nosniff','Missing nosniff protection'
              setting=config['sentry']
              assert setting is None or (isinstance(setting,dict) and set(setting)=={'dsn','environment'})
              # Never print/archive DSN/environment values, even from this public projection.
              report['browser_config']={'status':status,'configured':setting is not None,'no_store':True,'nosniff':True}
              status,headers,raw=get('/',1024*1024);assert status==200
              class Entries(HTMLParser):
                  """Entries collects only same-origin compiled scripts and styles."""
                  def __init__(self):
                      """__init__ prepares a fresh bounded entry inventory."""
                      super().__init__();self.assets=[]
                  def handle_starttag(self,tag,attrs):
                      """handle_starttag extracts an eligible public asset without executing it."""
                      attrs=dict(attrs)
                      value=attrs.get('src') if tag=='script' else attrs.get('href') if tag=='link' and attrs.get('rel') in ('stylesheet','modulepreload') else None
                      if value:
                          url=urllib.parse.urlsplit(urllib.parse.urljoin(origin,value))
                          if url.scheme=='https' and url.netloc=='oneapi.laisky.com' and url.path.endswith(('.js','.css')):self.assets.append(url.path)
              entries=Entries();entries.feed(raw.decode());assert entries.assets and len(entries.assets)<=32
              releases=set()
              for path in dict.fromkeys(entries.assets):
                  status,headers,data=get(path);assert status==200
                  assert b'sourceMappingURL=data:' not in data
                  found=re.findall(r'one-api-(?:modern|air|berry)@sha256:[a-f0-9]{64}',data.decode())
                  releases.update(found)
                  asset={'path':path,'status':status,'sha256':hashlib.sha256(data).hexdigest()}
                  if path.endswith('.js'):
                      map_status,map_headers,map_data=get(path+'.map',4*1024*1024)
                      try:map_json=json.loads(map_data)
                      except ValueError:map_json=None
                      assert not (map_status==200 and isinstance(map_json,dict) and 'sources' in map_json and 'mappings' in map_json),'Public source map was exposed'
                      asset['source_map_exposed']=False
                  report['assets'].append(asset)
              assert releases,'No actual deployed browser release identity found in entry assets'
              report.update(passed=True,releases=sorted(releases),completed_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          finally:
              (out/'report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: oneapi-public-release-smoke
          path: evidence
          retention-days: 14
          if-no-files-found: error
