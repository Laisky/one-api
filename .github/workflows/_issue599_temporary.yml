name: Temporary issue-599 focused regression

on:
  push:
    branches:
      - fix/599-request-bound-sse-cancellation

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
      - name: Run issue 599 behavioral regression and adjacent controls with race detection
        env:
          GOMAXPROCS: "4"
        run: |
          go test -race -p=4 -count=3 -timeout=10m ./relay/adaptor/openai_compatible \
            -run '^(TestRequestBoundSSECancelAfterRead|TestIndependentStreamErrorAfterCancellation|TestRequestBoundIndependentTrailingErrors|TestSharedStreamDoneCancellation|TestSharedStreamCanceledEOF)$' -v
