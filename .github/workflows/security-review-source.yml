name: Security review red-green validation
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/security-review-source.yml']
permissions:
  contents: write
jobs:
  validate:
    if: github.event.pull_request.number == 441 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        pr: [441, 442]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Reproduce, fix, verify and update only the selected PR
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/security-review-runner.py')
          text = p.read_text().replace('"--cached", "--check"', '"--cached", "--check", MAIN')
          needle = 'paths = git("ls-files", "-m", "-o", "--exclude-standard", cwd=prepared).splitlines()'
          insertion = '''import runpy
          runpy.run_path(str(ROOT / ".github/security-review-adjustments.py"))["adjust"](PR, prepared)
          if PR == 441:
              source = prepared / "controller/realtime.go"
              source.write_text(source.read_text().replace('\\t"github.com/Laisky/errors/v2"\\n', ""))
          '''
          assert needle in text
          text = text.replace(needle, insertion + needle)
          text = text.replace('"^TestReview", True', '"^Test(Review|GeminiLiveEphemeralRejectionExplainsSupportedTransport|RelayRealtimeSessionsHandlerSignature|DoRequestHelperRedactsQueryCredentialsWithoutChangingDispatch|LogMetadata|LogsToResponses|SanitizeLogUpstreamEndpoint|PostConsumeQuotaDetailedSanitizesUpstreamEndpoint)", True')
          p.write_text(text)
          PY
          python3 .github/security-review-runner.py '${{ matrix.pr }}'
      - name: Preserve observed validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-${{ matrix.pr }}
          path: ${{ runner.temp }}/security-review-${{ matrix.pr }}
          if-no-files-found: warn
          retention-days: 7
