# Temporary PR-only behavior qualification; remove before merging PR #603.
name: PR603 focused behavior qualification
on:
  pull_request:
    paths:
      - 'relay/adaptor/openai/**'
      - 'relay/controller/**'
      - 'relay/model/**'
      - '.github/workflows/pr603-regression.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go 1.27.3
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Execute real behavior regression tests
        run: |
          go test -count=1 -timeout=12m -p=2 \
            -run '^(TestGPT61Terra.*|TestResponseUsageTerra.*)$' \
            ./relay/adaptor/openai ./relay/controller ./relay/model
