name: PR387 validation assets

on:
  push:
    branches:
      - feat/mcp-2026-07-28-protocol

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Pack source and toolchain
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/one-api-pr387-source.tar.gz .
          tar -C "$(dirname "$(go env GOROOT)")" -czf /tmp/go-1.26.3-linux-x64.tar.gz "$(basename "$(go env GOROOT)")"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr387-source-${{ github.sha }}
          path: /tmp/one-api-pr387-source.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload Go toolchain
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr387-go-1.26.3-linux-x64
          path: /tmp/go-1.26.3-linux-x64.tar.gz
          retention-days: 1
          if-no-files-found: error
