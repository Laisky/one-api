name: Model protocol audit
on:
  push:
    branches: [work/model-protocol-audit-20260922]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply candidate
        run: python3 .github/apply-protocol-candidate.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Physical audio test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Affected package race suites
        run: go test -race -count=1 -timeout=15m -json ./relay/adaptor/cohere ./relay/adaptor/zhipu ./relay/adaptor/zai ./relay/adaptor/openai ./relay/adaptor/siliconflow ./relay/adaptor/groq ./relay/adaptor/mistral ./relay/controller ./relay/pricing ./relay/channeltype ./middleware ./controller ./router > "$RUNNER_TEMP/affected.jsonl" 2>&1
      - name: Persisted pricing and usage regressions
        if: always()
        run: go test -race -count=1 -timeout=5m -json ./model -run 'Test.*(ProtocolAudit|Audio|Video|Pricing|ModelPrice|ModelConfig)' > "$RUNNER_TEMP/model.jsonl" 2>&1
      - name: Repository vet
        if: always()
        run: go vet ./... > "$RUNNER_TEMP/vet.log" 2>&1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reproducible inventory and its contracts
        if: always()
        run: |
          go run ./tools/model-protocol-audit "$RUNNER_TEMP/catalog.json"
          node --experimental-strip-types --test scripts/model-protocol-audit.test.mjs > "$RUNNER_TEMP/inventory-tests.log"
          node --experimental-strip-types scripts/model-protocol-audit.mjs "$RUNNER_TEMP/catalog.json" "$RUNNER_TEMP/model-protocol-audit-20260922.csv" > "$RUNNER_TEMP/inventory-summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-go-qualification
          path: |
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/vet.log
            ${{ runner.temp }}/catalog.json
            ${{ runner.temp }}/model-protocol-audit-20260922.csv
            ${{ runner.temp }}/inventory-tests.log
            ${{ runner.temp }}/inventory-summary.json
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply candidate
        run: python3 .github/apply-protocol-candidate.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock
      - name: Install
        working-directory: web/modern
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
      - name: I18n and behavior
        working-directory: web/modern
        run: |
          yarn check:i18n > "$RUNNER_TEMP/i18n.log" 2>&1
          yarn test --run > "$RUNNER_TEMP/frontend.log" 2>&1
      - name: TypeScript and production build
        if: always()
        working-directory: web/modern
        run: yarn build > "$RUNNER_TEMP/build.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-frontend-qualification
          path: ${{ runner.temp }}/*.log
          retention-days: 7
  publish:
    needs: [go, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/model-protocol-audit-20260922
      - uses: actions/download-artifact@v4
        with:
          name: protocol-go-qualification
          path: ${{ runner.temp }}/evidence
      - name: Commit only the qualified source and generated inventory
        env:
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          python3 .github/apply-protocol-candidate.py
          cp "$RUNNER_TEMP/evidence/model-protocol-audit-20260922.csv" docs/
          git add controller model relay web tools scripts docs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: standardize embedding and media protocols with exact billing'
          git push origin HEAD:refs/heads/work/model-protocol-audit-20260922
