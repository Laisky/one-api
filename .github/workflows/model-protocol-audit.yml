name: Model protocol audit
on:
  push:
    branches: [work/model-protocol-audit-20260922]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply candidate
        run: python3 .github/apply-protocol-candidate.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Physical audio test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Functional and billing regressions
        run: go test -race -count=1 -timeout=15m -json ./relay/adaptor/cohere ./relay/adaptor/zhipu ./relay/adaptor/zai ./relay/adaptor/openai ./relay/controller ./model ./relay/pricing ./relay/channeltype -run 'Test(ProtocolAudit|CohereEmbedding|CohereInvalid|AudioTariff|AudioRejected|AudioExact)' > "$RUNNER_TEMP/focused.jsonl" 2>&1
      - name: Repository vet
        if: always()
        run: go vet ./... > "$RUNNER_TEMP/vet.log" 2>&1
      - name: Runtime catalogue inventory
        if: always()
        run: go run .github/protocol-inventory.go "$RUNNER_TEMP/catalog.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-continuation-validation
          path: |
            ${{ runner.temp }}/focused.jsonl
            ${{ runner.temp }}/vet.log
            ${{ runner.temp }}/catalog.json
          retention-days: 7
