name: Stream e2e performance

on:
  pull_request:
    paths:
      - '.github/workflows/stream-e2e-performance.yml'
      - 'tests/stream-perf/**'
      - 'common/**'
      - 'relay/adaptor/openai/**'

permissions:
  contents: read

concurrency:
  group: stream-perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stream-perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare offline tokenizer assets
        run: python3 tests/stream-perf/cache_tokens.py --cache artifacts/token-cache
      - name: Build accepted source and isolated formatting experiment
        run: |
          set -euo pipefail
          mkdir -p artifacts web/build
          if ! find web/build -type f -print -quit | grep -q .; then
            printf '<!doctype html><title>API performance fixture</title>\n' > web/build/index.html
          fi
          go version | tee artifacts/go-version.txt
          git rev-parse HEAD > artifacts/commit.txt
          lscpu > artifacts/lscpu.txt
          uname -a > artifacts/uname.txt
          go build -trimpath -o artifacts/one-api .
          go build -trimpath -o artifacts/stream-perf ./tests/stream-perf
          git archive HEAD | gzip > artifacts/source.tar.gz
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('common/custom_event.go')
          source = path.read_text()
          assert hashlib.sha256(source.encode()).hexdigest() == 'f00eed1c8d77171824a11c8ea93aa01ae2e595565a782bbccded69f3ae956d04'
          assert source.count('formatted := fmt.Sprint(data)') == 1
          candidate = source.replace('formatted := fmt.Sprint(data)', 'formatted, ok := data.(string)\n\tif !ok {\n\t\tformatted = fmt.Sprint(data)\n\t}')
          assert hashlib.sha256(candidate.encode()).hexdigest() == 'bbaf472d1d771e6f331ab9ad6a736e24a684db733c4e0f4c4fe14dc28ec4b8b3'
          path.write_text(candidate)
          PY
          git diff --check
          git diff -- common/custom_event.go > artifacts/iteration4.patch
          sha256sum common/custom_event.go > artifacts/iteration4-source-sha256.txt
          go build -trimpath -o artifacts/one-api-format .
          sha256sum artifacts/one-api artifacts/one-api-format artifacts/stream-perf > artifacts/binary-sha256.txt
      - name: Preserve binaries for same-host paired experiments
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stream-e2e-build-${{ github.event.pull_request.head.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
      - name: Validate the isolated formatting experiment and revert its working tree
        env:
          TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/artifacts/token-cache
        run: |
          set -euo pipefail
          go test -race ./common -run '^TestCustomEvent' -count=1
          git restore -- common/custom_event.go
          go test -race ./common/render ./common/sse
          go test -race ./relay/adaptor/openai -run '^TestStreamHandler' -count=1
      - name: Run correctness against both binaries
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/stream-perf -p 'test_*.py'
          for variant in one-api one-api-format; do
            python3 tests/stream-perf/run.py --binary "$PWD/artifacts/$variant" --driver "$PWD/artifacts/stream-perf" --token-cache "$PWD/artifacts/token-cache" --output "$PWD/validation/$variant" --requests 16 --paced-requests 16 --chunks 32 --repeats 1 --concurrency 1,8 --debug-logs
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stream-e2e-validation-${{ github.event.pull_request.head.sha }}
          path: validation/
          retention-days: 7
          if-no-files-found: warn
