name: Stream e2e performance

on:
  pull_request:
    paths:
      - '.github/workflows/stream-e2e-performance.yml'
      - 'tests/stream-perf/**'
      - 'common/sse/**'
      - 'common/render/**'
      - 'relay/adaptor/openai/**'

permissions:
  contents: read

concurrency:
  group: stream-perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stream-perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare offline tokenizer assets
        run: python3 tests/stream-perf/cache_tokens.py --cache artifacts/token-cache
      - name: Build gateway and preserve environment
        run: |
          set -euo pipefail
          mkdir -p artifacts web/build
          if ! find web/build -type f -print -quit | grep -q .; then
            printf '<!doctype html><title>API performance fixture</title>\n' > web/build/index.html
          fi
          go version | tee artifacts/go-version.txt
          git rev-parse HEAD > artifacts/commit.txt
          lscpu > artifacts/lscpu.txt
          uname -a > artifacts/uname.txt
          go build -trimpath -o artifacts/one-api .
          go build -trimpath -o artifacts/stream-perf ./tests/stream-perf
          sha256sum artifacts/one-api artifacts/stream-perf > artifacts/binary-sha256.txt
          git archive HEAD | gzip > artifacts/source.tar.gz
      - name: Validate stream and line-reader behavior
        env:
          TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/artifacts/token-cache
        run: |
          set -euo pipefail
          go test -race ./common/render ./common/sse
          go test -race ./relay/adaptor/openai -run '^TestStreamHandler' -count=1
          go test ./relay/adaptor/openai -run '^TestStreamHandlerAccumulationPreservesOutput$' -bench '^BenchmarkStreamHandlerLongResponse$' -benchmem -benchtime=300ms -count=3 | tee artifacts/accumulation-benchmark.txt
      - name: Run streaming correctness and smoke load
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/stream-perf -p 'test_*.py'
          python3 tests/stream-perf/run.py --binary "$PWD/artifacts/one-api" --driver "$PWD/artifacts/stream-perf" --token-cache "$PWD/artifacts/token-cache" --output "$PWD/artifacts/results" --requests 16 --paced-requests 16 --chunks 32 --repeats 1 --concurrency 1,8 --debug-logs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stream-e2e-${{ github.event.pull_request.head.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
