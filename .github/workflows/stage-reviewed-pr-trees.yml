name: Stage reviewed PR trees
on:
  push:
    branches: [codex/review-stage-444-449-20261003]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reconstruct and validate reviewed trees
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: Laisky
          GIT_AUTHOR_EMAIL: github@laisky.com
          GIT_COMMITTER_NAME: Laisky
          GIT_COMMITTER_EMAIL: github@laisky.com
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request

          repository = 'Laisky/one-api'
          stage = 'codex/review-stage-444-449-20261003'
          base = '567b7b910065e4b7f63843ed470fc6005f5ac519'
          base_tree = '472114d85a13fd36ef455ed99fd94d0e79bcfc49'
          blobs = [
              'add4ac009e2c0dd371b8fa10a8c5bd0188552137',
              '90beeb84be4f1bc1be832d951b75ae0260e06a67',
              '2dd916eae24085f68cc0293073b5158bec8d6016',
              '1fbea3d513110579ccd268716e72f3282a556049',
              '6e2f7764afa807fec0952d4a259b4d8854e03190',
              'a3651d41cda3169cc591a49206aa46058d49ba26',
          ]
          canonical = {
              444: '4c5da30fbf3bbf12b4ebf3cde1f62d117e51d136',
              445: 'cd200f914b5adabbf0d0994b865d9848350e0d5c',
              446: '638c486617b9f9c68e8efbb7521dc03e106b463f',
              447: '842ee7a9299ac5bd26a680dfa0af57c9ecf416a7',
              448: '96a6310ea7ace5b19ba919cd47fba590f3a2b5dc',
              449: 'b0ae56f5b89038f512f8b47880beca146c912389',
          }

          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data).decode().strip()

          pieces = []
          for sha in blobs:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  item = json.load(response)
              raw = base64.b64decode(item['content'])
              if hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() != sha:
                  raise RuntimeError('Transfer blob checksum mismatch')
              pieces.append(raw)
          compressed = b''.join(pieces)
          if hashlib.sha256(compressed).hexdigest() != '6803393e5e24181328274872f90925e1fcddbbc0833cbb57d206511e9e666f3d':
              raise RuntimeError('Reviewed payload checksum mismatch')
          payload = json.loads(gzip.decompress(compressed))
          if payload['base'] != base or git('rev-parse', base + '^{tree}') != base_tree:
              raise RuntimeError('Incorrect pinned baseline')
          if git('ls-remote', 'origin', 'refs/heads/main').split()[0] != base:
              raise RuntimeError('Main moved; reconcile before publication')
          for item in payload['prs']:
              current = git('ls-remote', 'origin', 'refs/heads/' + item['branch']).split()[0]
              if current != item['expected_head']:
                  raise RuntimeError(f"PR {item['number']} moved; reconcile concurrent work")

          parent = git('rev-parse', 'HEAD')
          manifest = {'base': base, 'base_tree': base_tree, 'prs': []}
          for item in payload['prs']:
              # Discard only the previous staged patch in this disposable runner.
              git('reset', '--hard', base)
              git('apply', '--index', '--whitespace=error', '-', data=item['patch'].encode())
              git('diff', '--cached', '--check')
              paths = git('diff', '--cached', '--name-only').splitlines()
              if paths != sorted(item['paths']):
                  raise RuntimeError(f"PR {item['number']} changed unexpected paths: {paths}")
              tree = git('write-tree')
              # Keep the original tracked web assets omitted by the local archive import.
              # No patch touches web; every other subtree matches the tested revision.
              if tree != canonical[item['number']]:
                  raise RuntimeError(f"Unexpected final tree for PR {item['number']}: {tree}")
              parent = git('commit-tree', tree, '-p', parent,
                           '-m', f"stage: reviewed PR {item['number']} tree")
              manifest['prs'].append({k: item[k] for k in ('number', 'branch', 'expected_head')})
              manifest['prs'][-1].update(tree=tree, staged_commit=parent)

          # Push only this staging ref. Its final tree removes the temporary workflow.
          cleanup = git('commit-tree', base_tree, '-p', parent,
                        '-m', 'chore(review): remove temporary tree-transfer workflow')
          git('push', 'origin', cleanup + ':refs/heads/' + stage)
          manifest['staging_cleanup'] = cleanup
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-publication'
          destination.mkdir()
          (destination / 'trees.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-pr-publication-trees
          path: ${{ runner.temp }}/review-publication/trees.json
          retention-days: 7
          if-no-files-found: error
