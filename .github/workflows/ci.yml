name: ci

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'test/ci'
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - 'tests/**'
      - 'test/**'
      - 'ci/**'

permissions:
  contents: read

jobs:
  check_skip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Check if CI should be skipped
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" =~ ^(docs:|doc:|tests:|test:|ci:) ]]; then
            echo "should_skip=true" >> "${GITHUB_OUTPUT}"
            echo "Skipping CI due to commit message prefix"
          else
            echo "should_skip=false" >> "${GITHUB_OUTPUT}"
          fi

  build_latest:
    needs: check_skip
    if: needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: build_latest-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short sha
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      - name: Build and push (latest + hash)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ppcelery/one-api:latest
            ppcelery/one-api:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha

  build_latest_cache:
    needs: [check_skip, build_latest]
    if: needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: build_latest_cache-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and export cache only
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [check_skip, build_latest]
    if: needs.check_skip.outputs.should_skip != 'true'
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.TARGET_HOST }}
          username: ${{ secrets.TARGET_HOST_USERNAME }}
          password: ${{ secrets.TARGET_HOST_PASSWORD }}
          port: ${{ secrets.TARGET_HOST_SSH_PORT }}
          script: |
            source /home/laisky/.zshrc
            docker pull ppcelery/one-api:latest
            cd /home/laisky/repo/VPS
            op run --env-file=./one-api/b1.env -- docker-compose -f b1-docker-compose.yml up -d --remove-orphans --force-recreate oneapi
            docker ps

  build_arm64_hash:
    needs: check_skip
    if: needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: build_arm64_hash-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short sha
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      - name: Build and push arm64 (latest + hash)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ppcelery/one-api:arm64-latest
            ppcelery/one-api:arm64-${{ steps.vars.outputs.short_sha }}
          platforms: linux/arm64
          build-args: |
            TARGETARCH=arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_windows:
    needs: check_skip
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') && needs.check_skip.outputs.should_skip != 'true'
    timeout-minutes: 30
    concurrency:
      group: build_windows-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Compute short sha
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Build Windows executables
        run: |
          # Build the standard executable
          go build -trimpath -ldflags "-s -w" -o one-api.exe

          # Make a copy with the short SHA in the name
          cp one-api.exe "one-api-${{ steps.vars.outputs.short_sha }}.exe"
        shell: bash

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7.0.1
        with:
          name: one-api-windows
          path: |
            one-api.exe
            one-api-${{ steps.vars.outputs.short_sha }}.exe
          retention-days: 90

  create_release:
    needs: [check_skip, build_windows]
    if: startsWith(github.ref, 'refs/tags/') && needs.check_skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Creating a GitHub Release mutates repository contents.
    concurrency:
      group: create_release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Extract version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"

      - name: Compute short sha
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: one-api-windows

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: Release ${{ steps.extract_version.outputs.VERSION }}
          files: |
            one-api.exe
            one-api-${{ steps.vars.outputs.short_sha }}.exe
          draft: false
          prerelease: false
