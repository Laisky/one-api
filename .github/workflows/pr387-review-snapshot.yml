name: PR387 review source snapshot

on:
  push:
    branches:
      - feat/mcp-2026-07-28-protocol
    paths:
      - .github/workflows/pr387-review-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Pack source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/pr387-review-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr387-review-source-${{ github.sha }}
          path: /tmp/pr387-review-source.tar.gz
          retention-days: 1
