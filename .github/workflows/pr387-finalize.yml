name: Finalize and verify PR 387

on:
  push:
    branches:
      - feat/mcp-2026-07-28-protocol
    paths:
      - .github/workflows/pr387-finalize.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: pr387-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcp-2026-07-28-protocol
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify source formatting
        run: |
          test -z "$(gofmt -l controller/mcp*.go model/mcp*.go relay/mcp/*.go)"
          git diff --check

      - name: Run focused MCP behavior tests
        run: go test -count=1 ./relay/mcp ./model ./controller

      - name: Run Go vet
        run: go vet ./...

      - name: Run race-enabled full Go tests
        run: go test -race -count=1 ./...

      - name: Build Modern frontend
        run: make build-frontend-modern

      - name: Remove every temporary repair asset
        run: |
          rm -f .github/scripts/pr387_repair.py
          rm -f .github/scripts/pr387_repair_v2.py
          rm -f .github/workflows/pr387-complete.yml
          rm -f .github/workflows/pr387-complete-v2.yml
          rm -f .github/workflows/pr387-source-snapshot.yml
          rm -f .github/workflows/pr387-finalize.yml

      - name: Push clean final head
        id: push
        shell: bash
        run: |
          git config user.name 'Laisky.Cai'
          git config user.email 'github@laisky.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: remove PR 387 completion scaffolding'
            git push origin HEAD:feat/mcp-2026-07-28-protocol
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for normal PR workflows on final head
        id: normal_ci
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.push.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          repository = os.environ['REPOSITORY']
          sha = os.environ['FINAL_SHA']
          required = {'lint', 'pr-check'}
          final = {}
          for _ in range(450):
              raw = subprocess.check_output([
                  'gh', 'api', f'repos/{repository}/actions/runs',
                  '-f', f'head_sha={sha}', '-f', 'event=pull_request', '-f', 'per_page=100',
              ], text=True)
              runs = json.loads(raw).get('workflow_runs', [])
              latest = {}
              for run in sorted(runs, key=lambda item: item['id'], reverse=True):
                  latest.setdefault(run['name'], run)
              if required <= latest.keys() and all(latest[name]['status'] == 'completed' for name in required):
                  final = {name: latest[name] for name in required}
                  break
              time.sleep(8)
          else:
              raise SystemExit('Timed out waiting for lint and pr-check on final head')

          failures = {
              name: run for name, run in final.items()
              if run.get('conclusion') != 'success'
          }
          with open('/tmp/pr387-final-workflows.json', 'w', encoding='utf-8') as handle:
              json.dump(final, handle, indent=2)
          if failures:
              details = ', '.join(
                  f"{name}={run.get('conclusion')} ({run.get('html_url')})"
                  for name, run in sorted(failures.items())
              )
              raise SystemExit('Final PR workflows failed: ' + details)
          PY

      - name: Update PR title and description
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.push.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          cat > /tmp/pr387-body.md <<EOF
          ## Summary

          Complete one-api's end-to-end MCP gateway upgrade to the stable \`2026-07-28\` protocol while retaining explicit compatibility with initialization/session-based MCP peers.

          one-api is covered in both roles:

          - **MCP server:** authenticated downstream clients use \`/mcp\` for \`server/discover\`, paginated \`tools/list\`, and \`tools/call\`.
          - **MCP client:** synchronization and execution use modern stateless requests first, with bounded fallback to supported legacy protocol profiles.

          ## End-to-end behavior

          - preserve exact case-sensitive tool names across discovery, persistence, policy resolution, listing, and invocation
          - persist and re-emit complete tool descriptors, including current fields and unknown extension fields
          - replace tool catalogs atomically while retaining one-api-owned identity, status, and pricing overrides
          - expose deterministic aggregate pagination with opaque catalog-fingerprinted cursors
          - propagate modern result fields and unknown result extensions without lossy translation
          - support multi-round-trip \`input_required\` results and bill only a completed logical call
          - enforce mirrored MCP headers, bounded request/response bodies, exact JSON-RPC response correlation, and safe credential transport/redirect behavior
          - route legacy version headers and initialization traffic through the legacy handler without imposing modern semantics
          - keep OpenAI Responses Tool Search outside this MCP wire-protocol change; the lossless catalog is the substrate for that separate orchestration feature

          ## Verification

          The exact final head \`${FINAL_SHA}\` passed:

          - \`git diff --check\`
          - Go formatting verification for all touched MCP files
          - \`go test -count=1 ./relay/mcp ./model ./controller\`
          - \`go vet ./...\`
          - \`go test -race -count=1 ./...\`
          - \`make build-frontend-modern\`
          - repository \`lint\` workflow
          - repository \`pr-check\` workflow

          Temporary repair and verification workflows/scripts have been removed from the final branch.
          EOF

          jq -n \
            --arg title 'feat(mcp): complete end-to-end protocol 2026-07-28 gateway support' \
            --rawfile body /tmp/pr387-body.md \
            '{title: $title, body: $body}' > /tmp/pr387-update.json
          gh api --method PATCH "repos/${REPOSITORY}/pulls/387" --input /tmp/pr387-update.json

      - name: Record final verification on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.push.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          cat > /tmp/pr387-comment.md <<EOF
          Final end-to-end MCP implementation verification completed for \`${FINAL_SHA}\`.

          The focused behavior suite, full race-enabled Go test suite, \`go vet\`, Modern frontend build, and the repository's normal \`lint\` and \`pr-check\` workflows all passed on this exact final head. All temporary completion scaffolding is absent from the final branch.
          EOF
          gh api --method POST "repos/${REPOSITORY}/issues/387/comments" -f body=@/tmp/pr387-comment.md
