name: PR440 isolated billing verification
on:
  push:
    branches: [work/pr440-billing-resume-20261002]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export committed source and history only
        run: |
          git merge-base --is-ancestor 9a0f052cc60c34628988a239117212eba0076145 595c035f79ae66903edbc3907f94c98c3a2b54c8
          git bundle create "$RUNNER_TEMP/pr440.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr440-resume-source
          path: ${{ runner.temp }}/pr440.bundle
          retention-days: 2
