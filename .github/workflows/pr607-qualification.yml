name: PR607 one-off qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr607-qualification.yml'
      - '.github/scripts/pr607_qualification.py'

permissions:
  contents: read

concurrency:
  group: pr607-one-off-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.event.pull_request.number == 607 && github.event.pull_request.head.repo.full_name == 'Laisky/one-api' && github.event.pull_request.head.ref == 'fix/gemini-model-catalog-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact PR head without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Reproduce, apply, and qualify the fixed implementation
        if: hashFiles('.github/scripts/pr607_qualification.py') != ''
        env:
          GOTOOLCHAIN: local
        run: python3 .github/scripts/pr607_qualification.py qualify
      - name: Publish only the qualified tree with an unchanged branch head
        if: success() && hashFiles('.github/scripts/pr607_qualification.py') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/pr607_qualification.py publish
      - name: Preserve behavioral test receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr607-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/pr607-qualification
          retention-days: 14
          if-no-files-found: warn
