name: PR 421 review validation
on:
  push:
    branches: [work/pr421-review-fixes-20260922]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Apply candidate
        run: |
          python3 - <<'PY'
          import hashlib,lzma,pathlib,subprocess
          patch=lzma.decompress(b''.join(pathlib.Path('.github/pr421-review-patch.'+str(i)).read_bytes() for i in range(2)))
          assert hashlib.sha256(patch).hexdigest()=='acaedd644377d017fd682f42087be707c0f0f2aebd548094c7890e3a1119cad5'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Physical audio dependency
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Negative control against original PR
        run: |
          git worktree add --detach "$RUNNER_TEMP/negative" 87a5344103933b284e37c2c809583a604bb17fa2
          for f in relay/controller/audio_failover_ledger_test.go relay/adaptor/openai/mistral_model_list_test.go controller/model_display_native_pricing_test.go; do cp "$f" "$RUNNER_TEMP/negative/$f"; done
          cd "$RUNNER_TEMP/negative"
          set +e
          go test -race -count=1 -timeout=10m -json ./relay/controller ./controller ./relay/adaptor/openai -run '^TestPR421' > "$RUNNER_TEMP/negative.jsonl" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - "$RUNNER_TEMP/negative.jsonl" <<'PY'
          import json,sys
          text=open(sys.argv[1]).read()
          assert '[build failed]' not in text,text[-10000:]
          rows=[json.loads(s) for s in text.splitlines() if s.startswith('{')]
          failed={r.get('Test') for r in rows if r.get('Action')=='fail' and '/' not in r.get('Test','')}
          expected={'TestPR421AudioFailoverLedger','TestPR421NativePricingDisplay','TestPR421MistralAudioListings','TestPR421FreePerCallWindowJSON'}
          assert expected <= failed,(expected,failed,text[-10000:])
          print('Verified behavioral failures:',sorted(expected))
          PY
      - name: Complete affected-package race suites
        if: always()
        run: go test -race -count=1 -timeout=15m -json ./relay/controller ./controller ./relay/adaptor/openai ./relay/adaptor/mistral ./relay/pricing ./middleware > "$RUNNER_TEMP/positive.jsonl" 2>&1
      - name: Repository vet
        if: always()
        run: go vet ./... > "$RUNNER_TEMP/vet.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr421-review-go
          path: |
            ${{ runner.temp }}/*.jsonl
            ${{ runner.temp }}/vet.log
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Apply candidate
        run: |
          python3 - <<'PY'
          import hashlib,lzma,pathlib,subprocess
          patch=lzma.decompress(b''.join(pathlib.Path('.github/pr421-review-patch.'+str(i)).read_bytes() for i in range(2)))
          assert hashlib.sha256(patch).hexdigest()=='acaedd644377d017fd682f42087be707c0f0f2aebd548094c7890e3a1119cad5'
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock
      - name: Install
        working-directory: web/modern
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
      - name: Negative free-price rendering control
        working-directory: web/modern
        run: |
          file=src/pages/models/ModelPricingModal.tsx
          cp "$file" "$RUNNER_TEMP/fixed-modal.tsx"
          git show 87a5344103933b284e37c2c809583a604bb17fa2:web/modern/src/pages/models/ModelPricingModal.tsx > "$file"
          set +e
          yarn test --run src/pages/models/ModelPricingModal.api.test.tsx -t 'PR421' --reporter=json --outputFile="$RUNNER_TEMP/negative-ui.json" > "$RUNNER_TEMP/negative-ui.log" 2>&1
          result=$?
          set -e
          cp "$RUNNER_TEMP/fixed-modal.tsx" "$file"
          test "$result" -ne 0
          python3 - "$RUNNER_TEMP/negative-ui.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1]))
          assert result['numFailedTests']==3,result
          PY
      - name: Full UI and i18n suites
        if: always()
        working-directory: web/modern
        run: |
          yarn check:i18n > "$RUNNER_TEMP/i18n.log" 2>&1
          yarn test --run > "$RUNNER_TEMP/ui.log" 2>&1
      - name: TypeScript and production build
        if: always()
        working-directory: web/modern
        run: yarn build > "$RUNNER_TEMP/build.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr421-review-ui
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/negative-ui.json
          retention-days: 7
  publish:
    needs: [go, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/pr421-review-fixes-20260922
      - name: Publish exactly the passing source on the isolated work branch
        env:
          QUALIFIED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          python3 - <<'PY'
          import hashlib,lzma,pathlib,subprocess
          patch=lzma.decompress(b''.join(pathlib.Path('.github/pr421-review-patch.'+str(i)).read_bytes() for i in range(2)))
          assert hashlib.sha256(patch).hexdigest()=='acaedd644377d017fd682f42087be707c0f0f2aebd548094c7890e3a1119cad5'
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          git rm .github/pr421-review-patch.[01] .github/workflows/pr421-review-validation.yml
          git add controller relay web
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: isolate audio retry payloads and align native pricing display'
          git push origin HEAD:refs/heads/work/pr421-review-fixes-20260922
