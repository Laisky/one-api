name: OTLP edge transport

on:
  push:
    branches: [feat/secure-otlp-edge-20260930]
  pull_request:
    paths:
      - 'common/telemetry/**'
      - 'common/config/observability*'
      - '.github/workflows/otlp-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otlp-edge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Record exact source
        run: |
          mkdir -p /tmp/otlp-edge
          git rev-parse HEAD > /tmp/otlp-edge/source.txt
          go version > /tmp/otlp-edge/toolchain.txt
          git archive HEAD common/telemetry common/config go.mod go.sum | gzip > /tmp/otlp-edge/source.tar.gz
      - name: Validate telemetry and configuration
        run: |
          set -o pipefail
          go mod verify
          go vet -mod=readonly ./common/telemetry ./common/config
          go test -mod=readonly -race -count=3 -shuffle=on -timeout=180s -json ./common/telemetry ./common/config | tee /tmp/otlp-edge/tests.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: otlp-edge-transport
          path: /tmp/otlp-edge
          retention-days: 7
          if-no-files-found: error
