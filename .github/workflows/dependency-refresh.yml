name: Dependency refresh workbench

on:
  push:
    branches: [chore/dependencies-20260930]
    paths: [.github/workflows/dependency-refresh.yml]

permissions:
  contents: read

concurrency:
  group: dependency-refresh-workbench
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GONOSUMDB: github.com/Laisky/*,github.com/laisky/*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Resolve current Go module versions
        id: resolve
        run: |
          set -euo pipefail
          go mod edit -json > "$RUNNER_TEMP/go-before.json"
          go get -u -t ./...
          go get google.golang.org/grpc@latest
          go mod tidy
          go mod edit -json > "$RUNNER_TEMP/go-after.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          before = json.loads((root / 'go-before.json').read_text())
          after = json.loads((root / 'go-after.json').read_text())
          assert before.get('Replace') == after.get('Replace'), 'Do not change replacement forks'
          old = {item['Path']: item['Version'] for item in before['Require']}
          for item in after['Require']:
              if old.get(item['Path']) != item['Version']:
                  print(f"{item['Path']}: {old.get(item['Path'], '(new)')} -> {item['Version']}")
          PY
          git diff --binary -- go.mod go.sum > "$RUNNER_TEMP/go.patch"
      - name: Verify module checksums, compile every test, and vet
        run: |
          go mod verify
          go test -run '^$' ./...
          go vet ./...
      - name: Save resolved Go dependency patch
        if: always() && steps.resolve.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-patch-go
          path: ${{ runner.temp }}/go.patch
          if-no-files-found: error
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        theme: [modern, air, berry]
    env:
      THEME: ${{ matrix.theme }}
      LEGACY_THEME: ${{ matrix.theme }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Resolve frontend versions and regenerate lockfile
        id: resolve
        run: |
          set -euo pipefail
          status=0
          yarn --cwd "web/$THEME" outdated --json --non-interactive > "$RUNNER_TEMP/outdated.json" || status=$?
          test "$status" -le 1
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          theme = os.environ['THEME']
          path = Path('web') / theme / 'package.json'
          package = json.loads(path.read_text())
          lines = (Path(os.environ['RUNNER_TEMP']) / 'outdated.json').read_text().splitlines()
          for line in lines:
              entry = json.loads(line)
              if entry.get('type') != 'table':
                  continue
              for name, current, wanted, latest, section, *_ in entry['data']['body']:
                  # Modern follows stable latest. Legacy component/build-system
                  # majors require a separate migration, not forced resolutions.
                  target = latest if theme == 'modern' else wanted
                  if not re.fullmatch(r'\d+\.\d+\.\d+', target):
                      continue
                  if name not in package.get(section, {}):
                      continue
                  if package[section][name].startswith('npm:'):
                      continue  # Preserve the intentional TS6/TS7 tool aliases.
                  package[section][name] = '^' + target
                  print(f'{theme}: {name} {current} -> {target}')
          with urllib.request.urlopen('https://registry.npmjs.org/axios/latest', timeout=30) as response:
              axios = json.load(response)['version']
          with urllib.request.urlopen('https://registry.npmjs.org/react-router-dom/latest', timeout=30) as response:
              dom = json.load(response)
          package['dependencies']['axios'] = '^' + axios
          package['dependencies']['react-router-dom'] = '^' + dom['version']
          if 'react-router' in package['dependencies']:
              # Align to the core required by DOM, not the unrelated latest core major.
              package['dependencies']['react-router'] = dom['dependencies']['react-router']
              package['dependencies']['react-router-dom'] = dom['version']
          print(f"{theme}: axios={axios}, react-router-dom={dom['version']}")
          path.write_text(json.dumps(package, indent=2) + '\n')
          PY
          yarn --cwd "web/$THEME" upgrade --non-interactive --network-timeout 600000
          yarn --cwd "web/$THEME" install --frozen-lockfile --non-interactive --network-timeout 600000
          git diff --binary -- "web/$THEME/package.json" "web/$THEME/yarn.lock" > "$RUNNER_TEMP/$THEME.patch"
      - name: Reproduce the original swallowed-error bug
        if: matrix.theme != 'modern'
        run: |
          set -euo pipefail
          if [[ "$THEME" == air ]]; then helper=src/helpers/api.js; else helper=src/utils/api.js; fi
          git show "8ffe813826ec1437ed8b5e6e452eed51d3c62206:web/$THEME/$helper" > "$RUNNER_TEMP/original-api.js"
          status=0
          LEGACY_API_SOURCE_FILE="$RUNNER_TEMP/original-api.js" \
            node --experimental-vm-modules --test --test-name-pattern='HTTP errors remain rejected' \
            scripts/legacy-api-compat.test.mjs > "$RUNNER_TEMP/red-test.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/red-test.log"
          test "$status" -ne 0
          grep -q 'Missing expected rejection' "$RUNNER_TEMP/red-test.log"
      - name: Verify legacy transport and routing regressions
        if: matrix.theme != 'modern'
        run: node --experimental-vm-modules --test scripts/legacy-api-compat.test.mjs
      - name: Run existing frontend tests
        env:
          CI: 'true'
        run: |
          if [[ "$THEME" == modern ]]; then
            yarn --cwd "web/$THEME" test --run
          else
            yarn --cwd "web/$THEME" test --watchAll=false --runInBand --passWithNoTests
          fi
      - name: Build frontend
        env:
          CI: 'false'
        run: yarn --cwd "web/$THEME" build
      - name: Validate Modern lint and translations
        if: matrix.theme == 'modern'
        run: |
          yarn --cwd web/modern lint
          yarn --cwd web/modern check:i18n
      - name: Report security audit
        if: always() && steps.resolve.outcome == 'success'
        run: |
          status=0
          yarn --cwd "web/$THEME" audit --json > "$RUNNER_TEMP/$THEME-audit.json" || status=$?
          echo "Audit exit code (severity bitmask): $status"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for line in (Path(os.environ['RUNNER_TEMP']) / (os.environ['THEME'] + '-audit.json')).read_text().splitlines():
              item = json.loads(line)
              if item.get('type') in ('auditSummary', 'error'):
                  print(json.dumps(item))
          PY
      - name: Save resolved frontend dependency patch and audit
        if: always() && steps.resolve.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-patch-${{ matrix.theme }}
          path: |
            ${{ runner.temp }}/${{ matrix.theme }}.patch
            ${{ runner.temp }}/${{ matrix.theme }}-audit.json
          if-no-files-found: error
          retention-days: 7

  persist:
    name: Commit generated dependency files only
    if: always() && !cancelled()
    needs: [go, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No package managers, project code, or dependency scripts run in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dependency-patch-*
          path: ${{ runner.temp }}/dependency-patches
      - name: Apply allowlisted generated patches
        run: |
          set -euo pipefail
          mapfile -t patches < <(find "$RUNNER_TEMP/dependency-patches" -name '*.patch' -type f | sort)
          test "${#patches[@]}" -eq 4
          for patch in "${patches[@]}"; do
            if [[ -s "$patch" ]]; then git apply --index "$patch"; fi
          done
          python3 - <<'PY'
          import subprocess
          allowed = {'go.mod', 'go.sum'} | {f'web/{theme}/{name}' for theme in ('modern', 'air', 'berry') for name in ('package.json', 'yarn.lock')}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed <= allowed, f'Unexpected generated files: {changed - allowed}'
          PY
          git diff --cached --stat
      - name: Commit dependency locks to the consolidation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): refresh Go and frontend dependency locks'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git push origin HEAD:refs/heads/chore/dependencies-20260930
