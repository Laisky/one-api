# Temporary read-only audit support; removed before final PR acceptance.
# No paid inference, credentials in artifacts, deployments, or repository writes.
name: Catalog audit evidence
on:
  push:
    branches: [feat/adaptor-catalog-audit-20260924]
    paths: [.github/workflows/catalog-audit-evidence.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect official public model documents
        env:
          OUT: ${{ runner.temp }}/catalog-evidence
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/source-commit.txt"
          git archive --format=tar --output="$OUT/source.tar" HEAD . ':(exclude).github/instructions/**' ':(exclude)**/*.woff' ':(exclude)**/*.woff2' ':(exclude)**/*.ttf' ':(exclude)**/*.otf'
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, urllib.request
          out = pathlib.Path(os.environ['OUT'])
          sources = {
              'bigmodel-pricing-doc': 'https://docs.bigmodel.cn/cn/guide/start/pricing',
              'bigmodel-flashx': 'https://docs.bigmodel.cn/cn/guide/models/vlm/glm-5.3-flash',
              'jina-openapi': 'https://api.jina.ai/openapi.json',
              'baichuan-pricing': 'https://platform.baichuan-ai.com/prices',
              'baichuan-models': 'https://platform.baichuan-ai.com/docs/api',
              'baidu-pricing': 'https://cloud.baidu.com/doc/qianfan/s/wmh4sv6ya',
              'baidu-models': 'https://cloud.baidu.com/doc/WENXINWORKSHOP/s/hlrk4akp7',
              'coze-pricing': 'https://www.coze.com/premium',
              'minimax-models': 'https://platform.minimaxi.com/docs/guides/models-intro',
              'minimax-pricing': 'https://platform.minimaxi.com/docs/guides/pricing-paygo',
              'doubao-pricing': 'https://www.volcengine.com/docs/82379/1099320',
              'doubao-models': 'https://www.volcengine.com/docs/82379/1330310',
              'yi-models': 'https://platform.lingyiwanwu.com/docs',
              'novita-models': 'https://api.novita.ai/v3/openai/models',
              'siliconflow-cn': 'https://siliconflow.cn/pricing',
              'siliconflow-us': 'https://www.siliconflow.com/pricing',
              'siliconflow-changes': 'https://docs.siliconflow.cn/docs/release-notes/overview',
              'stepfun-pricing': 'https://platform.stepfun.com/docs/zh/guides/pricing/details.md',
              'stepfun-models': 'https://platform.stepfun.com/docs/zh/guides/models',
              'tencent-pricing': 'https://cloud.tencent.com/document/product/1729/97731',
              'tencent-migration': 'https://cloud.tencent.com/document/product/1729/131925',
              'together-models': 'https://docs.together.ai/docs/serverless-models',
              'together-pricing': 'https://www.together.ai/pricing',
              'spark-models': 'https://www.xfyun.cn/doc/spark/Web.html',
              'spark-http': 'https://www.xfyun.cn/doc/spark/HTTP%E8%B0%83%E7%94%A8%E6%96%87%E6%A1%A3.html',
              'spark-x': 'https://www.xfyun.cn/doc/spark/X1http.html',
              'spark-pricing': 'https://xinghuo.xfyun.cn/sparkapi',
              'replicate-language': 'https://replicate.com/collections/language-models',
              'replicate-images': 'https://replicate.com/collections/text-to-image',
              'nvidia-catalog': 'https://assets.ngc.nvidia.com/products/api-catalog/featured-models.json',
              'copilot-models': 'https://docs.github.com/en/copilot/reference/ai-models/supported-models',
              'ai360-models': 'https://ai.360.com/platform/docs',
              'palm-retirement': 'https://ai.google.dev/palm_docs/deprecation',
              'aws-pricing': 'https://aws.amazon.com/bedrock/pricing/',
              'aws-opus55': 'https://docs.aws.amazon.com/ja_jp/bedrock/latest/userguide/model-card-anthropic-claude-opus-5-5.html',
          }
          def collect(item):
              name, url = item
              result = {'name': name, 'url': url}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'one-api-catalog-audit/1.0'})
                  with urllib.request.urlopen(request, timeout=40) as response:
                      data = response.read(20 * 1024 * 1024 + 1)
                      if len(data) > 20 * 1024 * 1024:
                          raise ValueError('response exceeds 20 MiB evidence limit')
                      result.update(status=response.status, final_url=response.url,
                                    content_type=response.headers.get('Content-Type', ''),
                                    bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
                  (out / (name + '.data')).write_bytes(data)
              except Exception as exc:
                  result['error'] = str(exc)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
              results = list(executor.map(collect, sources.items()))
          (out / 'sources.json').write_text(json.dumps(results, indent=2) + '\n')
          for result in results:
              print(result['name'], result.get('status', 'unavailable'), result.get('bytes', 0))
          PY
      - name: Archive official-source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-audit-evidence
          path: ${{ runner.temp }}/catalog-evidence
          retention-days: 7
      - name: Set up repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Capture offline toolchain and module sources
        env:
          OUT: ${{ runner.temp }}/offline-go
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          go mod download
          go version > "$OUT/go-version.txt"
          tar -czf "$OUT/go-sdk.tgz" -C "$(go env GOROOT)" .
          tar -czf "$OUT/go-modules.tgz" -C "$(go env GOMODCACHE)" --exclude='*.zip' --exclude='*.lock' .
      - name: Archive offline validation inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-offline-go
          path: ${{ runner.temp }}/offline-go
          retention-days: 1
