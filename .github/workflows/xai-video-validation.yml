name: xAI video validation
on:
  push:
    branches: [fix/xai-imagine-video-20260922]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run behavioral regressions
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=10m ./relay/adaptor/xai ./middleware -run 'TestXAI(GatewayVideoRoute|VideoTaskOwner)' -v 2>&1 | tee "$RUNNER_TEMP/xai-video-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xai-video-regression
          path: ${{ runner.temp }}/xai-video-tests.log
          retention-days: 7
