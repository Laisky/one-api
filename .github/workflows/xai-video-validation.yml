name: xAI video validation
on:
  push:
    branches: [fix/xai-imagine-video-20260922]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export source for offline review
        run: tar --exclude=.git --exclude=.github/instructions -czf "$RUNNER_TEMP/source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: xai-video-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
