name: bolt-review-fix

on:
  push:
    branches:
      - 'bolt/stream-bridge-allocations-20260818'

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: "github.event.head_commit.message == 'ci(bolt): apply review fix'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Establish behavior baseline
        run: go test ./relay/controller -run '^TestChatToResponseStreamBridge_EmitEventExactBytes$' -count=1

      - name: Reproduce reviewed integer overflow
        run: |
          cat >/tmp/reproduce_frame_overflow.go <<'EOF'
          package main

          import (
              "fmt"
              "math"
          )

          func main() {
              payloadLen := math.MaxInt - len("data: ") - len("\n\n") + 1
              frameSize := len("data: ") + payloadLen + len("\n\n")
              if frameSize >= 0 {
                  panic(fmt.Sprintf("expected signed overflow, got frameSize=%d", frameSize))
              }
              fmt.Printf("reproduced: payloadLen=%d frameSize=%d\n", payloadLen, frameSize)
          }
          EOF
          go run /tmp/reproduce_frame_overflow.go

      - name: Benchmark reviewed head
        run: |
          go test ./relay/controller \
            -run '^$' \
            -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
            -benchmem -benchtime=500ms -count=10 | tee /tmp/benchmark-before.txt

      - name: Apply checked-capacity fix and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("relay/controller/response_stream_bridge.go")
          source = source_path.read_text()
          old_import = 'import (\n\t"encoding/json"\n\t"strings"'
          new_import = 'import (\n\t"encoding/json"\n\t"math"\n\t"strings"'
          if source.count(old_import) != 1:
              raise SystemExit("unexpected response_stream_bridge.go import block")
          source = source.replace(old_import, new_import, 1)

          start_marker = "func (h *chatToResponseStreamBridge) emitEvent("
          end_marker = "\nfunc (h *chatToResponseStreamBridge) nextOutputIndex() int {"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("emitEvent markers not found")

          replacement = r'''const (
          responseStreamEventPrefix = "event: "
          responseStreamDataPrefix  = "data: "
          responseStreamFrameSuffix = "\n\n"
          )

          func responseStreamFrameCapacity(payloadLen, eventTypeLen int) (int, bool) {
          	const dataOnlyOverhead = len(responseStreamDataPrefix) + len(responseStreamFrameSuffix)
          	if payloadLen < 0 || eventTypeLen < 0 || payloadLen > math.MaxInt-dataOnlyOverhead {
          		return 0, false
          	}

          	frameSize := payloadLen + dataOnlyOverhead
          	if eventTypeLen == 0 {
          		return frameSize, true
          	}

          	const namedEventOverhead = len(responseStreamEventPrefix) + 1
          	if frameSize > math.MaxInt-namedEventOverhead {
          		return 0, false
          	}
          	frameSize += namedEventOverhead
          	if eventTypeLen > math.MaxInt-frameSize {
          		return 0, false
          	}
          	return frameSize + eventTypeLen, true
          }

          func (h *chatToResponseStreamBridge) emitEvent(c *gin.Context, eventType string, event openai.ResponseAPIStreamEvent) {
          	event.Type = eventType
          	if event.Id == "" {
          		event.Id = h.responseID
          	}

          	payload, err := json.Marshal(event)
          	if err != nil {
          		gmw.GetLogger(c).Warn("failed to marshal response stream event", zap.String("event_type", eventType), zap.Error(err))
          		return
          	}

          	frameSize, ok := responseStreamFrameCapacity(len(payload), len(eventType))
          	if !ok {
          		gmw.GetLogger(c).Warn("response stream event is too large", zap.String("event_type", eventType))
          		return
          	}

          	frame := make([]byte, 0, frameSize)
          	if eventType != "" {
          		frame = append(frame, responseStreamEventPrefix...)
          		frame = append(frame, eventType...)
          		frame = append(frame, '\n')
          	}
          	frame = append(frame, responseStreamDataPrefix...)
          	frame = append(frame, payload...)
          	frame = append(frame, responseStreamFrameSuffix...)

          	if _, err := c.Writer.Write(frame); err != nil {
          		gmw.GetLogger(c).Warn("failed to write response stream event", zap.String("event_type", eventType), zap.Error(err))
          	}
          	c.Writer.Flush()
          }
          '''
          source = source[:start] + replacement + source[end:]
          source_path.write_text(source)

          test_path = Path("relay/controller/response_stream_bridge_benchmark_test.go")
          test = test_path.read_text()
          old_test_import = 'import (\n\t"encoding/json"\n\t"net/http"'
          new_test_import = 'import (\n\t"encoding/json"\n\t"math"\n\t"net/http"'
          if test.count(old_test_import) != 1:
              raise SystemExit("unexpected benchmark test import block")
          test = test.replace(old_test_import, new_test_import, 1)

          benchmark_marker = "func BenchmarkChatToResponseStreamBridgeConstructTextOnly(b *testing.B) {"
          if test.count(benchmark_marker) != 1:
              raise SystemExit("benchmark insertion marker not found")
          regression_test = r'''func TestResponseStreamFrameCapacity(t *testing.T) {
          	const (
          		dataOnlyOverhead  = len(responseStreamDataPrefix) + len(responseStreamFrameSuffix)
          		namedEventOverhead = len(responseStreamEventPrefix) + 1
          	)

          	tests := []struct {
          		name         string
          		payloadLen   int
          		eventTypeLen int
          		want         int
          		wantOK       bool
          	}{
          		{
          			name:       "data-only frame",
          			payloadLen: 128,
          			want:       128 + dataOnlyOverhead,
          			wantOK:     true,
          		},
          		{
          			name:         "named event frame",
          			payloadLen:   128,
          			eventTypeLen: len("response.output_text.delta"),
          			want:         128 + dataOnlyOverhead + namedEventOverhead + len("response.output_text.delta"),
          			wantOK:       true,
          		},
          		{name: "negative payload length", payloadLen: -1},
          		{name: "negative event type length", eventTypeLen: -1},
          		{
          			name:       "data-only overflow",
          			payloadLen: math.MaxInt - dataOnlyOverhead + 1,
          		},
          		{
          			name:         "named event overhead overflow",
          			payloadLen:   math.MaxInt - dataOnlyOverhead,
          			eventTypeLen: 1,
          		},
          		{
          			name:         "event type length overflow",
          			eventTypeLen: math.MaxInt,
          		},
          	}

          	for _, tt := range tests {
          		t.Run(tt.name, func(t *testing.T) {
          			got, ok := responseStreamFrameCapacity(tt.payloadLen, tt.eventTypeLen)
          			require.Equal(t, tt.wantOK, ok)
          			require.Equal(t, tt.want, got)
          		})
          	}
          }

          '''
          test = test.replace(benchmark_marker, regression_test + benchmark_marker, 1)
          test_path.write_text(test)
          PY

          gofmt -w \
            relay/controller/response_stream_bridge.go \
            relay/controller/response_stream_bridge_benchmark_test.go

      - name: Verify regression and external behavior
        run: |
          go test -race ./relay/controller \
            -run '^(TestChatToResponseStreamBridge_EmitEventExactBytes|TestResponseStreamFrameCapacity)$' \
            -count=1
          go test ./relay/controller -count=1

      - name: Benchmark fixed implementation
        run: |
          go test ./relay/controller \
            -run '^$' \
            -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
            -benchmem -benchtime=500ms -count=10 | tee /tmp/benchmark-after.txt

      - name: Summarize benchmark comparison
        run: |
          python - <<'PY'
          import re
          import statistics
          from pathlib import Path

          name = "BenchmarkChatToResponseStreamBridgeEmitEvent"
          pattern = re.compile(
              rf"^{name}-\d+\s+\d+\s+([0-9.]+) ns/op\s+([0-9.]+) MB/s\s+([0-9.]+) B/op\s+([0-9.]+) allocs/op$",
              re.MULTILINE,
          )

          def parse(path):
              matches = pattern.findall(Path(path).read_text())
              if len(matches) != 10:
                  raise SystemExit(f"expected 10 benchmark samples in {path}, got {len(matches)}")
              columns = list(zip(*([float(value) for value in row] for row in matches)))
              return tuple(statistics.median(column) for column in columns)

          before = parse("/tmp/benchmark-before.txt")
          after = parse("/tmp/benchmark-after.txt")
          speedup = (before[0] - after[0]) / before[0] * 100
          print(f"median before: {before[0]:.1f} ns/op, {before[2]:.0f} B/op, {before[3]:.0f} allocs/op")
          print(f"median after:  {after[0]:.1f} ns/op, {after[2]:.0f} B/op, {after[3]:.0f} allocs/op")
          print(f"latency change: {speedup:+.2f}% (positive means faster)")
          if after[2:] != before[2:]:
              raise SystemExit("allocation metrics changed unexpectedly")
          if after[0] > before[0] * 1.15:
              raise SystemExit("fixed implementation regressed by more than 15%")
          PY

      - name: Run repository checks
        run: |
          test -z "$(gofmt -l relay/controller/response_stream_bridge.go relay/controller/response_stream_bridge_benchmark_test.go)"
          git diff --check
          go vet ./...

      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name "Bolt Performance Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bolt-review-fix.yml
          git add \
            relay/controller/response_stream_bridge.go \
            relay/controller/response_stream_bridge_benchmark_test.go
          git diff --cached --check
          git commit -m "fix(perf): guard SSE frame capacity overflow"
          git push origin HEAD:${GITHUB_REF_NAME}
