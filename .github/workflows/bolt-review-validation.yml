name: bolt-review-validation

on:
  push:
    branches:
      - 'bolt/stream-bridge-allocations-20260818'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    if: "github.event.head_commit.message == 'ci(bolt): validate review fix'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Prepare reviewed-head worktree
        run: git worktree add --detach /tmp/bolt-before 6462f74623a93a8bbc2395bfa566578f1a24c62e

      - name: Prove the reviewed finding is reproducible
        run: |
          cat >/tmp/reproduce_frame_overflow.go <<'EOF'
          package main

          import (
              "fmt"
              "math"
          )

          func main() {
              overhead := len("data: ") + len("\n\n")
              payloadLen := math.MaxInt - overhead + 1
              frameSize := len("data: ") + payloadLen + len("\n\n")
              if frameSize >= 0 {
                  panic(fmt.Sprintf("expected signed integer wrap, got frameSize=%d", frameSize))
              }
              fmt.Printf("math.MaxInt=%d payloadLen=%d frameSize=%d\n", math.MaxInt, payloadLen, frameSize)
          }
          EOF
          go run /tmp/reproduce_frame_overflow.go | tee /tmp/bolt-reproduction.txt

      - name: Verify pre-fix and post-fix behavior contracts
        run: |
          set -euo pipefail
          (
            cd /tmp/bolt-before
            go test ./relay/controller \
              -run '^TestChatToResponseStreamBridge_EmitEventExactBytes$' \
              -count=1
          )
          go test -race ./relay/controller \
            -run '^(TestChatToResponseStreamBridge_EmitEventExactBytes|TestResponseStreamFrameCapacity)$' \
            -count=1
          go test ./relay/controller -count=1

      - name: Run formatting and static checks
        run: |
          set -euo pipefail
          test -z "$(gofmt -l \
            relay/controller/response_stream_bridge.go \
            relay/controller/response_stream_bridge_benchmark_test.go)"
          git diff --check b59a43af8a32f0f570d70e8e79f799cc539674b7 HEAD
          go vet ./...

      - name: Warm benchmark binaries
        env:
          GOMAXPROCS: '1'
        run: |
          (
            cd /tmp/bolt-before
            go test ./relay/controller \
              -run '^$' \
              -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
              -benchmem -benchtime=100ms -count=1 -cpu=1 >/dev/null
          )
          go test ./relay/controller \
            -run '^$' \
            -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
            -benchmem -benchtime=100ms -count=1 -cpu=1 >/dev/null

      - name: Benchmark reviewed and fixed code on the same runner
        env:
          GOMAXPROCS: '1'
        run: |
          set -euo pipefail
          : >/tmp/bolt-before.txt
          : >/tmp/bolt-after.txt
          for i in $(seq 1 10); do
            if (( i % 2 == 1 )); then
              (
                cd /tmp/bolt-before
                go test ./relay/controller -run '^$' \
                  -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
                  -benchmem -benchtime=500ms -count=1 -cpu=1
              ) >>/tmp/bolt-before.txt
              go test ./relay/controller -run '^$' \
                -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
                -benchmem -benchtime=500ms -count=1 -cpu=1 \
                >>/tmp/bolt-after.txt
            else
              go test ./relay/controller -run '^$' \
                -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
                -benchmem -benchtime=500ms -count=1 -cpu=1 \
                >>/tmp/bolt-after.txt
              (
                cd /tmp/bolt-before
                go test ./relay/controller -run '^$' \
                  -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
                  -benchmem -benchtime=500ms -count=1 -cpu=1
              ) >>/tmp/bolt-before.txt
            fi
          done

      - name: Build review report
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import re
          import statistics
          from pathlib import Path
          import os

          benchmark = "BenchmarkChatToResponseStreamBridgeEmitEvent"
          pattern = re.compile(
              rf"^{benchmark}-\d+\s+\d+\s+([0-9.]+)\s+ns/op"
              rf"(?:\s+[0-9.]+\s+MB/s)?\s+([0-9.]+)\s+B/op"
              rf"\s+([0-9.]+)\s+allocs/op$",
              re.MULTILINE,
          )

          def parse(path):
              rows = [tuple(map(float, match)) for match in pattern.findall(Path(path).read_text())]
              if len(rows) != 10:
                  raise SystemExit(f"expected 10 benchmark samples in {path}, found {len(rows)}")
              columns = list(zip(*rows))
              return tuple(statistics.median(column) for column in columns)

          before = parse("/tmp/bolt-before.txt")
          after = parse("/tmp/bolt-after.txt")
          latency_change = (after[0] - before[0]) / before[0] * 100
          allocation_change = (after[1] - before[1]) / before[1] * 100 if before[1] else 0.0
          reproduction = Path("/tmp/bolt-reproduction.txt").read_text().strip()
          run_url = f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}"

          if after[1] != before[1] or after[2] != before[2]:
              raise SystemExit(
                  f"allocation regression: before={before[1:]} after={after[1:]}"
              )
          if latency_change > 15:
              raise SystemExit(f"runtime regression exceeds noise guardrail: {latency_change:.2f}%")

          if latency_change < 0:
              latency_summary = f"{abs(latency_change):.2f}% faster"
          elif latency_change > 0:
              latency_summary = f"{latency_change:.2f}% slower"
          else:
              latency_summary = "unchanged"

          report = f"""## ⚡ Bolt review follow-up

          The CodeQL review finding was **valid**, not a false positive. The pre-fix allocation-size expression wraps a signed `int` at the boundary:

          ```text
          {reproduction}
          ```

          ### Fix

          Commit `495622c60639bf6ca732b75c5cb32689c65ec291` now computes SSE frame capacity with checked additions before allocation. Every representable frame still takes the exact-capacity, single-allocation path. An unrepresentable size is logged and rejected instead of wrapping and reaching `make` with an invalid capacity.

          ### Regression coverage

          - The existing exact-wire behavior test passed on both the reviewed head and the fixed implementation.
          - `TestResponseStreamFrameCapacity` covers normal named/data-only frames, negative synthetic inputs, and each `math.MaxInt` overflow boundary.
          - Focused tests passed under the race detector.
          - The complete `relay/controller` package test suite passed.
          - `gofmt`, `git diff --check`, and `go vet ./...` passed.

          ### Same-runner benchmark

          Command per sample:

          ```bash
          GOMAXPROCS=1 go test ./relay/controller -run '^$' \\
            -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \\
            -benchmem -benchtime=500ms -count=1 -cpu=1
          ```

          Ten paired samples were alternated between reviewed head `6462f74623a93a8bbc2395bfa566578f1a24c62e` and the fixed implementation on the same runner.

          | Metric (median) | Reviewed head | Fixed | Change |
          |---|---:|---:|---:|
          | Runtime | {before[0]:.1f} ns/op | {after[0]:.1f} ns/op | {latency_summary} |
          | Heap bytes | {before[1]:.0f} B/op | {after[1]:.0f} B/op | {allocation_change:+.2f}% |
          | Allocations | {before[2]:.0f} allocs/op | {after[2]:.0f} allocs/op | unchanged |

          The guard preserves the allocation improvement of this PR; allocation counts and bytes are unchanged from the reviewed optimized implementation. Runtime differences within this paired run are reported above without extrapolation.

          Validation run: {run_url}
          """
          report = "\n".join(line.strip() for line in report.splitlines()).strip() + "\n"
          Path("/tmp/bolt-review-comment.md").write_text(report)
          print(report)
          PY

      - name: Publish report to PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          body = json.dumps({"body": Path("/tmp/bolt-review-comment.md").read_text()}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/362/comments",
              data=body,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          urllib.request.urlopen(request).close()
          PY
