name: PR 428 repair verification
on:
  push:
    branches: [work/compact-table-toolbar-20260924]
    paths: [.github/workflows/pr428-repair.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply checksum-verified review fixes to exact PR source
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          encoded = pathlib.Path('.github/repair/pr428-review-followup.patch.gz.b64').read_text().strip()
          # Remove a duplicated transport segment; the decoded checksum remains mandatory.
          marker = 'HUsi1+'
          if encoded.count(marker) == 2:
              encoded = encoded[:encoded.index(marker)] + encoded[encoded.rindex(marker):]
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a8c45c80711168e7c626622a16f51b0254d0514f41944dd4895f816244d3058e'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'pr428-followup.patch').write_bytes(patch)
          PY
          git checkout --detach 81ff8562c3efcf94cd90dea20692f0c48bcff9fa
          git apply --check "$RUNNER_TEMP/pr428-followup.patch"
          git apply "$RUNNER_TEMP/pr428-followup.patch"
          git diff --check
          git add controller/channel_selection.go controller/channel_selection_deletion_test.go model/channel_selection.go model/list_selection_test.go web/modern/src/pages/channels/__tests__/ChannelsPage.selection.test.tsx web/modern/src/pages/mcp/MCPServersPage.tsx web/modern/src/pages/mcp/__tests__/MCPServersPage.search.test.tsx
          git -c user.name='Laisky' -c user.email='github@laisky.com' commit -m 'fix(lists): preserve submitted MCP search and distinguish already-deleted channels'
          mkdir -p "$RUNNER_TEMP/pr428-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pr428-evidence/commit.txt"
          git diff --stat HEAD^ > "$RUNNER_TEMP/pr428-evidence/changes.txt"
      - name: Publish isolated delivery branch with ephemeral credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASKPASS=$(mktemp)
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push origin "HEAD:refs/heads/work/pr428-followup-delivery-$GITHUB_RUN_ID"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Reproduce the original missing-channel HTTP misclassification
        run: |
          git show 81ff8562c3efcf94cd90dea20692f0c48bcff9fa:controller/channel_selection.go > controller/channel_selection.go
          set +e
          go test -race -count=1 -timeout=3m -json ./controller -run '^TestSelectedDeletionReportsAlreadyMissing$' > "$RUNNER_TEMP/pr428-evidence/deletion-before.jsonl" 2>&1
          RESULT=$?
          set -e
          git restore controller/channel_selection.go
          test "$RESULT" -ne 0
          python3 - <<'PY'
          import json, os, pathlib
          events = []
          for line in pathlib.Path(os.environ['RUNNER_TEMP'], 'pr428-evidence/deletion-before.jsonl').read_text().splitlines():
              try: events.append(json.loads(line))
              except json.JSONDecodeError: pass
          assert any(e.get('Action') == 'fail' and e.get('Test') == 'TestSelectedDeletionReportsAlreadyMissing' for e in events)
          print('Confirmed a behavioral assertion failure on the original controller, not a compilation failure.')
          PY
      - name: Run affected backend tests with race detection
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=4m -json ./model ./controller ./router ./relay/adaptor/openai ./relay/controller -run 'Test(SetChannelStatus|ChannelStatusOnly|PlanChannelModelReset|ResetChannelModels|Selected|ListSelection|LogSelection|ChannelReset|ValidateOrderClause|GPT52|ModelSamplingCatalogPolicy|MappedChatSamplingPreservesNone|NativeResponsesPreservesSupportedSampling)|FuzzValidateOrderClauseUntrustedInput' | tee "$RUNNER_TEMP/pr428-evidence/targeted-after.jsonl"
      - name: Vet complete repository
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee "$RUNNER_TEMP/pr428-evidence/vet.log"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked Modern dependencies
        working-directory: web/modern
        run: yarn install --frozen-lockfile --non-interactive
      - name: Reproduce MCP search failure on the original page
        working-directory: web/modern
        run: |
          git show 81ff8562c3efcf94cd90dea20692f0c48bcff9fa:web/modern/src/pages/mcp/MCPServersPage.tsx > src/pages/mcp/MCPServersPage.tsx
          set +e
          yarn test run src/pages/mcp/__tests__/MCPServersPage.search.test.tsx --reporter=json --outputFile="$RUNNER_TEMP/pr428-evidence/mcp-before.json"
          RESULT=$?
          set -e
          git restore src/pages/mcp/MCPServersPage.tsx
          test "$RESULT" -ne 0
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'pr428-evidence/mcp-before.json').read_text())
          assert result['numFailedTests'] >= 3, result
          assert result.get('numRuntimeErrorTestSuites', 0) == 0, result
          print('Original MCP page reproduced the new search assertion failures.')
          PY
      - name: Verify TypeScript and locale alignment
        working-directory: web/modern
        run: |
          set -o pipefail
          yarn type-check 2>&1 | tee "$RUNNER_TEMP/pr428-evidence/typescript.log"
          yarn check:i18n 2>&1 | tee "$RUNNER_TEMP/pr428-evidence/i18n.log"
      - name: Complete Modern regression suite
        working-directory: web/modern
        run: yarn test run --reporter=json --outputFile="$RUNNER_TEMP/pr428-evidence/modern-after.json"
      - name: Production Modern build
        working-directory: web/modern
        run: |
          set -o pipefail
          yarn build:prod 2>&1 | tee "$RUNNER_TEMP/pr428-evidence/build.log"
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr428-followup-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/pr428-evidence
          retention-days: 7
