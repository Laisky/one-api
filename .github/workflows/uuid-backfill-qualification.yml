# External UUID backfill qualification.
#
# Implements UUID-A31 and UUID-V07 of
# docs/proposals/20260715_incremental-uuid-backfill.md: the live acceptance
# matrix must run against real MySQL 8.4 and PostgreSQL 17 services with
# SEPARATE primary and log databases, so the split topology under test is
# genuinely split across two physical databases rather than one handle opened
# twice.
#
# Why the DSNs are mandatory, not optional:
# The model package's live subtests skip themselves when their DSN env var is
# unset (that is deliberate, so an ordinary developer `go test ./...` stays
# green without a database). Release qualification must not inherit that
# behaviour: a silently skipped MySQL or PostgreSQL subtest looks identical to
# a passing one. Setting ONEAPI_REQUIRE_DB_BACKENDS=1 flips model's
# requireBackend() from t.Skipf to t.Fatalf, so a missing PG_DSN / PG_LOG_DSN /
# MYSQL_DSN / MYSQL_LOG_DSN FAILS this job instead of quietly shrinking the
# matrix. The explicit "assert nothing skipped" step below is the second belt:
# it fails the job if any acceptance test reports SKIP for any other reason.
#
# Not duplicated here: `go vet ./...` already runs in pr.yml (Go Vet job) and
# the unit/race suite already runs in lint.yml (go_tests), so this workflow
# only owns what those cannot do — the live, non-skipping database matrix.

name: uuid-backfill-qualification

on:
  push:
    branches:
      - 'master'
      - 'main'
    paths:
      - 'model/**'
      - 'common/**'
      - '.github/workflows/uuid-backfill-qualification.yml'
  pull_request:
    branches:
      - 'master'
      - 'main'
    paths:
      - 'model/**'
      - 'common/**'
      - '.github/workflows/uuid-backfill-qualification.yml'
  schedule:
    # Weekly full-scale qualification (UUID-A33): too slow for per-PR CI.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      run_scale:
        description: 'Run the full 1,000,000-log / 100,000-token scale acceptance (UUID-A33)'
        type: boolean
        default: false

jobs:
  qualification:
    name: UUID acceptance matrix (MySQL 8.4 + PostgreSQL 17)
    runs-on: ubuntu-latest
    # The live matrix runs unified and split topologies, finalizer off and on,
    # across two engines, plus EXPLAIN and online-index-promotion tests.
    timeout-minutes: 45
    concurrency:
      group: uuid_qualification-${{ github.ref }}
      cancel-in-progress: true

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          # Only the primary database can be auto-created here; MYSQL_DATABASE
          # takes a single name, so oneapi_log is created by a step below.
          MYSQL_DATABASE: oneapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Same single-database limitation; oneapi_log is created by a step below.
          POSTGRES_DB: oneapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d oneapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=10s

    env:
      # DSN syntax mirrors model/boot_migration_multidb_test.go openBackend():
      # gorm's postgres driver takes a URL, gorm's mysql driver takes the
      # user:pass@tcp(host:port)/db form.
      PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi?sslmode=disable
      PG_LOG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi_log?sslmode=disable
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      MYSQL_LOG_DSN: root:root@tcp(127.0.0.1:3306)/oneapi_log?charset=utf8mb4&parseTime=True&loc=Local
      # UUID-A31: a missing DSN must fail the job, never skip a dialect subtest.
      ONEAPI_REQUIRE_DB_BACKENDS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Install database clients
        # Installed explicitly rather than relying on whatever the runner image
        # ships, so the log-database creation below is deterministic.
        run: sudo apt-get update && sudo apt-get install -y mysql-client postgresql-client

      - name: Create the MySQL log database
        # The split topology needs a second physical database; the service
        # container's MYSQL_DATABASE only created the primary.
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -P 3306 -uroot -e "CREATE DATABASE IF NOT EXISTS oneapi_log CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"

      - name: Create the PostgreSQL log database
        # PostgreSQL has no CREATE DATABASE IF NOT EXISTS, so probe pg_database first.
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'oneapi_log'" | grep -q 1 \
            || psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -c "CREATE DATABASE oneapi_log;"

      - name: Verify all four DSNs are exported
        # Fails fast with a readable message instead of waiting for the Go
        # t.Fatalf that ONEAPI_REQUIRE_DB_BACKENDS=1 would eventually raise.
        run: |
          set -euo pipefail
          for var in PG_DSN PG_LOG_DSN MYSQL_DSN MYSQL_LOG_DSN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::${var} is unset; UUID-V07 requires all four DSNs for release qualification"
              exit 1
            fi
            echo "${var} is set"
          done

      - name: Run the UUID acceptance matrix
        # -race matches the repo's test convention and covers the concurrent
        # worker / online-promotion subtests. Output is teed so the next step
        # can prove no dialect skipped.
        run: |
          set -euo pipefail
          go test -race -v -timeout 30m ./model/ \
            -run 'TestUUIDMigrationMatrixOnLiveBackends|TestUUIDCandidateAndReferenceQueryPlans|TestOnlineUniqueIndexPromotionDoesNotBlockTraffic|TestUUIDFinalizationFailuresLeaveNoMarker|TestUUIDIndexMetadataAfterFinalization|TestMarkerTimestampsAreUTCAndStable|TestBackendAvailabilityGuard' \
            2>&1 | tee uuid-qualification.log

      - name: Assert no acceptance test skipped
        # Section 10: "The qualification job fails when any required DSN is
        # missing or a dialect test skips." The -run filter above selects only
        # live acceptance tests, so any SKIP here is a qualification failure.
        run: |
          set -euo pipefail
          if grep -E '^[[:space:]]*--- SKIP' uuid-qualification.log; then
            echo "::error::a UUID acceptance test skipped; release qualification requires a non-skipping live matrix (UUID-A31/UUID-V07)"
            exit 1
          fi
          echo "no acceptance test skipped"

      - name: Upload qualification evidence
        # UUID-A39/UUID-V09: EXPLAIN plans and marker/index assertions are
        # logged by the tests and attached here as release evidence.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uuid-qualification-log
          path: uuid-qualification.log
          retention-days: 90

  scale:
    name: UUID scale acceptance (UUID-A33)
    # Gated off the per-PR path: the full fixture is 1,000,000 logs and 100,000
    # tokens per dialect (plus a 10x-smaller comparison fixture for UUID-A34),
    # which is far too slow for every push. Runs on the weekly schedule, on
    # manual dispatch with run_scale=true, or on a PR labelled "uuid-scale".
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_scale == 'true')
      || contains(github.event.pull_request.labels.*.name, 'uuid-scale')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: uuid_scale-${{ github.ref }}
      cancel-in-progress: true

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oneapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d oneapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=10s

    env:
      PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi?sslmode=disable
      PG_LOG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi_log?sslmode=disable
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      MYSQL_LOG_DSN: root:root@tcp(127.0.0.1:3306)/oneapi_log?charset=utf8mb4&parseTime=True&loc=Local
      # UUID-A31: a missing DSN fails rather than skipping the dialect.
      ONEAPI_REQUIRE_DB_BACKENDS: '1'
      ONEAPI_UUID_SCALE_TEST: '1'
      # ONEAPI_UUID_SCALE_LOG_ROWS and ONEAPI_UUID_SCALE_TOKEN_ROWS are
      # deliberately NOT set: UUID-A33 requires the full 1,000,000-log /
      # 100,000-token fixture and says qualification must fail rather than warn
      # or skip on a smaller one. Leaving them unset keeps the test's own
      # defaults (uuidScaleDefaultLogRows / uuidScaleDefaultTokenRows) in force.
      # Never lower them here to make this job finish faster.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Install database clients
        run: sudo apt-get update && sudo apt-get install -y mysql-client postgresql-client

      - name: Create the MySQL log database
        env:
          MYSQL_PWD: root
        run: mysql -h 127.0.0.1 -P 3306 -uroot -e "CREATE DATABASE IF NOT EXISTS oneapi_log CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"

      - name: Create the PostgreSQL log database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'oneapi_log'" | grep -q 1 \
            || psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -c "CREATE DATABASE oneapi_log;"

      - name: Run the scale acceptance test
        # No -race here on purpose: the race detector distorts both wall time
        # and the peak-heap measurement this test asserts on (UUID-A34), and it
        # would push the 1,000,000-row fixture past any sane CI budget.
        run: |
          set -euo pipefail
          go test -v -timeout 115m ./model/ -run 'TestExternalUUIDFinalizerScaleT27' \
            2>&1 | tee uuid-scale.log

      - name: Assert the scale test did not skip a dialect
        run: |
          set -euo pipefail
          if grep -E '^[[:space:]]*--- SKIP' uuid-scale.log; then
            echo "::error::a UUID scale dialect skipped; UUID-A33 requires SQLite, MySQL, and PostgreSQL to all run"
            exit 1
          fi
          echo "no scale dialect skipped"

      - name: Upload scale evidence
        # UUID-A39: wall time, peak heap, query counts, and bind counts are
        # logged by the test and retained as release artifacts.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uuid-scale-log
          path: uuid-scale.log
          retention-days: 90
