name: PR440 final review validation
on:
  push:
    branches: [work/pr440-final-20261002t2140]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 114e04cf188e8bf9144423b8934aee9d8cc190ce
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the content-addressed candidate patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          sha = '60d09623ebde300e043a5aa65b08d3163748e030'
          obj = json.loads(subprocess.check_output(['gh', 'api', f'repos/Laisky/one-api/git/blobs/{sha}']))
          data = base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == 'ae76bae77001e0683e381b92ed16a826adc5b1232d14dee810e42b2c4963585e'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate.patch').write_bytes(patch)
          PY
          test "$(git rev-parse HEAD)" = 114e04cf188e8bf9144423b8934aee9d8cc190ce
          git merge-base --is-ancestor 9a0f052cc60c34628988a239117212eba0076145 HEAD
          git apply --check --index "$RUNNER_TEMP/candidate.patch"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          git diff --cached --check
          test "$(git write-tree)" = b2a4c207d654d6d62563f19fb1a3808c62f4ab15
      - name: Publish only the isolated candidate branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Codex
          git config user.email codex@openai.com
          git commit -m 'fix: enforce paid retry veto and authoritative async task boundaries'
          test "$(git rev-parse HEAD^)" = 114e04cf188e8bf9144423b8934aee9d8cc190ce
          python3 - <<'PY'
          import base64, os, subprocess
          env = dict(os.environ)
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/work/pr440-final-verified-20261002t2200'], env=env, check=True)
          PY
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  databases:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oneapi
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneapi
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d oneapi"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi?sslmode=disable
      ONEAPI_REQUIRE_DB_BACKENDS: '1'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Exercise both real SQL engines without skipped cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = b2a4c207d654d6d62563f19fb1a3808c62f4ab15
          go test -json -race -count=1 -timeout 8m -run '^TestAsyncBilling(LiveDatabases|EvidenceLiveDatabases|AckBackoffLiveDatabases|IdentityLiveDatabases)$' ./model | tee "$RUNNER_TEMP/live-databases.jsonl"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 'live-databases.jsonl')
          events = [json.loads(line) for line in path.read_text().splitlines()]
          passed = {e.get('Test') for e in events if e['Action'] == 'pass'}
          expected = []
          for backend in ('mysql', 'postgres'):
              expected += [f'TestAsyncBillingLiveDatabases/{backend}/{case}' for case in ('unlimited=false', 'unlimited=true', 'competing-refunds')]
              expected += [f'TestAsyncBillingEvidenceLiveDatabases/{backend}/{case}' for case in ('anonymous', 'accepted')]
              expected += [f'TestAsyncBillingAckBackoffLiveDatabases/{backend}']
              expected += [f'TestAsyncBillingIdentityLiveDatabases/{backend}/{case}' for case in ('queued', 'completed', 'failed')]
          assert len(expected) == 18
          assert all(name in passed for name in expected), [name for name in expected if name not in passed]
          assert not any(e['Action'] == 'skip' for e in events), 'Live database tests must not skip'
          summary = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'passed_cases': expected, 'skipped': 0}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'database-summary.json').write_text(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr440-final-databases
          path: |
            ${{ runner.temp }}/live-databases.jsonl
            ${{ runner.temp }}/database-summary.json
          retention-days: 14
  codeql:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      - name: Build all production packages under CodeQL tracing
        run: go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          output: ${{ runner.temp }}/sarif
          upload: never
          upload-database: false
          category: pr440-final-review
      - name: Require no unsuppressed MuAPI request-forgery finding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse
          files = list(pathlib.Path(os.environ['RUNNER_TEMP'], 'sarif').glob('*.sarif'))
          assert files, 'CodeQL must produce actual SARIF'
          matching, all_rules = [], []
          for file in files:
              for run in json.loads(file.read_text()).get('runs', []):
                  for result in run.get('results', []):
                      all_rules.append(result.get('ruleId'))
                      paths = [urllib.parse.unquote(loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')) for loc in result.get('locations', [])]
                      if result.get('ruleId') == 'go/request-forgery' and any('relay/adaptor/muapi/' in path for path in paths):
                          matching.append({'rule': result['ruleId'], 'paths': paths, 'message': result.get('message')})
          summary = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'muapi_request_forgery': matching, 'all_result_rules': all_rules}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'codeql-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          assert summary['tree'] == 'b2a4c207d654d6d62563f19fb1a3808c62f4ab15'
          assert not matching, 'MuAPI finding must be corrected, not suppressed'
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr440-final-codeql
          path: |
            ${{ runner.temp }}/sarif
            ${{ runner.temp }}/codeql-summary.json
          retention-days: 14
