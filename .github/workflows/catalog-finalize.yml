# Temporary, branch-scoped publication of the locally reviewed catalog patch.
# Removed after this run. No inference requests, deployment, or secret artifacts.
name: Validate and publish catalog refresh
on:
  push:
    branches: [feat/adaptor-catalog-audit-20260924]
    paths: [.github/workflows/catalog-finalize.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'Laisky/one-api' && github.actor == 'Laisky'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '4'
      BRANCH: feat/adaptor-catalog-audit-20260924
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and apply the exact reviewed patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          raw = b''.join(pathlib.Path(f'.github/catalog-refresh-{n}.bin').read_bytes() for n in (1,2,3))
          assert hashlib.sha256(raw).hexdigest() == '8e4437df86595bdb4d1016ee0423f805072d47e0ff3fdf95ad2d582971f2522a'
          patch = lzma.decompress(raw)
          assert len(patch) == 115480
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/') or line.startswith('--- a/'):
                  path = line[6:]
                  assert path.startswith(('relay/adaptor/', 'scripts/model_catalog/')), path
                  assert '..' not in pathlib.PurePosixPath(path).parts
          subprocess.run(['git','apply','--check'], input=patch, check=True)
          subprocess.run(['git','apply'], input=patch, check=True)
          PY
      - name: Recover checksum-pinned official evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE: ${{ runner.temp }}/catalog-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, urllib.parse, zipfile
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, url):
                  assert urllib.parse.urlparse(url).scheme == 'https'
                  result = super().redirect_request(req, fp, code, msg, headers, url)
                  if urllib.parse.urlparse(req.full_url).netloc != urllib.parse.urlparse(url).netloc:
                      result.remove_header('Authorization')
                  return result
          opener = urllib.request.build_opener(SafeRedirect())
          for name, artifact, digest in [
              ('first',10786856262,'ef64a08dfb20c3e4d6bd5a6cb513164d21946ac0993e7639c2b148133359ddd2'),
              ('second',10787520054,'c98038bf2fc008900eed24bdf40789e0dde7a23025e4c3b5d04629586c3f5f7d'),
              ('final',10789137803,'fa6dbd3a2764916413e57198e85fa99f65b38ea2409bc1167504fe03f9b945b7'),
          ]:
              req = urllib.request.Request(f'https://api.github.com/repos/Laisky/one-api/actions/artifacts/{artifact}/zip', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with opener.open(req, timeout=90) as response:
                  raw = response.read(64*1024*1024+1)
              assert hashlib.sha256(raw).hexdigest() == digest, name
              target = pathlib.Path(os.environ['EVIDENCE'])/name
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  assert sum(i.file_size for i in archive.infolist()) < 512*1024*1024
                  for item in archive.infolist():
                      path = pathlib.PurePosixPath(item.filename)
                      assert not path.is_absolute() and '..' not in path.parts
                      if len(path.parts)==1 and (path.suffix=='.data' or path.name=='sources.json'):
                          (target/path.name).write_bytes(archive.read(item))
              print(name, 'verified')
          PY
      - name: Regenerate and test every converter
        env:
          MODEL_CATALOG_EVIDENCE: ${{ runner.temp }}/catalog-evidence
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r scripts/model_catalog/requirements.txt
          python3 -m unittest discover -s scripts/model_catalog -v
          python3 scripts/model_catalog/refresh.py --evidence-root "$MODEL_CATALOG_EVIDENCE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Validate all adaptor code before publishing
        run: |
          set -euo pipefail
          gofmt -w relay/adaptor/*/zz_catalog_20260924.go
          go test -race -count=1 ./relay/adaptor/...
          go vet ./relay/...
          git diff --check
      - name: Publish only reviewed source and generated catalogs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add relay/adaptor scripts/model_catalog docs/research/model_catalog_20260924
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths
          assert all(p.startswith(('relay/adaptor/','scripts/model_catalog/','docs/research/model_catalog_20260924/')) for p in paths)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(adaptors): publish verified provider snapshots and behavioral fixes'
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/catalog-published-commit.txt"
      - name: Preserve reproducible public evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-audit-public-evidence
          path: |
            ${{ runner.temp }}/catalog-evidence
            ${{ runner.temp }}/catalog-published-commit.txt
          retention-days: 90
