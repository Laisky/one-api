# One-off behavioral qualification for PR #600. Remove after the final green run.
name: PR600 temporary SSE regression qualification

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  stream_regression:
    if: github.event.pull_request.number == 600
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
      - name: Behavioral regression tests
        env:
          GOMAXPROCS: '4'
        run: |
          set -euo pipefail
          go test -p=4 -count=1 -timeout=180s ./relay/adaptor/openai_compatible \
            -run '^(TestDoneCancellationWriterRejectsNonterminalFrames|TestDoneCancellationWriterRejectsShortWrites|TestSharedStreamDoneCancellation|TestIssue599IndependentFailurePreserved)$'
      - name: Race qualification
        env:
          GOMAXPROCS: '4'
        run: |
          set -euo pipefail
          go test -race -p=4 -count=10 -timeout=240s ./relay/adaptor/openai_compatible \
            -run '^(TestDoneCancellationWriterRejectsNonterminalFrames|TestDoneCancellationWriterRejectsShortWrites|TestSharedStreamDoneCancellation|TestIssue599IndependentFailurePreserved|TestIssue599NativeHTTPReadAfterDONE|TestIssue599JoinedCancellationCausePreservesIndependentErrors|TestIssue599PureCancellationCauseStillCompletes)$'
