name: bolt-stream-performance

on:
  push:
    branches:
      - 'bolt/stream-bridge-allocations-20260818'

permissions:
  contents: write
  statuses: write

jobs:
  optimize:
    name: Validate and commit stream optimization
    runs-on: ubuntu-latest
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = json.dumps(
              {
                  "state": "pending",
                  "context": "bolt/stream-optimize",
                  "description": "validating allocation patch against baseline",
                  "target_url": (
                      f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
                  ),
              }
          ).encode()
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/statuses/{os.environ['GITHUB_SHA']}",
              data=body,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          urllib.request.urlopen(request).close()
          PY

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Apply focused optimization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("relay/controller/response_stream_bridge.go")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '\t"encoding/json"\n\t"fmt"\n\t"strings"\n',
                  '\t"encoding/json"\n\t"strings"\n',
              ),
              (
                  '''\t\tmodel:      meta.ActualModelName,\n\t\ttoolCalls:  make(map[string]*streamToolCallState),\n\t\ttoolIndex:  make(map[int]*streamToolCallState),\n''',
                  '''\t\tmodel:      meta.ActualModelName,\n''',
              ),
              (
                  'handler.messageItemID = fmt.Sprintf("msg_%s", random.GetRandomString(16))',
                  'handler.messageItemID = "msg_" + random.GetRandomString(16)',
              ),
              (
                  '''func (h *chatToResponseStreamBridge) ensureToolCallState(c *gin.Context, tool *model.Tool) *streamToolCallState {\n\tnormalizedID := ""\n''',
                  '''func (h *chatToResponseStreamBridge) ensureToolCallState(c *gin.Context, tool *model.Tool) *streamToolCallState {\n\t// Text-only streams never use tool state, so allocate these maps only when\n\t// the first tool delta arrives instead of on every bridged response.\n\tif h.toolCalls == nil {\n\t\th.toolCalls = make(map[string]*streamToolCallState)\n\t}\n\tif tool.Index != nil && h.toolIndex == nil {\n\t\th.toolIndex = make(map[int]*streamToolCallState)\n\t}\n\n\tnormalizedID := ""\n''',
              ),
              (
                  'id = fmt.Sprintf("call_%s", random.GetRandomString(16))',
                  'id = "call_" + random.GetRandomString(16)',
              ),
              (
                  '''\tvar builder strings.Builder\n\tif eventType != "" {\n\t\tbuilder.WriteString("event: ")\n\t\tbuilder.WriteString(eventType)\n\t\tbuilder.WriteByte('\\n')\n\t}\n\tbuilder.WriteString("data: ")\n\tbuilder.Write(payload)\n\tbuilder.WriteString("\\n\\n")\n\n\tif _, err := c.Writer.Write([]byte(builder.String())); err != nil {\n''',
                  '''\tconst (\n\t\teventPrefix = "event: "\n\t\tdataPrefix  = "data: "\n\t\tframeSuffix = "\\n\\n"\n\t)\n\n\tframeSize := len(dataPrefix) + len(payload) + len(frameSuffix)\n\tif eventType != "" {\n\t\tframeSize += len(eventPrefix) + len(eventType) + 1\n\t}\n\tframe := make([]byte, 0, frameSize)\n\tif eventType != "" {\n\t\tframe = append(frame, eventPrefix...)\n\t\tframe = append(frame, eventType...)\n\t\tframe = append(frame, '\\n')\n\t}\n\tframe = append(frame, dataPrefix...)\n\tframe = append(frame, payload...)\n\tframe = append(frame, frameSuffix...)\n\n\tif _, err := c.Writer.Write(frame); err != nil {\n''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY
          gofmt -w relay/controller/response_stream_bridge.go
          git diff --check

      - name: Run unit and behavior contracts
        run: >-
          go test ./relay/controller
          -run '^(TestChatToResponseStreamBridge_EmitEventExactBytes|TestChatToResponseStreamBridge_TextStreaming|TestChatToResponseStreamBridge_ReasoningStreaming|TestChatToResponseStreamBridge_ToolCallIndexLookup|TestChatToResponseStreamBridge_ToolCallWithoutFunction)$'
          -count=1

      - name: Vet optimized package
        run: go vet ./relay/controller

      - name: Measure and enforce allocation improvement
        env:
          GOMAXPROCS: '1'
        run: |
          set -o pipefail
          go test ./relay/controller \
            -run '^$' \
            -bench '^BenchmarkChatToResponseStreamBridge' \
            -benchmem \
            -benchtime=1s \
            -count=10 \
            -cpu=1 | tee /tmp/bolt-stream-bench.txt
          python - <<'PY'
          import json
          import re
          import statistics

          pattern = re.compile(
              r"^(BenchmarkChatToResponseStreamBridge(?:ConstructTextOnly|EmitEvent))"
              r"(?:-\d+)?\s+\d+\s+([\d.]+)\s+ns/op"
              r"(?:\s+[\d.]+\s+MB/s)?\s+(\d+)\s+B/op\s+(\d+)\s+allocs/op$"
          )
          measurements = {}
          with open("/tmp/bolt-stream-bench.txt", encoding="utf-8") as bench_file:
              for line in bench_file:
                  match = pattern.match(line.strip())
                  if match:
                      measurements.setdefault(match.group(1), []).append(
                          (float(match.group(2)), int(match.group(3)), int(match.group(4)))
                      )

          expected = {
              "BenchmarkChatToResponseStreamBridgeConstructTextOnly": (1216, 56),
              "BenchmarkChatToResponseStreamBridgeEmitEvent": (2984, 6),
          }
          if set(measurements) != set(expected):
              raise SystemExit(f"unexpected benchmark output: {sorted(measurements)}")

          summary = {}
          for name, samples in measurements.items():
              medians = {
                  "ns_per_op": statistics.median(sample[0] for sample in samples),
                  "bytes_per_op": statistics.median(sample[1] for sample in samples),
                  "allocs_per_op": statistics.median(sample[2] for sample in samples),
                  "samples": len(samples),
              }
              baseline_bytes, baseline_allocs = expected[name]
              if medians["bytes_per_op"] >= baseline_bytes:
                  raise SystemExit(f"{name}: bytes/op did not improve: {medians}")
              if medians["allocs_per_op"] >= baseline_allocs:
                  raise SystemExit(f"{name}: allocs/op did not improve: {medians}")
              summary[name] = medians

          with open("/tmp/bolt-stream-metrics.json", "w", encoding="utf-8") as result:
              json.dump(summary, result)
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit validated source change
        run: |
          git config user.name "Bolt"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/controller/response_stream_bridge.go
          git commit -m "perf(stream): reduce response bridge allocations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "OPTIMIZED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish optimized benchmark medians
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open("/tmp/bolt-stream-metrics.json", encoding="utf-8") as result:
              metrics = json.load(result)
          contexts = {
              "BenchmarkChatToResponseStreamBridgeConstructTextOnly": "bolt/stream-construct",
              "BenchmarkChatToResponseStreamBridgeEmitEvent": "bolt/stream-emit-event",
          }
          target_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          status_url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/statuses/{os.environ['OPTIMIZED_SHA']}"
          )
          for name, context in contexts.items():
              sample = metrics[name]
              description = (
                  f"median {sample['ns_per_op']:.1f} ns/op, "
                  f"{sample['bytes_per_op']:g} B/op, "
                  f"{sample['allocs_per_op']:g} allocs/op (n={sample['samples']})"
              )
              body = json.dumps(
                  {
                      "state": "success",
                      "context": context,
                      "description": description,
                      "target_url": target_url,
                  }
              ).encode()
              request = urllib.request.Request(
                  status_url,
                  data=body,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              urllib.request.urlopen(request).close()

          body = json.dumps(
              {
                  "state": "success",
                  "context": "bolt/stream-optimize",
                  "description": "allocation patch validated and committed",
                  "target_url": target_url,
              }
          ).encode()
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/statuses/{os.environ['GITHUB_SHA']}",
              data=body,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          urllib.request.urlopen(request).close()
          PY

      - name: Publish failed status
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          body = json.dumps(
              {
                  "state": "failure",
                  "context": "bolt/stream-optimize",
                  "description": "patch validation or benchmark failed",
                  "target_url": (
                      f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                      f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
                  ),
              }
          ).encode()
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/statuses/{os.environ['GITHUB_SHA']}",
              data=body,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              urllib.request.urlopen(request).close()
          except Exception as exc:
              print(f"failed to publish failure status: {exc}")
          PY
