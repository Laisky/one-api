name: bolt-stream-performance

on:
  push:
    branches:
      - 'bolt/stream-bridge-allocations-20260818'

permissions:
  contents: read
  statuses: write

jobs:
  benchmark:
    name: Response stream benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Publish running status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          status_url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/statuses/{os.environ['GITHUB_SHA']}"
          )
          target_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          for context in ("bolt/stream-construct", "bolt/stream-emit-event"):
              body = json.dumps(
                  {
                      "state": "pending",
                      "context": context,
                      "description": "benchmark and behavior contracts are running",
                      "target_url": target_url,
                  }
              ).encode()
              request = urllib.request.Request(
                  status_url,
                  data=body,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f"status publish failed: HTTP {response.status}")
          PY

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Run behavior contracts
        run: >-
          go test ./relay/controller
          -run '^(TestChatToResponseStreamBridge_EmitEventExactBytes|TestChatToResponseStreamBridge_TextStreaming|TestChatToResponseStreamBridge_ReasoningStreaming|TestChatToResponseStreamBridge_ToolCallIndexLookup)$'
          -count=1

      - name: Vet optimized package
        run: go vet ./relay/controller

      - name: Measure allocations
        env:
          GOMAXPROCS: '1'
        run: |
          set -o pipefail
          go test ./relay/controller \
            -run '^$' \
            -bench '^BenchmarkChatToResponseStreamBridge' \
            -benchmem \
            -benchtime=1s \
            -count=10 \
            -cpu=1 | tee /tmp/bolt-stream-bench.txt

      - name: Publish benchmark medians
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import statistics
          import urllib.request

          pattern = re.compile(
              r"^(BenchmarkChatToResponseStreamBridge(?:ConstructTextOnly|EmitEvent))(?:-\d+)?"
              r"\s+\d+\s+([\d.]+)\s+ns/op\s+(\d+)\s+B/op\s+(\d+)\s+allocs/op$"
          )
          measurements = {}
          with open("/tmp/bolt-stream-bench.txt", encoding="utf-8") as bench_file:
              for line in bench_file:
                  match = pattern.match(line.strip())
                  if match is None:
                      continue
                  measurements.setdefault(match.group(1), []).append(
                      (float(match.group(2)), int(match.group(3)), int(match.group(4)))
                  )

          contexts = {
              "BenchmarkChatToResponseStreamBridgeConstructTextOnly": "bolt/stream-construct",
              "BenchmarkChatToResponseStreamBridgeEmitEvent": "bolt/stream-emit-event",
          }
          if set(measurements) != set(contexts):
              raise SystemExit(f"unexpected benchmark output: {sorted(measurements)}")

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          target_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          status_url = f"{api_url}/repos/{repository}/statuses/{sha}"

          for name, context in contexts.items():
              samples = measurements[name]
              ns_per_op = statistics.median(sample[0] for sample in samples)
              bytes_per_op = statistics.median(sample[1] for sample in samples)
              allocs_per_op = statistics.median(sample[2] for sample in samples)
              description = (
                  f"median {ns_per_op:.1f} ns/op, {bytes_per_op:g} B/op, "
                  f"{allocs_per_op:g} allocs/op (n={len(samples)})"
              )
              body = json.dumps(
                  {
                      "state": "success",
                      "context": context,
                      "description": description,
                      "target_url": target_url,
                  }
              ).encode()
              request = urllib.request.Request(
                  status_url,
                  data=body,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  if response.status != 201:
                      raise SystemExit(f"status publish failed: HTTP {response.status}")
          PY

      - name: Publish failed status
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          status_url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/statuses/{os.environ['GITHUB_SHA']}"
          )
          target_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          for context in ("bolt/stream-construct", "bolt/stream-emit-event"):
              body = json.dumps(
                  {
                      "state": "failure",
                      "context": context,
                      "description": "benchmark or behavior contract failed",
                      "target_url": target_url,
                  }
              ).encode()
              request = urllib.request.Request(
                  status_url,
                  data=body,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  urllib.request.urlopen(request).close()
              except Exception as exc:
                  print(f"failed to publish {context}: {exc}")
          PY
