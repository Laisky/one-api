name: PR440 non-adaptor audit qualification
on:
  push:
    branches: [work/pr440-nonadaptor-audit-20261002]
permissions:
  contents: read
env:
  AUDIT_BASE: 65269523add403b25c5e00cf501eb9eac8f13d9a
  AUDIT_TREE: 563a35f0195cfec6e655961476f0bca3167ff4fa
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 65269523add403b25c5e00cf501eb9eac8f13d9a
          fetch-depth: 0
          persist-credentials: false
      - name: Restore independently verified scope corrections
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDIT_BASE"
          test "$(git rev-parse HEAD^{tree})" = 8fc2e194969c381ca00d66c5009a3ed8f9ba2b67
          git merge-base --is-ancestor 9a0f052cc60c34628988a239117212eba0076145 HEAD
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          data = b''
          for sha in ['3b2688675bd257c5d22f18f70304314d39e85853', 'e0ce48f32d16611d1b8463190c680937c9ba93e0']:
              obj = json.loads(subprocess.check_output(['gh', 'api', f'repos/Laisky/one-api/git/blobs/{sha}']))
              chunk = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == sha
              data += chunk
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == 'bab27db2b10a88523db9248b1a53f836d356573f'
          patch = lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '651ce644addbb526833881f1d349611e2f98b6bdc45a40a06f4d7cb8cce8a140'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'scope.patch').write_bytes(patch)
          PY
          git restore --source=b1a2273ef41d4375ffe7bc5f18888ce11356285c --staged --worktree -- \
            middleware/video_task_binding.go model/async_task.go relay/asyncvideo/binding.go \
            relay/adaptor/openai/video.go relay/adaptor/xai/video_response.go \
            middleware/video_task_binding_test.go model/async_task_test.go relay/controller/xai_video_test.go
          git apply --check --index "$RUNNER_TEMP/scope.patch"
          git apply --index "$RUNNER_TEMP/scope.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$AUDIT_TREE"
      - name: Publish isolated candidate without touching the PR or main
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Codex
          git config user.email codex@openai.com
          git commit -m 'fix: narrow async video scope and enforce shared financial boundaries'
          test "$(git rev-parse HEAD^)" = "$AUDIT_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$AUDIT_TREE"
          git merge-base --is-ancestor 9a0f052cc60c34628988a239117212eba0076145 HEAD
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          env = dict(os.environ)
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/work/pr440-nonadaptor-candidate-20261002t2018'], env=env, check=True)
          rev = lambda ref: subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          manifest = {'commit': rev('HEAD'), 'tree': rev('HEAD^{tree}'), 'parent': rev('HEAD^'), 'patch_sha256': '651ce644addbb526833881f1d349611e2f98b6bdc45a40a06f4d7cb8cce8a140'}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate.json').write_text(json.dumps(manifest, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('sha=' + manifest['commit'] + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr440-nonadaptor-candidate
          path: ${{ runner.temp }}/candidate.json
          retention-days: 14
  databases:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oneapi
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneapi
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d oneapi"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi?sslmode=disable
      ONEAPI_REQUIRE_DB_BACKENDS: '1'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Require all 22 actual SQL leaf cases with no skips
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = "$AUDIT_TREE"
          go test -json -race -count=1 -timeout 10m -run '^TestAsyncBilling(LiveDatabases|EvidenceLiveDatabases|AckBackoffLiveDatabases|IdentityLiveDatabases|InvalidEvidenceLiveDatabases|RetentionLiveDatabases)$' ./model | tee "$RUNNER_TEMP/nonadaptor-databases.jsonl"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          events = [json.loads(line) for line in open(os.path.join(os.environ['RUNNER_TEMP'], 'nonadaptor-databases.jsonl'))]
          passed = {e.get('Test') for e in events if e['Action'] == 'pass'}
          required = []
          for backend in ('mysql', 'postgres'):
              for suite, cases in {'LiveDatabases': ['unlimited=false', 'unlimited=true', 'competing-refunds'], 'EvidenceLiveDatabases': ['anonymous', 'accepted'], 'IdentityLiveDatabases': ['queued', 'completed', 'failed']}.items():
                  required += [f'TestAsyncBilling{suite}/{backend}/{case}' for case in cases]
              required += [f'TestAsyncBilling{suite}/{backend}' for suite in ('AckBackoffLiveDatabases', 'InvalidEvidenceLiveDatabases', 'RetentionLiveDatabases')]
          assert len(required) == 22
          assert not set(required) - passed, f'Missing actual passes: {set(required) - passed}'
          assert not any(e['Action'] in ('skip', 'fail') for e in events), 'No failures or backend skips accepted'
          rev = lambda ref: subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          summary = {'commit': rev('HEAD'), 'tree': rev('HEAD^{tree}'), 'required_leaf_passes': required, 'skips': 0}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'databases-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr440-nonadaptor-databases
          path: |
            ${{ runner.temp }}/nonadaptor-databases.jsonl
            ${{ runner.temp }}/databases-summary.json
          retention-days: 14
  codeql:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      - name: Build exact production tree under standard tracing
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$AUDIT_TREE"
          go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          output: ${{ runner.temp }}/sarif
          upload: never
          upload-database: false
          category: pr440-nonadaptor-audit
      - name: Preserve actual unsuppressed results for comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.parse
          files = list(pathlib.Path(os.environ['RUNNER_TEMP'], 'sarif').glob('*.sarif'))
          assert files, 'Actual SARIF required'
          results = []
          for path in files:
              for run in json.loads(path.read_text()).get('runs', []):
                  for result in run.get('results', []):
                      paths = [urllib.parse.unquote(loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')) for loc in result.get('locations', [])]
                      results.append({'rule': result.get('ruleId'), 'paths': paths})
          assert not any(r['rule'] == 'go/request-forgery' and any('relay/adaptor/muapi/' in p for p in r['paths']) for r in results)
          rev = lambda ref: subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          summary = {'commit': rev('HEAD'), 'tree': rev('HEAD^{tree}'), 'results': results}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'codeql-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr440-nonadaptor-codeql
          path: |
            ${{ runner.temp }}/sarif
            ${{ runner.temp }}/codeql-summary.json
          retention-days: 14
