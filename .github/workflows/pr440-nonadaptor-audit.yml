name: PR440 non-adaptor audit export
on:
  push:
    branches: [work/pr440-nonadaptor-audit-20261002]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify audited ancestry and export repository
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = cfa6e48bbbcdb3d5f7efc08cfa87967696123048
          git merge-base --is-ancestor d7fa5f35ebf3dd6072eace68bd0178196baa0823 cfa6e48bbbcdb3d5f7efc08cfa87967696123048
          git bundle create "$RUNNER_TEMP/pr440-audit.bundle" cfa6e48bbbcdb3d5f7efc08cfa87967696123048 d7fa5f35ebf3dd6072eace68bd0178196baa0823
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr440-nonadaptor-audit-source
          path: ${{ runner.temp }}/pr440-audit.bundle
          retention-days: 2
