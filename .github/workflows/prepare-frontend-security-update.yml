name: Prepare consolidated frontend security update

on:
  push:
    branches:
      - agent/consolidate-frontend-security-updates

permissions:
  contents: write

concurrency:
  group: prepare-consolidated-frontend-security-update
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YARN_VERSION: 1.22.22
      YARN_NETWORK_TIMEOUT: 600000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup production Node.js line
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pin Yarn Classic
        run: npm install --global "yarn@${YARN_VERSION}"

      - name: Preserve the pre-update lockfiles
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontend-lock-baseline
          cp web/air/yarn.lock /tmp/frontend-lock-baseline/air.yarn.lock
          cp web/berry/yarn.lock /tmp/frontend-lock-baseline/berry.yarn.lock
          cp web/modern/yarn.lock /tmp/frontend-lock-baseline/modern.yarn.lock

      - name: Update manifests and invalidate only affected lock entries
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import csv
          import json
          from pathlib import Path

          target_packages = {
              "@remix-run/router",
              "ajv",
              "axios",
              "brace-expansion",
              "flatted",
              "immutable",
              "jsonpath",
              "lodash",
              "mdast-util-to-hast",
              "minimatch",
              "node-forge",
              "picomatch",
              "qs",
              "react-router",
              "react-router-dom",
              "rollup",
              "underscore",
              "webpack",
          }

          manifest_updates = {
              "air": {
                  "axios": "^0.33.0",
                  "react-router-dom": "^6.30.3",
              },
              "berry": {
                  "axios": "^0.33.0",
                  "react-router": "6.30.3",
                  "react-router-dom": "6.30.3",
              },
              "modern": {
                  "axios": "^1.18.0",
                  "react-router-dom": "^6.30.3",
              },
          }

          def selector_package(selector: str) -> str:
              selector = selector.strip().strip('"')
              if selector.startswith("@"):
                  slash = selector.find("/")
                  separator = selector.find("@", slash + 1)
              else:
                  separator = selector.find("@")
              return selector if separator < 0 else selector[:separator]

          def should_refresh(package: str) -> bool:
              return package in target_packages or package.startswith("@rollup/rollup-")

          for theme, updates in manifest_updates.items():
              manifest_path = Path("web") / theme / "package.json"
              manifest = json.loads(manifest_path.read_text())
              for package, version in updates.items():
                  section = next(
                      (
                          candidate
                          for candidate in ("dependencies", "devDependencies")
                          if package in manifest.get(candidate, {})
                      ),
                      None,
                  )
                  if section is None:
                      raise SystemExit(f"{theme}: expected direct dependency {package!r} was not found")
                  manifest[section][package] = version
              manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")

              lock_path = Path("web") / theme / "yarn.lock"
              blocks = lock_path.read_text().split("\n\n")
              kept: list[str] = []
              removed: set[str] = set()
              for block in blocks:
                  lines = block.splitlines()
                  if not lines or not lines[0].endswith(":") or lines[0].startswith("#"):
                      kept.append(block)
                      continue
                  try:
                      selectors = next(csv.reader([lines[0][:-1]], skipinitialspace=True))
                  except csv.Error as exc:
                      raise SystemExit(f"{lock_path}: cannot parse lock header {lines[0]!r}: {exc}") from exc
                  packages = {selector_package(selector) for selector in selectors}
                  if any(should_refresh(package) for package in packages):
                      removed.update(packages)
                      continue
                  kept.append(block)
              lock_path.write_text("\n\n".join(kept).rstrip() + "\n")
              print(f"{theme}: invalidated {', '.join(sorted(removed))}")
          PY

      - name: Resolve refreshed dependency entries without lifecycle scripts
        run: |
          set -euo pipefail
          for theme in air berry modern; do
            echo "==> resolving $theme"
            yarn --cwd "web/${theme}" install \
              --ignore-scripts \
              --network-timeout "${YARN_NETWORK_TIMEOUT}"
          done

      - name: Verify patched version floors and query OSV for changed packages
        run: |
          python3 <<'PY'
          from __future__ import annotations

          import csv
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from collections import defaultdict
          from pathlib import Path

          target_packages = {
              "@remix-run/router",
              "ajv",
              "axios",
              "brace-expansion",
              "flatted",
              "immutable",
              "jsonpath",
              "lodash",
              "mdast-util-to-hast",
              "minimatch",
              "node-forge",
              "picomatch",
              "qs",
              "react-router",
              "react-router-dom",
              "rollup",
              "underscore",
              "webpack",
          }

          minimum_by_major: dict[str, dict[int, tuple[int, int, int]]] = {
              "@remix-run/router": {1: (1, 23, 2)},
              "ajv": {6: (6, 14, 0), 8: (8, 18, 0)},
              "axios": {0: (0, 33, 0), 1: (1, 18, 0)},
              "flatted": {3: (3, 4, 2)},
              "immutable": {4: (4, 3, 8), 5: (5, 1, 5)},
              "jsonpath": {1: (1, 3, 0)},
              "lodash": {4: (4, 18, 0)},
              "mdast-util-to-hast": {13: (13, 2, 1)},
              "minimatch": {
                  3: (3, 1, 4),
                  4: (4, 2, 5),
                  5: (5, 1, 8),
                  6: (6, 2, 2),
                  7: (7, 4, 8),
                  8: (8, 0, 6),
                  9: (9, 0, 7),
                  10: (10, 2, 3),
              },
              "node-forge": {1: (1, 4, 0)},
              "picomatch": {2: (2, 3, 2), 3: (3, 0, 2), 4: (4, 0, 4)},
              "qs": {6: (6, 14, 2)},
              "react-router": {6: (6, 30, 3)},
              "react-router-dom": {6: (6, 30, 3)},
              "rollup": {2: (2, 80, 0), 3: (3, 30, 0), 4: (4, 59, 0)},
              "webpack": {5: (5, 105, 4)},
          }

          expected_direct = {
              "air": {"axios": "^0.33.0", "react-router-dom": "^6.30.3"},
              "berry": {
                  "axios": "^0.33.0",
                  "react-router": "6.30.3",
                  "react-router-dom": "6.30.3",
              },
              "modern": {"axios": "^1.18.0", "react-router-dom": "^6.30.3"},
          }

          def selector_package(selector: str) -> str:
              selector = selector.strip().strip('"')
              if selector.startswith("@"):
                  slash = selector.find("/")
                  separator = selector.find("@", slash + 1)
              else:
                  separator = selector.find("@")
              return selector if separator < 0 else selector[:separator]

          def parse_lock(path: Path) -> dict[str, set[str]]:
              packages: dict[str, set[str]] = defaultdict(set)
              for block in path.read_text().split("\n\n"):
                  lines = block.splitlines()
                  if not lines or not lines[0].endswith(":") or lines[0].startswith("#"):
                      continue
                  selectors = next(csv.reader([lines[0][:-1]], skipinitialspace=True))
                  version = None
                  for line in lines[1:]:
                      match = re.fullmatch(r'  version "([^"]+)"', line)
                      if match:
                          version = match.group(1)
                          break
                  if version is None:
                      raise SystemExit(f"{path}: no version found for {lines[0]!r}")
                  for selector in selectors:
                      packages[selector_package(selector)].add(version)
              return packages

          def semver_tuple(version: str) -> tuple[int, int, int]:
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:[-+].*)?", version)
              if not match:
                  raise SystemExit(f"cannot compare non-semver dependency version {version!r}")
              return tuple(int(part) for part in match.groups())

          updated_pairs: set[tuple[str, str]] = set()
          baseline_pairs: set[tuple[str, str]] = set()

          for theme, expected in expected_direct.items():
              manifest = json.loads((Path("web") / theme / "package.json").read_text())
              direct = {**manifest.get("dependencies", {}), **manifest.get("devDependencies", {})}
              for package, required in expected.items():
                  actual = direct.get(package)
                  if actual != required:
                      raise SystemExit(
                          f"{theme}: {package} manifest version is {actual!r}; expected {required!r}"
                      )

              updated = parse_lock(Path("web") / theme / "yarn.lock")
              baseline = parse_lock(Path("/tmp/frontend-lock-baseline") / f"{theme}.yarn.lock")
              updated_pairs.update((package, version) for package, versions in updated.items() for version in versions)
              baseline_pairs.update((package, version) for package, versions in baseline.items() for version in versions)

              for package, majors in minimum_by_major.items():
                  for version in updated.get(package, set()):
                      parsed = semver_tuple(version)
                      minimum = majors.get(parsed[0])
                      if minimum is not None and parsed < minimum:
                          raise SystemExit(
                              f"{theme}: {package} {version} is below patched floor "
                              f"{'.'.join(map(str, minimum))}"
                          )

          if any(Path("web").glob("*/package-lock.json")):
              raise SystemExit("package-lock.json must not be reintroduced; Yarn is the repository lockfile authority")

          changed_pairs = updated_pairs - baseline_pairs
          candidates = sorted(
              changed_pairs
              | {
                  pair
                  for pair in updated_pairs
                  if pair[0] in target_packages or pair[0].startswith("@rollup/rollup-")
              }
          )
          print(f"OSV: checking {len(candidates)} changed or security-target package versions")

          endpoint = "https://api.osv.dev/v1/querybatch"
          findings: list[tuple[str, str, str, str]] = []
          for start in range(0, len(candidates), 100):
              batch = candidates[start : start + 100]
              payload = json.dumps(
                  {
                      "queries": [
                          {
                              "package": {"name": package, "ecosystem": "npm"},
                              "version": version,
                          }
                          for package, version in batch
                      ]
                  }
              ).encode()
              response_data = None
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(
                          endpoint,
                          data=payload,
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )
                      with urllib.request.urlopen(request, timeout=45) as response:
                          response_data = json.load(response)
                      break
                  except (urllib.error.URLError, TimeoutError) as exc:
                      if attempt == 3:
                          raise SystemExit(f"OSV query failed after 3 attempts: {exc}") from exc
                      time.sleep(attempt * 2)
              results = response_data.get("results", [])
              if len(results) != len(batch):
                  raise SystemExit(
                      f"OSV returned {len(results)} results for a batch of {len(batch)} queries"
                  )
              for (package, version), result in zip(batch, results, strict=True):
                  for vulnerability in result.get("vulns", []):
                      findings.append(
                          (
                              package,
                              version,
                              vulnerability.get("id", "unknown"),
                              vulnerability.get("summary", "known vulnerability"),
                          )
                      )

          if findings:
              for package, version, vulnerability_id, summary in findings:
                  print(f"VULNERABLE: {package}@{version}: {vulnerability_id}: {summary}")
              raise SystemExit("known vulnerabilities remain in changed or security-target dependencies")
          print("OSV: no known vulnerabilities found in changed or security-target dependency versions")
          PY

      - name: Clean frozen installs with lifecycle scripts
        run: |
          set -euo pipefail
          for theme in air berry modern; do
            echo "==> frozen install $theme"
            rm -rf "web/${theme}/node_modules"
            yarn --cwd "web/${theme}" install \
              --frozen-lockfile \
              --network-timeout "${YARN_NETWORK_TIMEOUT}"
          done

      - name: Run all frontend test suites
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          yarn --cwd web/modern test --run --passWithNoTests
          yarn --cwd web/air test --watchAll=false --passWithNoTests
          yarn --cwd web/berry test --watchAll=false --passWithNoTests

      - name: Make frozen installs and production builds permanent gates
        run: |
          python3 <<'PY'
          from pathlib import Path

          lint_path = Path(".github/workflows/lint.yml")
          lint = lint_path.read_text()
          install_old = "run: yarn install --network-timeout 600000"
          install_new = "run: yarn install --frozen-lockfile --network-timeout 600000"
          if lint.count(install_old) != 3:
              raise SystemExit("expected exactly three non-frozen frontend install commands in lint.yml")
          lint = lint.replace(install_old, install_new)

          test_commands = {
              "modern": "run: yarn test --run --passWithNoTests",
              "air": "run: yarn test --watchAll=false --passWithNoTests",
              "berry": "run: yarn test --watchAll=false --passWithNoTests",
          }
          for theme, command in test_commands.items():
              marker = f"        {command}\n"
              if lint.count(marker) != 1:
                  raise SystemExit(f"expected one {theme} test command in lint.yml")
              build = (
                  marker
                  + "\n"
                  + "      - name: Build production bundle\n"
                  + f"        working-directory: web/{theme}\n"
                  + "        env:\n"
                  + "          DISABLE_ESLINT_PLUGIN: 'true'\n"
                  + "          REACT_APP_VERSION: ci\n"
                  + "        run: yarn build\n"
              )
              lint = lint.replace(marker, build)
          lint_path.write_text(lint)

          docker_path = Path("Dockerfile")
          docker = docker_path.read_text()
          old = "yarn install --network-timeout 600000"
          new = "yarn install --frozen-lockfile --network-timeout 600000"
          if docker.count(old) != 1:
              raise SystemExit("expected exactly one non-frozen frontend install command in Dockerfile")
          docker_path.write_text(docker.replace(old, new))
          PY

      - name: Validate the production frontend build path
        run: docker build --target web-builder --progress=plain -t one-api-web-security-check .

      - name: Commit the validated consolidation
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-frontend-security-update.yml

          python3 <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/lint.yml",
              "Dockerfile",
              "web/air/package.json",
              "web/air/yarn.lock",
              "web/berry/package.json",
              "web/berry/yarn.lock",
              "web/modern/package.json",
              "web/modern/yarn.lock",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD^"], text=True
              ).splitlines()
          )
          unexpected = changed - allowed - {".github/workflows/prepare-frontend-security-update.yml"}
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f"unexpected generated changes: {sorted(unexpected)}")
          if missing:
              raise SystemExit(f"expected generated changes are missing: {sorted(missing)}")
          PY

          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/lint.yml \
            Dockerfile \
            web/air/package.json web/air/yarn.lock \
            web/berry/package.json web/berry/yarn.lock \
            web/modern/package.json web/modern/yarn.lock
          git add -u .github/workflows/prepare-frontend-security-update.yml
          git commit -m 'Consolidate frontend security dependency updates'
          git push origin HEAD
