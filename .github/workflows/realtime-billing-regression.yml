name: Realtime billing regression

on:
  pull_request:
    paths:
      - 'relay/realtime/**'
      - 'relay/quota/**'
      - 'relay/model/**'
      - 'relay/pricing/**'
      - 'relay/adaptor/openai/**'
      - 'controller/realtime*'
      - '.github/workflows/realtime-billing-regression.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  regression:
    name: Realtime regression (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package:
          - ./relay/realtime
          - ./relay/quota
          - ./relay/adaptor/openai
          - ./controller
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checkout credentials are not retained
        shell: bash
        run: |
          if git config --local --name-only --get-regexp '^http\..*\.extraheader$|^credential\.' >/dev/null; then
            echo '::error::Checkout retained credentials in the local Git configuration.'
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Reviewer behavior regressions
        run: go test -race -count=1 -timeout=5m -v -run '^TestReview' ${{ matrix.package }}
      - name: Package regression suite
        run: go test -race -count=1 -timeout=10m ${{ matrix.package }}
      - name: Vet package
        run: go vet ${{ matrix.package }}
      - name: Check realtime sentinel error convention
        if: matrix.package == './relay/realtime'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --no-config --enable-only err113 --timeout=5m ./relay/realtime
