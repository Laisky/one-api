name: Billing audit source snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/billing-audit-source.yml'

permissions:
  contents: write

jobs:
  source-snapshot:
    if: github.repository == 'Laisky/one-api' && github.event.pull_request.number == 407 && github.event.pull_request.user.login == 'Laisky' && github.event.pull_request.head.repo.full_name == 'Laisky/one-api' && github.head_ref == 'feat/jina-adaptor-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assemble verified Git tree without executing patched code or moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import subprocess
          import urllib.request

          repo = 'Laisky/one-api'
          api = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(api + path, data=data, headers=headers, method='GET' if body is None else 'POST')
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          blob_ids = ['4e0980b588f943a55ed1950856ca84e7bc902d6e', 'a39959ea9ed261f02a699a029ee8d7f7015f9983', '5c8cfb4aa80c124dad5f02e206e68d6ebfc66c44', 'e32856346336c86837e606c08e4df646e98886a1']
          encoded = b''
          for blob_id in blob_ids:
              result = request('/git/blobs/' + blob_id)
              assert result['encoding'] == 'base64'
              part = base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == blob_id
              encoded += part
          patch = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=128*1024*1024)
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '2e664eed03e98188c0a1266975348a130b515f85ad333b4bbcab1f84a1d03e4e'
          assert len(patch) == 126556
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert len(changed) == 33
          entries = []
          for name in changed:
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in {'model', 'relay', 'controller', 'docs'} and p.suffix in {'.go', '.md'}
              local = pathlib.Path(name)
              assert local.is_file() and not local.is_symlink()
              text = local.read_text(encoding='utf-8')
              assert len(text.encode()) < 100000
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'content': text})
          # The resulting commit has no temporary source-export/object-builder workflow.
          entries.append({'path': '.github/workflows/billing-audit-source.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = request('/git/trees', {'base_tree': base_tree, 'tree': entries})
          out = pathlib.Path('/tmp/billing-audit')
          out.mkdir(exist_ok=True)
          (out / 'tree.json').write_text(json.dumps({'parent_sha': parent, 'tree_sha': tree['sha'], 'patch_sha256': digest, 'changed_paths': changed}, indent=2))
          print('Prepared verified tree', tree['sha'], 'for parent', parent)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: billing-audit-tree-${{ github.event.pull_request.head.sha }}
          path: /tmp/billing-audit/tree.json
          retention-days: 1
          if-no-files-found: error
