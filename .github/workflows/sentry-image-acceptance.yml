# Temporary qualification branch only; no publication, credentials or production access.
name: Sentry image acceptance
on:
  push:
    branches: [qualification/sentry-561-20261013]
    paths: [.github/workflows/sentry-image-acceptance.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CANDIDATE_SHA: 995e4c8d767a495b3f15c397218f8d26922984c3
  CANDIDATE_TREE: 09bc0b9b0259843fe8f57ff6735da59ab0b52d7b
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 995e4c8d767a495b3f15c397218f8d26922984c3
          persist-credentials: false
      - name: Verify the immutable source tree
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
      - name: Build the existing amd64 Dockerfile without publishing
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build --build-arg TARGETARCH=amd64 --build-arg TARGETOS=linux \
            --label "org.opencontainers.image.revision=$CANDIDATE_SHA" \
            --iidfile "$RUNNER_TEMP/candidate-image-id" \
            --tag oneapi-acceptance:995e4c8d .
      - name: Smoke each theme in isolated containers with networking disabled
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,time,uuid
          def command(args, timeout=15):
              return subprocess.check_output(args,timeout=timeout,stderr=subprocess.DEVNULL)
          image_id=pathlib.Path(os.environ['RUNNER_TEMP'],'candidate-image-id').read_text().strip()
          image=json.loads(command(['docker','image','inspect',image_id]))[0]
          assert image['Architecture']=='amd64'
          assert image['Config']['Labels']['org.opencontainers.image.revision']==os.environ['CANDIDATE_SHA']
          report={'source':os.environ['CANDIDATE_SHA'],'tree':os.environ['CANDIDATE_TREE'],'image_id':image_id,'published':False,'themes':{}}
          for theme in ('modern','air','berry','default'):
              name='sentry-acceptance-'+uuid.uuid4().hex
              try:
                  command(['docker','run','-d','--network','none','--memory','2g','--pids-limit','256','--name',name,'-e','THEME='+theme,image_id])
                  deadline=time.monotonic()+180
                  status=None
                  while time.monotonic()<deadline:
                      try:
                          status=json.loads(command(['docker','exec',name,'curl','-fsS','--max-time','3','http://127.0.0.1:3000/api/status']))
                          if status.get('success') is True: break
                      except (subprocess.SubprocessError,json.JSONDecodeError): pass
                      time.sleep(2)
                  assert status and status.get('success') is True, 'Image did not become ready for '+theme
                  raw=command(['docker','exec',name,'curl','-fsS','-D','-','--max-time','5','http://127.0.0.1:3000/api/browser-config'])
                  headers,body=raw.split(b'\r\n\r\n',1)
                  assert b'cache-control: no-store' in headers.lower()
                  assert b'x-content-type-options: nosniff' in headers.lower()
                  assert json.loads(body)=={'sentry':None}, 'Fresh runtime must remain inactive'
                  html=command(['docker','exec',name,'curl','-fsS','--max-time','5','http://127.0.0.1:3000/']).decode()
                  entries=re.findall(r'<script[^>]+src="([^"]+)"',html)
                  assert entries, 'Missing embedded application entry'
                  identities=set(); assets={}
                  for entry in entries:
                      assert entry.startswith('/') and not entry.startswith('//')
                      asset=command(['docker','exec',name,'curl','-fsS','--max-time','5','http://127.0.0.1:3000'+entry])
                      assert b'sourceMappingURL=data:' not in asset
                      identities.update(re.findall(r'one-api-(?:modern|air|berry)@sha256:[a-f0-9]{64}',asset.decode()))
                      assets[entry]=hashlib.sha256(asset).hexdigest()
                  expected='modern' if theme=='default' else theme
                  assert any(x.startswith('one-api-'+expected+'@') for x in identities), 'Missing embedded release identity'
                  state=json.loads(command(['docker','inspect',name]))[0]
                  assert state['State']['Running'] and not state['State']['OOMKilled'] and state['RestartCount']==0
                  assert state['HostConfig']['NetworkMode']=='none'
                  report['themes'][theme]={'status':True,'browser_config':None,'releases':sorted(identities),'entry_assets':assets,'oom':False,'restarts':0}
              finally:
                  subprocess.run(['docker','rm','-f',name],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=30,check=False)
          target=pathlib.Path(os.environ['RUNNER_TEMP'],'image-acceptance.json');target.write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: image-acceptance-995e4c8d
          path: |
            ${{ runner.temp }}/candidate-image-id
            ${{ runner.temp }}/image-acceptance.json
          retention-days: 14
          if-no-files-found: error
