name: lint

on:
  push:
    branches:
      - 'master'
      - 'main'
      - 'test/ci'
  pull_request:
    branches:
      - 'master'
      - 'main'

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      modern: ${{ steps.filter.outputs.modern }}
      air: ${{ steps.filter.outputs.air }}
      berry: ${{ steps.filter.outputs.berry }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Detect changed paths
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/**'
            modern:
              - 'web/modern/**'
              - '.github/**'
            air:
              - 'web/air/**'
              - '.github/**'
            berry:
              - 'web/berry/**'
              - '.github/**'

  go_tests:
    name: Go unit tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # When you execute your unit tests, make sure to use the "-coverprofile" flag to write a
      # coverage profile to a file. You will need the name of the file (e.g. "coverage.txt")
      # in the next step as well as the next job.
      - name: Test
        run: go test -race -cover -coverprofile=coverage.txt -count=1 -timeout 20m ./...

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: code-coverage
          path: coverage.txt # Make sure to use the same file name you chose for the "-coverprofile" in the "Test" step

  goroutine_context_guard:
    name: Goroutine *gin.Context guardrail
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install ast-grep
        # Pinned prebuilt binary (no npm — project policy uses yarn for the frontend and
        # avoids npm). Checksum-verified for reproducibility; the zip ships both ast-grep
        # and its `sg` alias. Bump ASG_VERSION + ASG_SHA256 together when upgrading.
        env:
          ASG_VERSION: 0.43.0
          ASG_SHA256: a26253a9c821d935f7e383e40f0de7c2ca62a4121de1f73a6d81ec32eae631e0
        run: |
          set -euo pipefail
          curl -fsSL -o ast-grep.zip \
            "https://github.com/ast-grep/ast-grep/releases/download/${ASG_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          echo "${ASG_SHA256}  ast-grep.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -o ast-grep.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/ast-grep" "$HOME/.local/bin/sg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify ast-grep version
        run: ast-grep --version

      - name: Verify guardrail rule tests
        run: ast-grep test --skip-snapshot-tests

      - name: Scan for goroutines referencing the request *gin.Context
        run: ast-grep scan

  entity_response_guard:
    name: Boundary entity-response guardrail
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # Type-aware analyzer that forbids serializing raw management-API entities
      # (model.User/Token/Channel/Redemption/Log) at the HTTP boundary. See
      # tools/analyzers/noentityresponse and
      # docs/proposals/20260714_boundary-response-dtos.md (gate E3).
      - name: Run noentityresponse analyzer
        run: go run ./tools/analyzers/noentityresponse/cmd/noentityresponse ./...

  modern_frontend_tests:
    name: Frontend tests (modern)
    needs: changes
    if: needs.changes.outputs.modern == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: web/modern/yarn.lock

      - name: Install dependencies
        working-directory: web/modern
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive

      - name: Run tests
        working-directory: web/modern
        env:
          CI: true
        run: yarn test --run --passWithNoTests

  air_frontend_tests:
    name: Frontend tests (air)
    needs: changes
    if: needs.changes.outputs.air == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: web/air/yarn.lock

      - name: Install dependencies
        working-directory: web/air
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive

      - name: Run tests
        working-directory: web/air
        env:
          CI: true
        run: yarn test --watchAll=false --passWithNoTests

  berry_frontend_tests:
    name: Frontend tests (berry)
    needs: changes
    if: needs.changes.outputs.berry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: web/berry/yarn.lock

      - name: Install dependencies
        working-directory: web/berry
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive

      - name: Run tests
        working-directory: web/berry
        env:
          CI: true
        run: yarn test --watchAll=false --passWithNoTests

  code_coverage:
    name: 'Code coverage report'
    # The report job only needs read access to repository contents and write
    # access to the pull request comment it creates. Test jobs retain read-only
    # permissions and never receive this write-capable token.
    permissions:
      contents: read
      pull-requests: write
    # Do not run when workflow is triggered by push to main branch.
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    needs: [changes, go_tests] # Depends on the artifact uploaded by the "go_tests" job
    timeout-minutes: 15
    steps:
      # Pinned to a full commit SHA (v1.3.1) for supply-chain security: a mutable
      # tag could be force-pushed and change what CI runs.
      - uses: fgrosse/go-coverage-report@ae818fbdd0dd79fe6ddc82e1eb0db466bfb0eddd
        with:
          coverage-artifact-name: 'code-coverage' # can be omitted if you used this default value
          coverage-file-name: 'coverage.txt' # can be omitted if you used this default value


