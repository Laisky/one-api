# Keep the filename for existing badges and workflow links. This is the only PR CI entrypoint.
name: CI

on:
  push:
    branches: [master, main, test/ci]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      qualification:
        description: Run the complete race/database and frontend/browser qualification
        type: boolean
        default: false
      historical_control:
        description: Replay the historical Realtime bug (current-code regressions always run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # paths-filter uses the PR files API, including for forks.
    outputs:
      modern: ${{ steps.filter.outputs.modern }}
      air: ${{ steps.filter.outputs.air }}
      berry: ${{ steps.filter.outputs.berry }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflow contracts and test orchestration
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python3 .github/scripts/test_workflows.py
          python3 .github/scripts/test_frontend_contracts.py
          python3 .github/scripts/test_go_test_shards.py
          python3 .github/scripts/test_quick_tests.py
          python3 .github/scripts/test_format_check.py
      - name: Detect changed frontend paths
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # Use the previous commit on the same branch for push events.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            modern:
              - 'web/modern/**'
              - '.github/**'
              - 'Makefile'
              - 'Dockerfile'
              - '.dockerignore'
              - 'VERSION'
            air:
              - 'web/air/**'
              - 'web/legacy/**'
              - '.github/**'
              - 'Makefile'
              - 'Dockerfile'
              - '.dockerignore'
              - 'VERSION'
            berry:
              - 'web/berry/**'
              - 'web/legacy/**'
              - '.github/**'
              - 'Makefile'
              - 'Dockerfile'
              - '.dockerignore'
              - 'VERSION'

  # The normal test gate is intentionally small. Full qualification remains manual.
  quick_tests:
    name: Formatting and essential unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require Go formatting and execute essential unit tests
        run: |
          python3 .github/scripts/format_check.py
          python3 .github/scripts/quick_tests.py --output "$RUNNER_TEMP/quick-tests"
      - name: Archive selected inventory and actual test outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quick-tests-${{ github.sha }}
          path: ${{ runner.temp }}/quick-tests
          if-no-files-found: warn
          retention-days: 14

  # During manual qualification every package and top-level model test runs exactly once. Separate runners
  # isolate model's mutable globals, databases, fixed ports and pinned-binary caches.
  # Do not add t.Parallel() to tests that mutate shared application configuration.
  go_test_shards:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification
    name: Go tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [packages, model-0, model-1, model-2, model-3]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oneapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=20s
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oneapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d oneapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=10s
    env:
      MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi?sslmode=disable
      MYSQL_LOG_DSN: root:root@tcp(127.0.0.1:3306)/oneapi_log?charset=utf8mb4&parseTime=True&loc=Local
      PG_LOG_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi_log?sslmode=disable
      COMPACT_UUID_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi?charset=utf8mb4&parseTime=True&loc=Local
      COMPACT_UUID_TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi?sslmode=disable
      COMPACT_UUID_TEST_LOG_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/oneapi_log?charset=utf8mb4&parseTime=True&loc=Local
      COMPACT_UUID_TEST_LOG_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi_log?sslmode=disable
      COMPACT_UUID_TEST_POSTGRES_BASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/oneapi_workload_base?sslmode=disable
      ONEAPI_REQUIRE_DB_BACKENDS: '1'
      ONEAPI_REQUIRE_COMPACT_UUID_SUITE: '1'
      CGO_ENABLED: '1'
    steps:
      - name: Checkout repository and historical compatibility fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checkout does not retain authentication
        run: |
          python3 - <<'PYTHON'
          import subprocess
          keys = subprocess.check_output(
              ["git", "config", "--local", "--name-only", "--list"], text=True
          ).lower().splitlines()
          if any(key.endswith(".extraheader") or key == "core.sshcommand" or
                 key.startswith("credential.") or
                 (key.startswith("includeif.") and key.endswith(".path")) for key in keys):
              raise SystemExit("Checkout retained authentication configuration.")
          PYTHON
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify orchestration against the real Go toolchain
        if: matrix.shard == 'packages'
        run: python3 .github/scripts/test_go_test_shards_integration.py
      - name: Install test dependencies and create secondary databases
        env:
          MYSQL_PWD: root
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg mysql-client postgresql-client
          mysql -h 127.0.0.1 -P 3306 -uroot \
            -e "CREATE DATABASE IF NOT EXISTS oneapi_log CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"
          for db in oneapi_log oneapi_workload_base; do
            psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -tAc \
              "SELECT 1 FROM pg_database WHERE datname = '${db}'" | grep -q 1 \
              || psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -c "CREATE DATABASE ${db};"
          done
      - name: Run assigned Go tests with race detection and coverage
        env:
          GO_TEST_SHARD: ${{ matrix.shard }}
        run: |
          python3 .github/scripts/go_test_shards.py run \
            --shard "$GO_TEST_SHARD" --output "$RUNNER_TEMP/go-tests"
      - name: Archive complete shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-tests-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/go-tests
          retention-days: 14

  # Manual qualification still requires complete, atomic coverage from every shard.
  # Never publish partial coverage or let a failed/cancelled matrix look successful.
  go_tests:
    name: Go test completeness and coverage
    if: always() && github.event_name == 'workflow_dispatch' && inputs.qualification
    needs: go_test_shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every Go test shard to pass
        env:
          SHARD_RESULT: ${{ needs.go_test_shards.result }}
        run: test "$SHARD_RESULT" = success
      - name: Checkout validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all shard evidence from this run
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: go-tests-*-${{ github.sha }}
          path: go-test-results
      - name: Verify completeness and merge atomic coverage
        run: |
          python3 .github/scripts/go_test_shards.py merge \
            --input go-test-results --output coverage.txt
      - name: Archive code coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage
          path: coverage.txt
          if-no-files-found: error

  goroutine_context_guard:
    name: Goroutine *gin.Context guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ast-grep
        env:
          ASG_VERSION: 0.43.0
          ASG_SHA256: a26253a9c821d935f7e383e40f0de7c2ca62a4121de1f73a6d81ec32eae631e0
        run: |
          set -euo pipefail
          curl -fsSL -o ast-grep.zip \
            "https://github.com/ast-grep/ast-grep/releases/download/${ASG_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          echo "${ASG_SHA256}  ast-grep.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -o ast-grep.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/ast-grep" "$HOME/.local/bin/sg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify guardrail rules and scan request context use
        run: |
          ast-grep --version
          ast-grep test --skip-snapshot-tests
          ast-grep scan

  entity_response_guard:
    name: Go static guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Run go vet once for the complete repository
        run: go vet ./...
      - name: Run noentityresponse analyzer
        run: go run ./tools/analyzers/noentityresponse/cmd/noentityresponse ./...
      - name: Check realtime sentinel error convention
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --no-config --enable-only err113 --timeout=5m ./relay/realtime

  vulnerability_scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  modern_dependency_audit:
    name: Dependency audit (modern)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.modern == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock
      - name: Install dependencies
        working-directory: web/modern
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
      - name: Audit every dependency including development tools
        run: |
          node --test .github/scripts/frontend-audit.test.mjs
          node .github/scripts/frontend-audit.mjs modern
      - name: Archive complete dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-modern
          path: ${{ runner.temp }}/modern-audit.jsonl
          if-no-files-found: ignore
          retention-days: 7

  modern_frontend_tests:
    name: Frontend tests (modern)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock
      - name: Install dependencies
        working-directory: web/modern
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
      - name: Run tests
        working-directory: web/modern
        env:
          CI: true
        run: yarn test --run
      - name: Build Modern frontend
        working-directory: web/modern
        run: yarn build
      - name: Check Modern translations
        working-directory: web/modern
        run: yarn check:i18n
      - name: Install pinned browser test tools
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify real-page mobile lists and contextual toolbars
        working-directory: web/modern
        run: |
          python3 scripts/test-mobile-list-browser.py
          python3 scripts/test-table-toolbar-browser.py
      - name: Archive mobile browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-list-browser-evidence
          path: |
            web/modern/test-results/mobile-list
            web/modern/test-results/table-toolbar
          if-no-files-found: ignore
          retention-days: 7


  air_dependency_audit:
    name: Dependency audit (air)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.air == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/air/yarn.lock
      - name: Install dependencies
        working-directory: web/air
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
      - name: Audit every dependency including development tools
        run: |
          node --test .github/scripts/frontend-audit.test.mjs
          node .github/scripts/frontend-audit.mjs air
      - name: Archive complete dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-air
          path: ${{ runner.temp }}/air-audit.jsonl
          if-no-files-found: ignore
          retention-days: 7

  air_frontend_tests:
    name: Frontend tests (air)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/air/yarn.lock
      - name: Install dependencies
        working-directory: web/air
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
      - name: Run tests
        working-directory: web/air
        env:
          CI: true
        run: yarn test

      - name: Build legacy production frontend
        working-directory: web/air
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn build
      - name: Install pinned browser test tools
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify production and development request recovery
        run: python3 .github/scripts/legacy-browser.py air
      - name: Archive legacy browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-browser-air
          path: ${{ runner.temp }}/legacy-browser-air
          if-no-files-found: ignore
          retention-days: 7


  berry_dependency_audit:
    name: Dependency audit (berry)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.berry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/berry/yarn.lock
      - name: Install dependencies
        working-directory: web/berry
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
      - name: Audit every dependency including development tools
        run: |
          node --test .github/scripts/frontend-audit.test.mjs
          node .github/scripts/frontend-audit.mjs berry
      - name: Archive complete dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-audit-berry
          path: ${{ runner.temp }}/berry-audit.jsonl
          if-no-files-found: ignore
          retention-days: 7

  berry_frontend_tests:
    name: Frontend tests (berry)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: web/berry/yarn.lock
      - name: Install dependencies
        working-directory: web/berry
        run: yarn install --frozen-lockfile --network-timeout 600000 --non-interactive
      - name: Run tests
        working-directory: web/berry
        env:
          CI: true
        run: yarn test

      - name: Build legacy production frontend
        working-directory: web/berry
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn build
      - name: Install pinned browser test tools
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify production and development request recovery
        run: python3 .github/scripts/legacy-browser.py berry
      - name: Archive legacy browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: legacy-browser-berry
          path: ${{ runner.temp }}/legacy-browser-berry
          if-no-files-found: ignore
          retention-days: 7


  historical_control:
    name: Historical Realtime negative control (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.historical_control
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current regression test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Checkout reviewed baseline for the negative control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6138a94f9749312a9c31c7c2ebdcbea758b04235
          path: .realtime-baseline
          persist-credentials: false
      - name: Verify index regression detects the original bug
        run: |
          cp relay/realtime/identity_review_test.go .realtime-baseline/relay/realtime/identity_review_test.go
          set +e
          (cd .realtime-baseline && go test -race -count=1 -timeout=2m -v -run '^TestReviewTranscriptionIndexPresence$' ./relay/realtime) > "$RUNNER_TEMP/realtime-index-baseline.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/realtime-index-baseline.log"
          if [ "$status" -ne 1 ] || ! grep -F -- '--- FAIL: TestReviewTranscriptionIndexPresence' "$RUNNER_TEMP/realtime-index-baseline.log" >/dev/null; then
            echo '::error::The historical control did not reproduce the intended assertion failure.'
            exit 1
          fi
      - name: Archive historical control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realtime-historical-control-${{ github.sha }}
          path: ${{ runner.temp }}/realtime-index-baseline.log
          retention-days: 14

  required:
    name: CI required
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - quick_tests
      - go_tests
      - goroutine_context_guard
      - entity_response_guard
      - vulnerability_scan
      - modern_dependency_audit
      - air_dependency_audit
      - berry_dependency_audit
      - modern_frontend_tests
      - air_frontend_tests
      - berry_frontend_tests
      - historical_control
    steps:
      - name: Require all applicable checks to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          HISTORICAL_CONTROL: ${{ github.event_name == 'workflow_dispatch' && inputs.historical_control }}
          QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ['NEEDS'])
          required = {'changes', 'quick_tests', 'goroutine_context_guard',
                      'entity_response_guard', 'vulnerability_scan'}
          outputs = jobs['changes'].get('outputs', {})
          manual = os.environ['MANUAL_RUN'] == 'true'
          for theme in ('modern', 'air', 'berry'):
              changed = outputs.get(theme)
              if not manual and changed not in ('true', 'false'):
                  raise SystemExit(f'Missing or invalid change detection for {theme}')
              if manual or changed == 'true':
                  required.add(f'{theme}_dependency_audit')
          if os.environ['QUALIFICATION'] == 'true':
              required.add('go_tests')
              required.update(f'{theme}_frontend_tests' for theme in ('modern', 'air', 'berry'))
          if os.environ['HISTORICAL_CONTROL'] == 'true':
              required.add('historical_control')
          failed = [name for name, job in jobs.items()
                    if job['result'] not in ({'success'} if name in required
                                            else {'success', 'skipped'})]
          failed.extend(sorted(required - jobs.keys()))
          if failed:
              raise SystemExit('Required checks did not pass: ' + ', '.join(failed))
          print('All applicable CI checks passed.')
          PY
