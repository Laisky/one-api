name: Finalize PR 387 production MCP paths

on:
  push:
    branches:
      - feat/mcp-2026-07-28-protocol
    paths:
      - .github/workflows/pr387-finalize-5.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr387-finalize-production
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcp-2026-07-28-protocol
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Complete production MCP implementation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')

          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              (root / path).write_text(value, encoding='utf-8')

          def function_bounds(source: str, name: str) -> tuple[int, int]:
              match = re.search(rf'func\s+(?:\([^)]*\)\s*)?{re.escape(name)}\s*\(', source)
              if match is None:
                  raise RuntimeError(f'function {name} not found')
              brace = source.find('{', match.start())
              if brace < 0:
                  raise RuntimeError(f'function {name} has no body')
              depth = 0
              in_double = False
              in_raw = False
              escaped = False
              index = brace
              while index < len(source):
                  character = source[index]
                  if in_double:
                      if escaped:
                          escaped = False
                      elif character == '\\':
                          escaped = True
                      elif character == '"':
                          in_double = False
                  elif in_raw:
                      if character == '`':
                          in_raw = False
                  elif character == '"':
                      in_double = True
                  elif character == '`':
                      in_raw = True
                  elif character == '{':
                      depth += 1
                  elif character == '}':
                      depth -= 1
                      if depth == 0:
                          return match.start(), index + 1
                  index += 1
              raise RuntimeError(f'function {name} has an unterminated body')

          def replace_function(source: str, name: str, replacement: str) -> str:
              start, end = function_bounds(source, name)
              return source[:start] + replacement.rstrip() + source[end:]

          def replace_inside_function(source: str, name: str, old: str, new: str, required: bool = True) -> str:
              start, end = function_bounds(source, name)
              block = source[start:end]
              if old not in block:
                  if required and new not in block:
                      raise RuntimeError(f'{old!r} not found in {name}')
                  return source
              block = block.replace(old, new)
              return source[:start] + block + source[end:]

          for temporary in (
              '.github/workflows/pr387-source-snapshot.yml',
              '.github/workflows/pr387-complete.yml',
              '.github/workflows/pr387-finalize.yml',
              '.github/workflows/pr387-finalize-2.yml',
              '.github/workflows/pr387-finalize-3.yml',
              '.github/workflows/pr387-final-gate.yml',
          ):
              path = root / temporary
              if path.exists():
                  path.unlink()

          protocol_path = root / 'relay/mcp/protocol.go'
          protocol = read(str(protocol_path))
          protocol = protocol.replace('make(map[string]any, len(params)+1)', 'make(map[string]any)')
          if 'LegacyProtocolVersionCompat' not in protocol:
              protocol = protocol.replace(
                  '\tLegacyProtocolVersionFallback = "2025-06-18"',
                  '\tLegacyProtocolVersionFallback = "2025-06-18"\n\t// LegacyProtocolVersionCompat retains compatibility with the first Streamable HTTP revision.\n\tLegacyProtocolVersionCompat = "2025-03-26"',
              )
              protocol = protocol.replace(
                  'return []string{ProtocolVersion, LegacyProtocolVersion, LegacyProtocolVersionFallback}',
                  'return []string{ProtocolVersion, LegacyProtocolVersion, LegacyProtocolVersionFallback, LegacyProtocolVersionCompat}',
              )
              protocol = protocol.replace(
                  'case LegacyProtocolVersion, LegacyProtocolVersionFallback:',
                  'case LegacyProtocolVersion, LegacyProtocolVersionFallback, LegacyProtocolVersionCompat:',
              )
          write(str(protocol_path), protocol)

          security_path = root / 'relay/mcp/security.go'
          security_path.write_text(r'''package mcp

          import (
          	"net"
          	"net/http"
          	"net/url"
          	"strings"
          	"time"

          	"github.com/Laisky/errors/v2"
          )

          // hasSensitiveMCPHeaders reports whether configured outbound headers contain reusable secrets.
          //
          // Parameters:
          //   - headers: configured outbound MCP headers.
          //
          // Return values:
          //   - bool: true when a non-empty header name indicates credentials or session secrets.
          func hasSensitiveMCPHeaders(headers map[string]string) bool {
          	for key, value := range headers {
          		if strings.TrimSpace(value) == "" {
          			continue
          		}
          		normalized := strings.ToLower(strings.TrimSpace(key))
          		for _, token := range []string{"authorization", "api-key", "apikey", "token", "secret", "password", "cookie"} {
          			if strings.Contains(normalized, token) {
          				return true
          			}
          		}
          	}
          	return false
          }

          // isLoopbackMCPHost reports whether a URL host is local to the current machine.
          //
          // Parameters:
          //   - hostname: a URL hostname without a port.
          //
          // Return values:
          //   - bool: true for localhost or a loopback IP address.
          func isLoopbackMCPHost(hostname string) bool {
          	hostname = strings.TrimSpace(strings.ToLower(hostname))
          	if hostname == "localhost" {
          		return true
          	}
          	address := net.ParseIP(hostname)
          	return address != nil && address.IsLoopback()
          }

          // validateMCPTransportSecurity rejects network plaintext whenever reusable credentials are configured.
          //
          // Parameters:
          //   - baseURL: configured MCP endpoint URL.
          //   - sensitive: whether requests carry reusable credentials.
          //
          // Return values:
          //   - error: a wrapped URL or plaintext-credential validation error.
          func validateMCPTransportSecurity(baseURL string, sensitive bool) error {
          	parsed, err := url.Parse(strings.TrimSpace(baseURL))
          	if err != nil {
          		return errors.Wrap(err, "parse mcp endpoint URL")
          	}
          	if parsed.Scheme != "http" && parsed.Scheme != "https" {
          		return errors.Errorf("unsupported MCP endpoint scheme %q", parsed.Scheme)
          	}
          	if parsed.Host == "" {
          		return errors.New("mcp endpoint host is required")
          	}
          	if sensitive && parsed.Scheme != "https" && !isLoopbackMCPHost(parsed.Hostname()) {
          		return errors.New("credentialed MCP endpoints require HTTPS")
          	}
          	return nil
          }

          // newMCPHTTPClient creates a bounded client that prevents credential redirects to plaintext or another origin.
          //
          // Parameters:
          //   - timeout: total request timeout.
          //   - baseURL: configured MCP endpoint URL.
          //   - sensitive: whether configured headers contain reusable credentials.
          //
          // Return values:
          //   - *http.Client: a client with a strict redirect policy.
          //   - error: a wrapped endpoint validation error.
          func newMCPHTTPClient(timeout time.Duration, baseURL string, sensitive bool) (*http.Client, error) {
          	if err := validateMCPTransportSecurity(baseURL, sensitive); err != nil {
          		return nil, errors.Wrap(err, "validate mcp transport security")
          	}
          	origin, err := url.Parse(strings.TrimSpace(baseURL))
          	if err != nil {
          		return nil, errors.Wrap(err, "parse mcp redirect origin")
          	}
          	client := &http.Client{Timeout: timeout}
          	client.CheckRedirect = func(request *http.Request, via []*http.Request) error {
          		if len(via) >= 10 {
          			return errors.New("mcp redirect limit exceeded")
          		}
          		if len(via) == 0 {
          			return nil
          		}
          		previous := via[len(via)-1].URL
          		if previous.Scheme == "https" && request.URL.Scheme != "https" {
          			return errors.New("mcp redirect from HTTPS to plaintext HTTP is forbidden")
          		}
          		if sensitive {
          			if request.URL.Scheme != "https" && !isLoopbackMCPHost(request.URL.Hostname()) {
          				return errors.New("credentialed MCP redirect requires HTTPS")
          			}
          			if !strings.EqualFold(request.URL.Host, origin.Host) {
          				return errors.New("credentialed MCP redirect to another origin is forbidden")
          			}
          		}
          		return nil
          	}
          	return client, nil
          }
          ''', encoding='utf-8')

          state_path = root / 'relay/mcp/client_state.go'
          state_path.write_text(r'''package mcp

          // snapshotHeaders returns an independent copy of configured and negotiated request headers.
          //
          // Parameters: none.
          //
          // Return values:
          //   - map[string]string: a copy safe for one outbound request to iterate and modify.
          func (c *StreamableHTTPClient) snapshotHeaders() map[string]string {
          	if c == nil {
          		return nil
          	}
          	c.headersMu.RLock()
          	defer c.headersMu.RUnlock()
          	headers := make(map[string]string, len(c.Headers))
          	for key, value := range c.Headers {
          		headers[key] = value
          	}
          	return headers
          }

          // setNegotiatedHeader updates one protocol header while excluding concurrent request snapshots.
          //
          // Parameters:
          //   - key: the HTTP header name.
          //   - value: the negotiated value, or an empty string to remove the header.
          //
          // Return values: none; the client header state is updated in place.
          func (c *StreamableHTTPClient) setNegotiatedHeader(key, value string) {
          	if c == nil {
          		return
          	}
          	c.headersMu.Lock()
          	defer c.headersMu.Unlock()
          	if value == "" {
          		delete(c.Headers, key)
          		return
          	}
          	c.Headers[key] = value
          }
          ''', encoding='utf-8')

          client_path = root / 'relay/mcp/client.go'
          client = read(str(client_path))
          if 'headersMu sync.RWMutex' not in client:
              client = client.replace('\tinitMu          sync.Mutex\n', '\theadersMu       sync.RWMutex\n\tinitMu          sync.Mutex\n')
          if 'sensitiveTransport bool' not in client:
              client = client.replace('\tprotocolVersion string\n}', '\tprotocolVersion string\n\tsensitiveTransport bool\n}')
          client = re.sub(
              r'\n\tif _, ok := merged\[mcpProtocolVersionHeader\]; !ok \{\n\t\tmerged\[mcpProtocolVersionHeader\] = mcpDefaultProtocolVersion\n\t\}\n',
              '\n',
              client,
          )
          client = client.replace('mcpDefaultProtocolVersion = "2025-06-18"', 'mcpDefaultProtocolVersion = LegacyProtocolVersion')
          if 'sensitiveTransport: hasSensitiveMCPHeaders(merged)' not in client:
              client = client.replace('\t\tserverRef: server.Ref(),\n\t}', '\t\tserverRef: server.Ref(),\n\t\tsensitiveTransport: hasSensitiveMCPHeaders(merged),\n\t}')

          initialize = r'''func (c *StreamableHTTPClient) Initialize(ctx context.Context) error {
          	if c == nil {
          		return errors.New("mcp client is nil")
          	}
          	c.initMu.Lock()
          	defer c.initMu.Unlock()
          	if c.initialized {
          		return nil
          	}
          	var lastErr error
          	for _, requestedVersion := range []string{LegacyProtocolVersion, LegacyProtocolVersionFallback, LegacyProtocolVersionCompat} {
          		initParams := map[string]any{
          			"protocolVersion": requestedVersion,
          			"capabilities":    map[string]any{},
          			"clientInfo": map[string]any{"name": mcpClientName, "version": mcpClientVersion},
          		}
          		var initResult struct {
          			ProtocolVersion string         `json:"protocolVersion"`
          			Capabilities    map[string]any `json:"capabilities"`
          			ServerInfo      map[string]any `json:"serverInfo"`
          		}
          		responseHeaders, err := c.doRPCRaw(ctx, "initialize", initParams, &initResult)
          		if err != nil {
          			lastErr = errors.Wrapf(err, "initialize legacy MCP version %s", requestedVersion)
          			continue
          		}
          		negotiatedVersion := strings.TrimSpace(initResult.ProtocolVersion)
          		if negotiatedVersion == "" {
          			negotiatedVersion = requestedVersion
          		}
          		if !IsLegacyProtocolVersion(negotiatedVersion) {
          			lastErr = errors.Errorf("legacy MCP server negotiated unsupported version %q", negotiatedVersion)
          			continue
          		}
          		c.protocolVersion = negotiatedVersion
          		c.setNegotiatedHeader(mcpProtocolVersionHeader, negotiatedVersion)
          		if sessionID := strings.TrimSpace(responseHeaders.Get(mcpSessionIDHeader)); sessionID != "" {
          			c.sessionID = sessionID
          			c.setNegotiatedHeader(mcpSessionIDHeader, sessionID)
          		}
          		if err := c.sendNotification(ctx, "notifications/initialized", nil); err != nil && c.Logger != nil {
          			c.Logger.Warn("mcp notifications/initialized failed", append(c.serverRef.Zap(), zap.Error(err))...)
          		}
          		c.initialized = true
          		return nil
          	}
          	if lastErr == nil {
          		lastErr = errors.New("no legacy MCP protocol versions were attempted")
          	}
          	return errors.Wrap(lastErr, "mcp initialize")
          }'''
          client = replace_function(client, 'Initialize', initialize)
          client = client.replace('for key, value := range c.Headers {', 'for key, value := range c.snapshotHeaders() {')
          client = replace_inside_function(
              client,
              'doRPCRaw',
              'for key, value := range c.snapshotHeaders() {\n\t\treq.Header.Set(key, value)\n\t}',
              'for key, value := range c.snapshotHeaders() {\n\t\tif method == "initialize" && (strings.EqualFold(key, mcpProtocolVersionHeader) || strings.EqualFold(key, mcpSessionIDHeader)) {\n\t\t\tcontinue\n\t\t}\n\t\treq.Header.Set(key, value)\n\t}',
              required=False,
          )
          client = replace_inside_function(
              client,
              'doRPCRaw',
              'client := &http.Client{Timeout: c.Timeout}',
              'client, err := newMCPHTTPClient(c.Timeout, c.BaseURL, c.sensitiveTransport)\n\tif err != nil {\n\t\treturn nil, errors.Wrap(err, "create mcp HTTP client")\n\t}',
              required=False,
          )
          client = replace_inside_function(
              client,
              'sendNotification',
              'client := &http.Client{Timeout: c.Timeout}',
              'client, err := newMCPHTTPClient(c.Timeout, c.BaseURL, c.sensitiveTransport)\n\tif err != nil {\n\t\treturn errors.Wrap(err, "create mcp notification HTTP client")\n\t}',
              required=False,
          )
          client = client.replace('body, readErr := io.ReadAll(resp.Body)', 'body, readErr := readMCPResponseBody(resp.Body)')
          client = replace_inside_function(
              client,
              'sendNotification',
              'body, _ := io.ReadAll(resp.Body)',
              'body, readErr := readMCPResponseBody(resp.Body)\n\tif readErr != nil {\n\t\treturn errors.Wrap(readErr, "read mcp notification response body")\n\t}',
              required=False,
          )
          if 'io.' not in client.split('import', 1)[-1].split(')', 1)[-1]:
              client = client.replace('\t"io"\n', '')
          write(str(client_path), client)

          latest_path = root / 'relay/mcp/client_latest.go'
          latest = read(str(latest_path))
          latest = latest.replace('"arguments": arguments,', '"arguments": argumentMap,')
          latest = latest.replace('for key, value := range c.Headers {', 'for key, value := range c.snapshotHeaders() {')
          latest = replace_inside_function(
              latest,
              'doModernRPC',
              'client := &http.Client{Timeout: c.Timeout}',
              'client, err := newMCPHTTPClient(c.Timeout, c.BaseURL, c.sensitiveTransport)\n\tif err != nil {\n\t\treturn errors.Wrap(err, "create modern mcp HTTP client")\n\t}',
              required=False,
          )
          latest = latest.replace('req.Header.Add(key, value)', 'req.Header.Set(key, value)')
          if 'io.' not in latest.split('import', 1)[-1].split(')', 1)[-1]:
              latest = latest.replace('\t"io"\n', '')
          write(str(latest_path), latest)

          for test_path in ('controller/mcp_proxy_latest_test.go', 'controller/mcp_proxy_test.go'):
              path = root / test_path
              if path.exists():
                  write(test_path, read(test_path).replace('mcpProtocolVersion', 'mcp.LegacyProtocolVersionFallback'))

          docs_path = root / 'docs/manuals/mcp_protocol_2026_07_28.md'
          if docs_path.exists():
              docs = read(str(docs_path)).replace('params._meta["io.modelcontextprotocol/serverInfo"]', 'result._meta["io.modelcontextprotocol/serverInfo"]')
              write(str(docs_path), docs)

          # Ensure the security behavior is tested through the production client path.
          test_path = root / 'relay/mcp/security_test.go'
          tests = read(str(test_path)) if test_path.exists() else 'package mcp\n\nimport (\n\t"testing"\n\n\t"github.com/stretchr/testify/require"\n)\n'
          if 'TestCredentialedMCPClientRejectsNetworkPlaintext' not in tests:
              if '"context"' not in tests:
                  tests = tests.replace('import (\n', 'import (\n\t"context"\n')
              if '"time"' not in tests:
                  tests = tests.replace('import (\n', 'import (\n\t"time"\n')
              if '"github.com/Laisky/one-api/model"' not in tests:
                  tests = tests.replace('\t"github.com/stretchr/testify/require"\n', '\t"github.com/stretchr/testify/require"\n\n\t"github.com/Laisky/one-api/model"\n')
              tests += r'''

          // TestCredentialedMCPClientRejectsNetworkPlaintext verifies the production modern request path enforces HTTPS.
          //
          // Parameters:
          //   - t: the active test context.
          //
          // Return values: none; failures are reported through assertions.
          func TestCredentialedMCPClientRejectsNetworkPlaintext(t *testing.T) {
          	client := NewStreamableHTTPClient(&model.MCPServer{
          		BaseURL: "http://mcp.example/rpc",
          		AuthType: model.MCPAuthTypeBearer,
          		APIKey: "secret",
          	}, nil, time.Second)
          	_, err := client.ListToolsLatest(context.Background())
          	require.ErrorContains(t, err, "require HTTPS")
          }
          '''
          write(str(test_path), tests)
          PY

          gofmt -w relay/mcp/*.go controller/mcp_*go model/mcp_*go

      - name: Reject incomplete production patterns
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --include='*.go' -- '"arguments": arguments' relay/mcp
          ! grep -RIn --include='*.go' -- 'req.Header.Add(key, value)' relay/mcp
          ! grep -RIn --include='*.go' -- 'client := &http.Client{Timeout: c.Timeout}' relay/mcp
          ! grep -RIn --include='*.go' -- 'strings.ToLower(t.Name)' model
          ! grep -RIn --include='*.go' -- 'make(map\[string\]any, len(params)+1)' relay/mcp
          grep -q 'newMCPHTTPClient' relay/mcp/client.go
          grep -q 'newMCPHTTPClient' relay/mcp/client_latest.go
          grep -q 'snapshotHeaders' relay/mcp/client.go
          grep -q 'snapshotHeaders' relay/mcp/client_latest.go
          grep -q 'LegacyProtocolVersionCompat' relay/mcp/protocol.go

      - name: Verify focused behavior
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          go test -count=1 ./relay/mcp ./model ./controller

      - name: Run boundary response guardrail
        run: go run ./tools/analyzers/noentityresponse/cmd/noentityresponse ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run race-enabled full test suite
        run: go test -race ./...

      - name: Build Modern frontend
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          make build-frontend-modern

      - name: Commit verified production tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr387-source-snapshot.yml \
            .github/workflows/pr387-complete.yml \
            .github/workflows/pr387-finalize.yml \
            .github/workflows/pr387-finalize-2.yml \
            .github/workflows/pr387-finalize-3.yml \
            .github/workflows/pr387-final-gate.yml \
            .github/workflows/pr387-finalize-5.yml
          git config user.name "Laisky.Cai"
          git config user.email "github@laisky.com"
          git add -A
          git commit -m "fix(mcp): finalize production client and compatibility paths"
          git push origin HEAD:feat/mcp-2026-07-28-protocol
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record completion on PR 387
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/387/comments" \
            -f body="<!-- pr387-mcp-production-finalized -->
          Production MCP client/server completion was verified and pushed as \`${FINAL_SHA}\`.

          GitHub-hosted validation passed:
          - focused MCP/model/controller behavior tests
          - boundary entity-response analyzer
          - \`go vet ./...\`
          - \`go test -race ./...\`
          - \`make build-frontend-modern\`

          Temporary acceptance workflows were removed from the committed tree."
