# Temporary isolated reproduction for issue #596; remove before marking the PR ready.
name: Temporary #596 WebSocket security qualification
on:
  push:
    branches:
      - fix/ws-continuation-funding-596-20261024

permissions:
  contents: read

jobs:
  ws_continuation_security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout proposed fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Reproduce owned continuation funding behavior under race detector
        run: go test -race -count=1 -timeout=15m -run '^TestSecurityNativeResponseWebSocketKnownContinuationAdmission$' ./relay/controller/
