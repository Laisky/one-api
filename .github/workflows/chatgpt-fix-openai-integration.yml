name: ChatGPT OpenAI integration fix

on:
  push:
    branches:
      - chore/update-openai-models-2026-09
    paths:
      - .github/workflows/chatgpt-fix-openai-integration.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: chore/update-openai-models-2026-09
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Integrate catalog changes with current OpenAI helpers
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:relay/adaptor/openai/adaptor_model_helpers.go > relay/adaptor/openai/adaptor_model_helpers.go

          python <<'PY'
          from pathlib import Path

          path = Path("relay/adaptor/openai/adaptor_model_helpers.go")
          content = path.read_text()

          def replace_between(start_marker: str, end_marker: str, replacement: str) -> None:
              global content
              start = content.index(start_marker)
              end = content.index(end_marker, start)
              content = content[:start] + replacement.rstrip() + "\n\n" + content[end:]

          replace_between(
              "func isModelSupportedReasoning",
              "// isWebSearchModel",
              r'''func isModelSupportedReasoning(modelName string) bool {
              lower := normalizedModelName(modelName)
              if lower == "" {
                  return false
              }

              // Preserve the existing explicit exclusion before consulting catalog metadata.
              if strings.HasPrefix(lower, "gpt-5-chat-latest") || lower == "gpt-5-chat" {
                  return false
              }

              // Catalog metadata handles aliases whose names do not carry a GPT/o-series prefix,
              // such as the separately provisioned Daybreak models.
              if cfg, ok := ModelRatios[lower]; ok {
                  for _, feature := range cfg.SupportedFeatures {
                      if strings.EqualFold(feature, "reasoning") {
                          return true
                      }
                  }
                  if len(cfg.SupportedReasoningEfforts) > 0 || cfg.DefaultReasoningEffort != "" {
                      return true
                  }
              }

              if strings.HasPrefix(lower, "o") {
                  return true
              }

              if version, ok := extractGptVersion(lower); ok && version >= 5 {
                  return true
              }

              return false
          }''',
          )

          replace_between(
              "func isMediumOnlyReasoningModel",
              "// defaultReasoningEffortForModel",
              r'''func isMediumOnlyReasoningModel(modelName string) bool {
              lower := normalizedModelName(modelName)
              if lower == "" {
                  return false
              }

              if cfg, ok := ModelRatios[lower]; ok && len(cfg.SupportedReasoningEfforts) > 0 {
                  if len(cfg.SupportedReasoningEfforts) != 1 {
                      return false
                  }
                  return strings.EqualFold(cfg.SupportedReasoningEfforts[0], "medium")
              }

              if strings.HasPrefix(lower, "o") {
                  return true
              }

              if version, ok := extractGptVersion(lower); ok && version >= 5 {
                  if strings.Contains(lower, "-chat") {
                      return true
                  }
              }

              return false
          }''',
          )

          replace_between(
              "func defaultReasoningEffortForModel",
              "// isReasoningEffortAllowedForModel",
              r'''func defaultReasoningEffortForModel(modelName string) string {
              if cfg, ok := ModelRatios[normalizedModelName(modelName)]; ok {
                  if cfg.DefaultReasoningEffort != "" {
                      return cfg.DefaultReasoningEffort
                  }
                  if len(cfg.SupportedReasoningEfforts) == 1 {
                      return cfg.SupportedReasoningEffort[0]
                  }
              }
              return "medium"
          }''',
          )

          replace_between(
              "func isReasoningEffortAllowedForModel",
              "func normalizeReasoningEffortForModel",
              r'''func isReasoningEffortAllowedForModel(modelName, effort string) bool {
              if effort == "" {
                  return false
              }
              lowerModelName := normalizedModelName(modelName)
              normalizedEffort := strings.ToLower(strings.TrimSpace(effort))

              if cfg, ok := ModelRatios[lowerModelName]; ok && len(cfg.SupportedReasoningEfforts) > 0 {
                  for _, allowed := range cfg.SupportedReasoningEfforts {
                      if strings.EqualFold(allowed, normalizedEffort) {
                          return true
                      }
                      // GPT-5.6 uses canonical "none" while legacy clients may still send "minimal".
                      if normalizedEffort == "minimal" && strings.EqualFold(allowed, "none") {
                          return true
                      }
                  }
                  return false
              }

              if isDeepResearchModel(lowerModelName) || isMediumOnlyReasoningModel(lowerModelName) {
                  return normalizedEffort == "medium"
              }
              switch normalizedEffort {
              case "low", "medium", "high":
                  return true
              default:
                  return false
              }
          }''',
          )

          replace_between(
              "func normalizeReasoningEffortForModel",
              "func stringRef",
              r'''func normalizeReasoningEffortForModel(modelName string, effort *string) *string {
              defaultEffort := defaultReasoningEffortForModel(modelName)
              if effort == nil {
                  return stringRef(defaultEffort)
              }

              normalized := strings.ToLower(strings.TrimSpace(*effort))
              if normalized == "minimal" {
                  if cfg, ok := ModelRatios[normalizedModelName(modelName)]; ok {
                      for _, allowed := range cfg.SupportedReasoningEfforts {
                          if strings.EqualFold(allowed, "none") {
                              normalized = "none"
                              break
                          }
                      }
                  }
              }

              if !isReasoningEffortAllowedForModel(modelName, normalized) {
                  return stringRef(defaultEffort)
              }
              return stringRef(normalized)
          }''',
          )

          path.write_text(content)

          catalog = Path("relay/adaptor/openai/constants_catalog_202609.go")
          catalog_content = catalog.read_text()
          old = "gpt56SolLongContextTier"
          if catalog_content.count(old) != 2:
              raise RuntimeError(f"expected two {old} references, found {catalog_content.count(old)}")
          catalog_content = catalog_content.replace(old, "gpt56SolPromoLongContextTier")

          needle = '''\tfor _, modelName := range []string{"gpt-5.6", "gpt-5.6-sol"} {
          \t\tmodelRatios[modelName] = cloneModelConfig(sol)
          \t}
          '''
          replacement = needle + '''
          \tfor _, modelName := range []string{"gpt-5.6-terra", "gpt-5.6-luna"} {
          \t\tconfig, ok := modelRatios[modelName]
          \t\tif !ok {
          \t\t\tcontinue
          \t\t}
          \t\tconfig.SupportedReasoningEfforts = slices.Clone(gpt56CanonicalReasoningEfforts)
          \t\tmodelRatios[modelName] = config
          \t}
          '''
          if catalog_content.count(needle) != 1:
              raise RuntimeError("could not locate GPT-5.6 Sol catalog insertion point")
          catalog.write_text(catalog_content.replace(needle, replacement))
          PY

          gofmt -w \
            relay/adaptor/openai/adaptor_model_helpers.go \
            relay/adaptor/openai/constants_catalog_202609.go \
            relay/adaptor/openai/responseapi_request_json.go \
            relay/adaptor/openai/adaptor_gpt56_test.go \
            relay/adaptor/openai/adaptor_transcription_models_test.go \
            relay/adaptor/openai/responseapi_request_json_test.go \
            relay/quota/quota_cache_test.go

          go vet ./...
          go test ./relay/adaptor/openai ./relay/quota

          rm .github/workflows/chatgpt-fix-openai-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            relay/adaptor/openai/adaptor_model_helpers.go \
            relay/adaptor/openai/constants_catalog_202609.go \
            relay/adaptor/openai/responseapi_request_json.go \
            relay/adaptor/openai/adaptor_gpt56_test.go \
            relay/adaptor/openai/adaptor_transcription_models_test.go \
            relay/adaptor/openai/responseapi_request_json_test.go \
            relay/quota/quota_cache_test.go \
            .github/workflows/chatgpt-fix-openai-integration.yml
          git diff --cached --check
          git commit -m "fix(openai): integrate catalog update with current helpers"
          git push origin HEAD:chore/update-openai-models-2026-09
