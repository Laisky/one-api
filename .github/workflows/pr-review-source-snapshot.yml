name: PR review source snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.number == 445
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download public tokenizer dictionaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tiktoken-cache"
          for name in cl100k_base o200k_base p50k_base r50k_base; do
            url="https://openaipublic.blob.core.windows.net/encodings/$name.tiktoken"
            key=$(printf '%s' "$url" | sha1sum | cut -d' ' -f1)
            curl --fail --silent --show-error --location --retry 2 "$url" -o "$RUNNER_TEMP/tiktoken-cache/$key"
          done
          (cd "$RUNNER_TEMP/tiktoken-cache" && sha256sum *)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-tokenizer-review-fixtures
          path: ${{ runner.temp }}/tiktoken-cache
          retention-days: 1
          if-no-files-found: error
