name: Zhipu catalogue one-time qualification

on:
  push:
    branches: [fix/zhipu-model-metadata-20261012]
    paths: [.github/workflows/zhipu-catalog-qualification.yml]

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Format regression tests with the repository Go toolchain
        run: |
          git diff --exit-code e2d0eda26aea89c374a1f5cce38c439380a8b917 -- relay/adaptor/zhipu/constants_text.go relay/adaptor/zhipu/constants_vision.go relay/adaptor/zai/constants.go
          gofmt -w relay/adaptor/zhipu/catalog_metadata_test.go
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/qualify_zhipu_catalog.py')
          source = path.read_text()
          old = '["git", "rev-parse", "HEAD^"]'
          assert source.count(old) == 1
          source = source.replace(old, '["git", "merge-base", "HEAD", BASE]')
          old = 'changed = [text_path, vision_path, zai_path, "docs/zhipu-model-catalog.md"]'
          assert source.count(old) == 1
          source = source.replace(old, old[:-1] + ', "relay/adaptor/zhipu/catalog_metadata_test.go"]')
          path.write_text(source)
          PY
      - name: Reproduce, fix, qualify and commit the scoped catalogue changes
        env:
          GH_TOKEN: ${{ github.token }}
          GOFLAGS: -mod=readonly
        run: python3 .github/scripts/qualify_zhipu_catalog.py
      - name: Retain complete qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zhipu-catalog-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/zhipu-catalog-evidence
          retention-days: 14
          if-no-files-found: error
