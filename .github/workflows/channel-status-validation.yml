name: Selected channel status validation
on:
  push:
    branches: [work/compact-table-toolbar-20260924]
    paths: [.github/workflows/channel-status-validation.yml]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: channel-status-transport
          path: .work/channel-status.patch.gz.b64
          retention-days: 1
