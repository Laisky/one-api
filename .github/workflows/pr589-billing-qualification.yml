name: PR589 billing behavior (temporary)
on:
  pull_request:
    paths:
      - 'relay/**'
      - '.github/workflows/pr589-billing-qualification.yml'
permissions:
  contents: read
jobs:
  deepseek-ws:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Go 1.27.3
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
      - name: DeepSeek WS real route behavioral regression
        run: |
          go test -race -count=1 -timeout=15m -run '^(TestDeepSeekToolReceiptWebSocketAdmission|TestClaudeConservativeIndependentToolAllowance|TestClaudeConservativeRawAndConvertedToolQuoteCompatibility)$' -v ./relay/controller
