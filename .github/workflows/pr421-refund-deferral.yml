name: PR 421 refund deferral qualification
on:
  push:
    branches: [work/pr421-refund-deferral-20260922]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Reproduce both deadline regressions before the fix
        run: |
          set +e
          go test -race -count=1 -timeout=4m -json ./model -run '^TestQuotaRefundDeferral' > "$RUNNER_TEMP/deferral-negative.jsonl" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - "$RUNNER_TEMP/deferral-negative.jsonl" <<'PY'
          import json,sys
          text=open(sys.argv[1]).read()
          assert '[build failed]' not in text,text[-12000:]
          rows=[json.loads(line) for line in text.splitlines() if line.startswith('{')]
          failed={r.get('Test') for r in rows if r.get('Action')=='fail' and r.get('Test')}
          assert failed=={'TestQuotaRefundDeferralSurvivesSweepDeadline','TestQuotaRefundDeferralDeadlineBoundsCleanup'},failed
          PY
      - name: Apply bounded deferral and the documented test selector
        run: |
          python3 .github/pr421-deferral-prepare.py
          test -z "$(gofmt -l model/quota_refund*.go)"
      - name: Run the actual documented model qualification selector
        run: |
          pattern=$(python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('docs/model-protocol-support-20260922.md').read_text()
          pattern=re.search(r"go test -race -count=1 ./model -run '([^']+)'",text).group(1)
          tests=[]
          for source in pathlib.Path('model').glob('quota_refund*_test.go'):
              tests.extend(re.findall(r'^func (Test\w+)\(',source.read_text(),re.M))
          assert tests and all(re.search(pattern,name) for name in tests),tests
          print(pattern)
          PY
          )
          go test -race -count=1 -timeout=6m -json ./model -run "$pattern" > "$RUNNER_TEMP/deferral-model-positive.jsonl" 2>&1
      - name: Verify request retry and refund ownership ledgers
        if: always()
        run: go test -race -count=1 -timeout=6m -json ./relay/controller -run '^TestPR421(TransientRefund|PendingRefund|RollbackRetry)' > "$RUNNER_TEMP/deferral-controller-positive.jsonl" 2>&1
      - name: Verify complete Go static checks
        if: always()
        run: go vet ./... > "$RUNNER_TEMP/deferral-vet.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr421-refund-deferral-evidence
          path: |
            ${{ runner.temp }}/deferral-*.jsonl
            ${{ runner.temp }}/deferral-vet.log
          retention-days: 7
  publish:
    needs: [qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/pr421-refund-deferral-20260922
      - name: Publish only the qualified source
        env:
          QUALIFIED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"
          python3 .github/pr421-deferral-prepare.py
          git rm .github/pr421-deferral-prepare.py .github/workflows/pr421-refund-deferral.yml
          git add model/quota_refund_worker.go model/quota_refund_deferral_test.go docs/model-protocol-support-20260922.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: defer timed-out refunds without starving recovery'
          git push origin HEAD:refs/heads/work/pr421-refund-deferral-20260922
