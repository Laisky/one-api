# Temporary audit runner; remove after recording verification receipts.
name: Adaptor catalogue checks

on:
  pull_request:
    paths:
      - 'relay/adaptor/**'
      - 'relay/billing/ratio/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/adaptor-catalog-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptor-catalogue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-metadata:
    name: Mistral and Cohere catalogue regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Run affected adaptor packages
        run: go test -count=1 -timeout=5m ./relay/adaptor/mistral ./relay/adaptor/cohere
      - name: Archive tracked catalogue audit inputs
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/adaptor-audit-inputs.tar.gz" HEAD \
            relay/adaptor relay/billing/ratio AGENTS.md go.mod go.sum
      - name: Retain scoped audit inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: adaptor-audit-inputs
          path: ${{ runner.temp }}/adaptor-audit-inputs.tar.gz
          retention-days: 1
          if-no-files-found: error
