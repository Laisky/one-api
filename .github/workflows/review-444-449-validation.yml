name: PR 444-449 pinned review qualification
on:
  push:
    branches: [codex/review-444-449-validation]
    paths: [.github/workflows/review-444-449-validation.yml]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      settlement_commit: ${{ steps.assemble.outputs.settlement_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cf51018628043b3d39fb7175e3ea379b356af9ef
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Qualify immutable financial code and verified supplemental tests
        id: assemble
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, shutil, subprocess, urllib.request
          old='567b7b910065e4b7f63843ed470fc6005f5ac519'
          parent='c7f4fe9d758ffb7cb9bf3abe0723e23c18e7eb39'
          main='cf51018628043b3d39fb7175e3ea379b356af9ef'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'qualified'
          evidence=root/'evidence'
          evidence.mkdir(parents=True)
          def api(path,value=None):
              request=urllib.request.Request('https://api.github.com/repos/Laisky/one-api/'+path,
                  data=None if value is None else json.dumps(value).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          def git(args,cwd=None,data=None): return subprocess.check_output(['git']+args,cwd=cwd,input=data)
          parts=['ca5070e824572a41b8520c8e71b1a03b2156060d','6e194017d219a8f5673a2dfc92f3fa9bf29eacd4','97cce9aa4dd89f44a182c7c06441c1caf258ea79']
          packed=b''.join(base64.b64decode(api('git/blobs/'+sha)['content']) for sha in parts)
          assert hashlib.sha256(packed).hexdigest()=='99fba19c3d87e06b86584744e325ea33779fe9a3360fb0a560daca9338007f35'
          entry=next(e for e in json.loads(lzma.decompress(packed))['entries'] if e['pr']==449)
          source=root/'source449'
          git(['worktree','add','--detach',str(source),old])
          git(['apply','--index','--whitespace=error'],source,entry['patch'].encode())
          git(['fetch','--no-tags','origin',parent])
          work=root/'pr449'
          git(['worktree','add','--detach',str(work),parent])
          subprocess.run(['git','merge','--no-commit','--no-ff',main],cwd=work,check=True)
          hashes={
              'controller/token_settlement_atomic_test.go':'6369cc831d9b15f96ceab1eec708c40d8833e48e77397a6c42363bb9af334afd',
              'controller/token_settlement_backend_test.go':'88091a6fedd5844087fa10b470051e3be9e53a233aab1be3b682aa278f5372b1',
              'controller/token_settlement_fault_test.go':'8ca35fd0d106a3f47413210fde2a627b1018bb203dd76a0b8b59a4cfa1d775b2',
          }
          for name in hashes:
              assert hashlib.sha256((source/name).read_bytes()).hexdigest()==entry['files'][name]
              assert not (work/name).exists()
              shutil.copyfile(source/name,work/name)
          p=work/'controller/token_settlement_fault_test.go'
          p.write_text(p.read_text().replace('"github.com/Laisky/one-api/model"','"github.com/Laisky/one-api/model"\n"github.com/Laisky/one-api/common/helper"').replace('Quota: quota','FinalQuota: quota, At: helper.GetTimestamp()'))
          subprocess.run(['gofmt','-w']+list(hashes),cwd=work,check=True)
          for name,digest in hashes.items(): assert hashlib.sha256((work/name).read_bytes()).hexdigest()==digest
          git(['add','controller'],work)
          git(['diff','--cached','--check'],work)
          with (evidence/'sqlite-financial.jsonl').open('w') as output:
              subprocess.run(['go','test','-json','-race','-count=3','-timeout=10m','-run','^TestExternalSettlement','./controller'],cwd=work,stdout=output,stderr=subprocess.STDOUT,check=True)
          tree=git(['write-tree'],work).decode().strip()
          elements=[]
          for name in git(['diff','--cached','--name-only',main],work).decode().splitlines():
              assert name.startswith(('controller/','model/')) and '..' not in pathlib.PurePosixPath(name).parts
              blob=api('git/blobs',{'content':base64.b64encode((work/name).read_bytes()).decode(),'encoding':'base64'})
              elements.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          result=api('git/trees',{'base_tree':'f14fa6d5b6ffce9166dcc6e1a5727da203e7b256','tree':elements})
          assert result['sha']==tree
          commit=api('git/commits',{'message':'test(billing): qualify durable finalization faults on real engines','tree':tree,'parents':[parent,main]})
          manifest={'parent':parent,'main':main,'tree':tree,'commit':commit['sha'],'supplements':[e for e in elements if e['path'] in hashes]}
          (root/'candidate-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('settlement_commit='+commit['sha']+'\n')
          print(json.dumps(manifest,indent=2))
          # This is immutable qualification, not publication. No PR or branch is
          # changed, and the in-flight response-expiry work is not overwritten.
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr449-financial-candidate
          path: |
            ${{ runner.temp }}/qualified/candidate-manifest.json
            ${{ runner.temp }}/qualified/evidence/
          retention-days: 7
          if-no-files-found: error
  live-settlement:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [mysql, postgres]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: review-local-only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -preview-local-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: review-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.assemble.outputs.settlement_commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Qualify exact physical balances and rollback on the requested engine
        env:
          ONEAPI_SETTLEMENT_TEST_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ONEAPI_SETTLEMENT_TEST_BACKEND" == mysql ]]; then
            export ONEAPI_SETTLEMENT_TEST_DSN='root:review-local-only@tcp(127.0.0.1:3306)/mysql?parseTime=true'
          else
            export ONEAPI_SETTLEMENT_TEST_DSN='postgres://postgres:review-local-only@127.0.0.1:5432/postgres?sslmode=disable'
          fi
          mkdir -p review-evidence
          go test -json -race -count=3 -timeout=10m ./controller -run '^TestExternalSettlement' | tee review-evidence/${ONEAPI_SETTLEMENT_TEST_BACKEND}.jsonl
          python3 - <<'PY'
          import json, os, pathlib
          records=[json.loads(line) for line in pathlib.Path('review-evidence/'+os.environ['ONEAPI_SETTLEMENT_TEST_BACKEND']+'.jsonl').read_text().splitlines()]
          assert not any(r.get('Action') in ('skip','fail') for r in records)
          for name in ['TestExternalSettlementCancellationIsAtomic','TestExternalSettlementConcurrentFinalizers','TestExternalSettlementWriteFailureRollsBack','TestExternalSettlementFinalQuotaBoundaries']:
              assert sum(r.get('Action')=='pass' and r.get('Test')==name for r in records)==3, name
          assert any('against live '+os.environ['ONEAPI_SETTLEMENT_TEST_BACKEND'] in r.get('Output','') for r in records)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr449-live-${{ matrix.backend }}
          path: review-evidence/
          retention-days: 7
          if-no-files-found: error
