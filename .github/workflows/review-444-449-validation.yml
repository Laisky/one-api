name: PR 444-449 pinned review qualification
on:
  push:
    branches: [codex/review-444-449-validation]
    paths: [.github/workflows/review-444-449-validation.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 570df7fb2921078f0e2ad322fdff8c5d85e08e7b
          persist-credentials: false
          fetch-depth: 0
      - name: Capture the exact concurrent revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/converge"
          while read -r name sha; do
            git fetch --no-tags origin "$sha"
            git update-ref "refs/review/$name" "$sha"
            git archive --format=tar.gz --prefix="$name/" "$sha" > "$RUNNER_TEMP/converge/$name.tar.gz"
          done <<'REVISIONS'
          main 570df7fb2921078f0e2ad322fdff8c5d85e08e7b
          pr446 e4cd490aa670e790acfdb5f5e4d36bda062a3109
          pr447 d311f6f2bec0d027f8d96cd8b82289a36a463512
          pr448 4c84b203b44444c13edc5071743747682c12a7da
          pr449 d4e4eaf5a02680b4010d8519804810a41e7d594b
          REVISIONS
          git bundle create "$RUNNER_TEMP/converge/review.bundle" refs/review/main refs/review/pr446 refs/review/pr447 refs/review/pr448 refs/review/pr449
          (cd "$RUNNER_TEMP/converge" && sha256sum *.gz *.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: concurrent-review-sources
          path: ${{ runner.temp }}/converge/
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
