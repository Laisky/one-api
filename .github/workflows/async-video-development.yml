name: Async video development verification
on:
  push:
    branches: [codex/async-video-task-lifecycle]
permissions:
  contents: read
concurrency:
  group: async-video-development
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Populate public tokenizer fixtures
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tokenizer-fixtures
        run: |
          mkdir -p "$TIKTOKEN_CACHE_DIR"
          cat > "$RUNNER_TEMP/warm-tokenizer.go" <<'GO'
          package main
          import (
            "log"
            "github.com/pkoukk/tiktoken-go"
          )
          func main() {
            for _, name := range []string{"cl100k_base", "o200k_base", "p50k_base", "r50k_base"} {
              if _, err := tiktoken.GetEncoding(name); err != nil { log.Fatal(err) }
            }
          }
          GO
          go run "$RUNNER_TEMP/warm-tokenizer.go"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: async-video-tokenizer-fixtures
          path: ${{ runner.temp }}/tokenizer-fixtures
          retention-days: 1
