name: Async video development verification
on:
  push:
    branches: [codex/async-video-task-lifecycle]
permissions:
  contents: read
concurrency:
  group: async-video-development
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.head_commit.message == 'ci: publish verified async-video changes without rewriting contributor history'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out only the authorized development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/async-video-task-lifecycle
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch the content-addressed patch and verify its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import urllib.request
          chunks = [
              '8cc9e20c4d399c3baf0a6bbabf463b6ae0f7308e',
              'a0d793f454234bfb19ed3dc8498e4c71f28c8787',
              '7fe6270b8123b6f1779051fcbd7f819bafdff460',
              'b8c2690bdf9a92ba9fc94e93d4ccddfe9acded4a',
          ]
          payload = bytearray()
          for sha in chunks:
              request = urllib.request.Request(
                  'https://api.github.com/repos/Laisky/one-api/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'User-Agent': 'one-api-verified-patch-publisher'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              if blob.get('sha') != sha or blob.get('encoding') != 'base64':
                  raise SystemExit('Unexpected blob response')
              payload.extend(base64.b64decode(blob['content']))
          patch = lzma.decompress(payload)
          expected = '412a949a781b7dcd6e5aa6bfb45b0e8d7dc42817e86ae7a6723ff17ad250197f'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch digest mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'async-video.patch').write_bytes(patch)
          print('Verified implementation patch:', len(patch), 'bytes')
          PY
      - name: Preserve ancestry and append the verified implementation commit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git branch --show-current)" = 'codex/async-video-task-lifecycle'
          git -c core.hooksPath=/dev/null fetch origin refs/pull/423/head
          contributor_head=$(git rev-parse FETCH_HEAD)
          git merge-base --is-ancestor "$contributor_head" HEAD
          git apply --check "$RUNNER_TEMP/async-video.patch"
          git apply "$RUNNER_TEMP/async-video.patch"
          git diff --check
          if git diff --name-only | grep -q '^.github/'; then
            echo 'Implementation patch unexpectedly changes workflows'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git -c core.hooksPath=/dev/null commit -m 'feat: persist async video lifecycle and bridge native providers to synchronous generation' -m 'Preserve all contributor commits from PR #423. Add native capability isolation, durable task/quota transactions, leased workers, owner-scoped idempotency, normalized results, recovery and regression coverage.'
          git merge-base --is-ancestor "$contributor_head" HEAD
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/codex/async-video-task-lifecycle
          {
            echo '## Verified implementation published'
            echo "Commit: $(git rev-parse HEAD)"
            echo "Contributor head preserved: $contributor_head"
            git show --stat --oneline HEAD
          } >> "$GITHUB_STEP_SUMMARY"
