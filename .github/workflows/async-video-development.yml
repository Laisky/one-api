name: Async video development verification
on:
  push:
    branches: [codex/async-video-task-lifecycle]
permissions:
  contents: read
concurrency:
  group: async-video-development
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Download declared public module sources
        run: go mod download
      - name: Export only Go toolchain and module sources
        run: |
          mkdir -p "$RUNNER_TEMP/offline-go"
          tar -czf "$RUNNER_TEMP/offline-go/toolchain.tar.gz" -C "$(go env GOROOT)" .
          tar -czf "$RUNNER_TEMP/offline-go/modules.tar.gz" -C "$(go env GOMODCACHE)" .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: async-video-offline-go
          path: ${{ runner.temp }}/offline-go/*.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Reproduce native routing and paid replay bugs
        run: |
          set -o pipefail
          go test -count=1 -p 1 -run 'TestAsyncVideoSubmissionRetryBoundary|TestMuAPINativeVideoCapabilityIsIsolated' ./controller ./relay/channeltype 2>&1 | tee "$RUNNER_TEMP/async-video-reproduction.log"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: async-video-reproduction
          path: ${{ runner.temp }}/async-video-reproduction.log
          retention-days: 7
