name: Streaming follow-up fixtures

on:
  push:
    branches: [work/stream-perf-followup-20260924]
    paths:
      - '.github/workflows/stream-followup-build.yml'
      - 'ci/stream-followup-trigger.txt'

permissions:
  contents: read

concurrency:
  group: stream-followup-fixtures
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Build immutable control and candidate fixtures
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/stream-fixtures"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          go version > "$out/toolchain.txt"
          go build -trimpath -o "$out/one-api-candidate" .
          go build -trimpath -o "$out/stream-perf" ./tests/stream-perf
          go test -c -o "$out/openai-tests" ./relay/adaptor/openai
          git worktree add --detach "$RUNNER_TEMP/control" 36829cfdfddb29f6a7a2d4e20a42eb02b0f3ef4c
          (cd "$RUNNER_TEMP/control" && go build -trimpath -o "$out/one-api-control" .)
          python3 tests/stream-perf/cache_tokens.py --cache "$out/token-cache"
          git ls-files -z | tar --exclude='.github/instructions' --null -T - -czf "$out/source.tar.gz"
          sha256sum "$out/one-api-control" "$out/one-api-candidate" "$out/stream-perf" "$out/openai-tests" > "$out/SHA256SUMS"
          gofmt -d tests/stream-perf/e2e_test.go relay/adaptor/openai/token.go relay/adaptor/openai/token_ordinary_test.go relay/adaptor/openai/gpt52_sampling_regression_test.go > "$out/gofmt.diff"
      - name: Focused race and behavior tests
        env:
          GOTOOLCHAIN: local
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/stream-fixtures/token-cache
        run: |
          set -o pipefail
          go test -race -count=1 ./common/sse ./common/render ./relay/adaptor/openai ./relay/controller ./tests/stream-perf -run 'Test.*(Sampling|LineReader|Stream|SSE|OrdinaryToken)' 2>&1 | tee "$RUNNER_TEMP/stream-fixtures/focused-tests.log"
      - name: Preserve fixtures and validation even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stream-followup-${{ github.sha }}
          path: ${{ runner.temp }}/stream-fixtures
          retention-days: 7
          if-no-files-found: error
