# Temporary RED/GREEN reviewer evidence only; delete before integration.
name: PR603 reviewer TTL behavior qualification
on:
  pull_request:
    paths:
      - 'relay/controller/**'
      - '.github/workflows/pr603-reviewer-qualification.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout reviewed PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go 1.27.3
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Execute focused reviewer behavior regressions
        run: |
          go test -race -count=1 -timeout=15m -p=2 \
            -run '^(TestGPT61TerraReviewer.*|TestGPT61TerraRejectsUnpricedCacheLifetimeVariants|TestGPT61TerraCacheLifetimePolicyAcrossPublishedModels|TestGPT61TerraCacheLifetimeControlsPreserveSupportedRequests|TestGPT61TerraRejectsUnmeteredTwelveHourCache)$' \
            ./relay/controller
