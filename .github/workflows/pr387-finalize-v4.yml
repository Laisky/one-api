name: Finalize and verify PR 387 v4

on:
  push:
    branches:
      - feat/mcp-2026-07-28-protocol
    paths:
      - .github/workflows/pr387-finalize-v4.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: pr387-finalize-v2
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: web/modern/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Apply pending deterministic repair scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/scripts/pr387_repair.py ]; then
            python3 .github/scripts/pr387_repair.py
          fi
          if [ -f .github/scripts/pr387_repair_v2.py ]; then
            python3 .github/scripts/pr387_repair_v2.py
          fi
          mapfile -t files < <(git ls-files 'controller/mcp*.go' 'model/mcp*.go' 'relay/mcp/*.go')
          if [ ${#files[@]} -gt 0 ]; then
            gofmt -w "${files[@]}"
          fi

      - name: Validate exact end-to-end implementation
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== source formatting ==='
            test -z "$(gofmt -l $(git ls-files 'controller/mcp*.go' 'model/mcp*.go' 'relay/mcp/*.go'))"
            git diff --check
            echo '=== focused MCP behavior tests ==='
            go test -count=1 ./relay/mcp ./model ./controller
            echo '=== go vet ==='
            go vet ./...
            echo '=== race-enabled full Go tests ==='
            go test -race -count=1 ./...
            echo '=== Modern frontend build ==='
            make build-frontend-modern
          } 2>&1 | tee /tmp/pr387-v4-validation.log

      - name: Push validated staging head and empty trigger
        id: staging
        shell: bash
        env:
          BRANCH: feat/mcp-2026-07-28-protocol
        run: |
          set -euo pipefail
          rm -f .github/scripts/pr387_repair.py
          rm -f .github/scripts/pr387_repair_v2.py
          rm -f .github/workflows/pr387-complete.yml
          rm -f .github/workflows/pr387-complete-v2.yml
          rm -f .github/workflows/pr387-source-snapshot.yml
          rm -f .github/workflows/pr387-finalize.yml
          rm -f .github/workflows/pr387-finalize-v2.yml
          rm -f .github/workflows/pr387-finalize-v3.yml
          rm -f .github/workflows/pr387-finalize-v4.yml
          : > .github/pr387-final-trigger-v4

          git config user.name 'Laisky.Cai'
          git config user.email 'github@laisky.com'
          git add -A
          git commit -m 'fix(mcp): publish fully validated end-to-end gateway implementation'
          git push origin HEAD:"${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for @GitHub to remove the empty trigger
        id: final_head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: feat/mcp-2026-07-28-protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'pr387-finalizer-v4',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/{path}',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise

          encoded_branch = urllib.parse.quote(branch, safe='')
          for _ in range(1200):
              status, _ = get(f'contents/.github/pr387-final-trigger-v4?ref={encoded_branch}')
              if status == 404:
                  _, ref = get(f'git/ref/heads/{encoded_branch}')
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write(f"sha={ref['object']['sha']}\n")
                  break
              time.sleep(4)
          else:
              raise SystemExit('Timed out waiting for the @GitHub final trigger commit')
          PY

      - name: Wait for normal repository CI on final head
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_head.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          sha = os.environ['FINAL_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'pr387-finalizer-v4',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path, parameters=None):
              query = '?' + urllib.parse.urlencode(parameters or {}) if parameters else ''
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/{path}{query}',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          required = {'lint', 'pr-check'}
          final = {}
          for _ in range(1200):
              runs = get('actions/runs', {
                  'head_sha': sha,
                  'event': 'pull_request',
                  'per_page': 100,
              }).get('workflow_runs', [])
              latest = {}
              for run in sorted(runs, key=lambda item: item['id'], reverse=True):
                  latest.setdefault(run['name'], run)
              if required <= latest.keys() and all(latest[name]['status'] == 'completed' for name in required):
                  final = {name: latest[name] for name in required}
                  break
              time.sleep(6)
          else:
              raise SystemExit('Timed out waiting for lint and pr-check on final head')

          failures = {name: run for name, run in final.items() if run.get('conclusion') != 'success'}
          with open('/tmp/pr387-v4-final-workflows.json', 'w', encoding='utf-8') as output:
              json.dump(final, output, indent=2)
          if failures:
              details = ', '.join(
                  f"{name}={run.get('conclusion')} ({run.get('html_url')})"
                  for name, run in sorted(failures.items())
              )
              raise SystemExit('Final-head workflows failed: ' + details)
          PY

      - name: Update PR title, description, and verification comment
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_head.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          sha = os.environ['FINAL_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'pr387-finalizer-v4',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def send(path, method, payload):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/{path}',
                  data=json.dumps(payload).encode(),
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30):
                  pass

          body = f'''## Summary

Complete one-api's end-to-end MCP gateway upgrade to the stable `2026-07-28` protocol while retaining explicit compatibility with initialization/session-based MCP peers.

one-api is covered in both roles:

- **MCP server:** authenticated downstream clients use `/mcp` for `server/discover`, paginated `tools/list`, and `tools/call`.
- **MCP client:** synchronization and execution use modern stateless requests first, with bounded fallback to supported legacy protocol profiles.

## End-to-end behavior

- preserve exact case-sensitive tool names across discovery, persistence, policy resolution, listing, and invocation
- persist and re-emit complete tool descriptors, including current fields and unknown extension fields
- replace tool catalogs atomically while retaining one-api-owned identity, status, and pricing overrides
- expose deterministic aggregate pagination with opaque catalog-fingerprinted cursors
- propagate modern result fields and unknown result extensions without lossy translation
- support multi-round-trip `input_required` results and bill only a completed logical call
- enforce mirrored MCP headers, bounded request/response bodies, exact JSON-RPC response correlation, and safe credential transport/redirect behavior
- route legacy version headers and initialization traffic through the legacy handler without imposing modern semantics
- keep OpenAI Responses Tool Search outside this MCP wire-protocol change; the lossless catalog is the substrate for that separate orchestration feature

## Verification

The exact final @GitHub head `{sha}` passed:

- `git diff --check`
- Go formatting verification for all touched MCP files
- `go test -count=1 ./relay/mcp ./model ./controller`
- `go vet ./...`
- `go test -race -count=1 ./...`
- `make build-frontend-modern`
- repository `lint` workflow
- repository `pr-check` workflow

Temporary repair and verification workflows/scripts are absent from the final branch.
'''
          send('pulls/387', 'PATCH', {
              'title': 'feat(mcp): complete end-to-end protocol 2026-07-28 gateway support',
              'body': body,
          })
          send('issues/387/comments', 'POST', {
              'body': f'''Final end-to-end MCP verification completed for clean @GitHub head `{sha}`.

This exact commit passed the focused MCP behavior suite, full race-enabled Go test suite, `go vet`, Modern frontend build, and the repository's normal `lint` and `pr-check` workflows. All temporary completion scaffolding is absent from the final branch.''',
          })
          PY

      - name: Upload final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr387-final-verification-v4-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            /tmp/pr387-v4-validation.log
            /tmp/pr387-v4-final-workflows.json

      - name: Comment on finalizer failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          log = pathlib.Path('/tmp/pr387-v4-validation.log')
          excerpt = '\n'.join(log.read_text(errors='replace').splitlines()[-120:]) if log.exists() else ''
          body = 'PR #387 final verification v4 did not complete. Workflow: ' + os.environ['RUN_URL']
          if excerpt:
              body += '\n\n<details><summary>Validation log tail</summary>\n\n```text\n' + excerpt[-12000:] + '\n```\n</details>'
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/387/comments",
              data=json.dumps({'body': body}).encode(),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Content-Type': 'application/json',
                  'User-Agent': 'pr387-finalizer-v4',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY
