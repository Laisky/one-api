name: OpenAI catalogue workbench
on:
  push:
    branches: [workbench/openai-catalog-20261013]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 52aad0a9d70235911e9a5f2d9b2a74f32d3bf253
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Verify exact head and formatting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          git rev-parse HEAD > "$RUNNER_TEMP/qualification/commit.txt"
          test "$(git rev-parse HEAD)" = 52aad0a9d70235911e9a5f2d9b2a74f32d3bf253
          go version > "$RUNNER_TEMP/qualification/toolchain.txt"
          git diff --check eed2a6d02e5392f24197f49a70af3ba2ba22f212 HEAD
          git diff --name-only eed2a6d02e5392f24197f49a70af3ba2ba22f212 HEAD -- '*.go' | xargs gofmt -l > "$RUNNER_TEMP/qualification/format.txt"
          test ! -s "$RUNNER_TEMP/qualification/format.txt"
          git diff --stat eed2a6d02e5392f24197f49a70af3ba2ba22f212 HEAD > "$RUNNER_TEMP/qualification/diff-stat.txt"
      - name: Execute focused regression set first
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json -count=1 -p 2 ./relay/adaptor/openai -run '^(TestOpenAIOctober|TestGPT54ReasoningEffort)' > "$RUNNER_TEMP/qualification/focused.jsonl" 2> "$RUNNER_TEMP/qualification/focused-stderr.txt"
          python3 - "$RUNNER_TEMP/qualification" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          events = [json.loads(line) for line in (root / 'focused.jsonl').read_text().splitlines() if line.startswith('{')]
          passed = {e.get('Test') for e in events if e.get('Action') == 'pass' and e.get('Test')}
          expected = {'TestOpenAIOctoberProRequestNormalization', 'TestOpenAIOctoberPublishedSnapshots', 'TestOpenAIOctoberChatAlias', 'TestOpenAIOctoberLifecycleGuidance', 'TestOpenAIOctoberPreservesCatalogPricing', 'TestOpenAIOctoberSnapshotOwnership', 'TestOpenAIOctoberLifecycleIntegrity', 'TestOpenAIOctoberSnapshotEffectivePricing', 'TestGPT54ReasoningEffort'}
          assert expected <= passed, f'missing passing tests: {expected - passed}'
          assert not any(e.get('Action') in {'fail', 'skip'} for e in events), 'failed or skipped regression'
          summary = {'top_level_tests': sorted(expected), 'passing_test_outcomes': len(passed)}
          (root / 'focused-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - name: Execute affected package race suites and vet
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json -count=1 -p 2 ./relay/adaptor/openai ./relay/adaptor/aiproxy ./relay/adaptor/openrouter ./relay/adaptor ./relay/pricing > "$RUNNER_TEMP/qualification/affected.jsonl" 2> "$RUNNER_TEMP/qualification/affected-stderr.txt"
          go vet ./relay/adaptor/openai ./relay/adaptor/aiproxy ./relay/adaptor/openrouter ./relay/adaptor ./relay/pricing > "$RUNNER_TEMP/qualification/vet.txt" 2>&1
          python3 - "$RUNNER_TEMP/qualification" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          events = [json.loads(line) for line in (root / 'affected.jsonl').read_text().splitlines() if line.startswith('{')]
          packages = {e['Package'] for e in events if e.get('Action') == 'pass' and not e.get('Test')}
          expected = {'github.com/Laisky/one-api/' + p for p in ['relay/adaptor/openai', 'relay/adaptor/aiproxy', 'relay/adaptor/openrouter', 'relay/adaptor', 'relay/pricing']}
          assert expected <= packages, f'missing package completion: {expected - packages}'
          assert not any(e.get('Action') == 'fail' for e in events), 'failed package tests'
          summary = {'packages': sorted(packages), 'passing_test_outcomes': sum(e.get('Action') == 'pass' and bool(e.get('Test')) for e in events), 'skipped_tests': [e.get('Test') for e in events if e.get('Action') == 'skip' and e.get('Test')], 'vet': 'passed'}
          (root / 'affected-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openai-october-qualification
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
          retention-days: 14
