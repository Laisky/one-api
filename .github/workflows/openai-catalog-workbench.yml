name: OpenAI catalogue workbench
on:
  push:
    branches: [workbench/openai-catalog-20261013]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 49dc9c7f33a46ea35d293ed6c3dc0c28825d741a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.2'
      - name: Verify exact fixed head and formatting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qualification"
          git rev-parse HEAD > "$RUNNER_TEMP/qualification/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/qualification/tree.txt"
          go version > "$RUNNER_TEMP/qualification/toolchain.txt"
          test "$(git rev-parse HEAD)" = 49dc9c7f33a46ea35d293ed6c3dc0c28825d741a
          git diff --check eed2a6d02e5392f24197f49a70af3ba2ba22f212 HEAD
          git diff --name-only eed2a6d02e5392f24197f49a70af3ba2ba22f212 HEAD -- '*.go' | xargs gofmt -l > "$RUNNER_TEMP/qualification/format.txt"
          test ! -s "$RUNNER_TEMP/qualification/format.txt"
          git diff --stat eed2a6d02e5392f24197f49a70af3ba2ba22f212 HEAD > "$RUNNER_TEMP/qualification/diff-stat.txt"
          git show 742f188e6f83ed08550f5cc5360eaafac9b317b8:relay/adaptor/openai/catalog_october_feature_ownership_test.go | gofmt > "$RUNNER_TEMP/qualification/baseline-test-formatted.go"
          cmp "$RUNNER_TEMP/qualification/baseline-test-formatted.go" relay/adaptor/openai/catalog_october_feature_ownership_test.go
          printf '%s\n' 'Baseline reproduced in run 38491120843, artifact 11862141290, SHA256 bf417562f2ff7d374911076eedb205b7a116e8af00febb77a3ffa28020ef307c. Only empty_shared_capacity failed, all four controls passed. Test assertions are byte-identical after gofmt.' > "$RUNNER_TEMP/qualification/baseline-receipt.txt"
      - name: Execute focused regression set first
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json -count=1 -timeout=8m -p 2 ./relay/adaptor/openai -run '^(TestOpenAIOctober|TestGPT54ReasoningEffort)' > "$RUNNER_TEMP/qualification/focused.jsonl" 2> "$RUNNER_TEMP/qualification/focused-stderr.txt"
          python3 - "$RUNNER_TEMP/qualification" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          events = [json.loads(line) for line in (root / 'focused.jsonl').read_text().splitlines() if line.startswith('{')]
          passed = {e.get('Test') for e in events if e.get('Action') == 'pass' and e.get('Test')}
          expected = {'TestOpenAIOctoberFeatureOwnership', 'TestOpenAIOctoberProRequestNormalization', 'TestOpenAIOctoberPublishedSnapshots', 'TestOpenAIOctoberChatAlias', 'TestOpenAIOctoberLifecycleGuidance', 'TestOpenAIOctoberPreservesCatalogPricing', 'TestOpenAIOctoberSnapshotOwnership', 'TestOpenAIOctoberLifecycleIntegrity', 'TestOpenAIOctoberSnapshotEffectivePricing', 'TestGPT54ReasoningEffort'}
          assert expected == {n for n in passed if '/' not in n}
          assert not any(e.get('Action') in {'fail', 'skip'} for e in events)
          summary = {'top_level_tests': sorted(expected), 'passing_test_outcomes': len(passed)}
          (root / 'focused-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - name: Execute affected package race suites and vet
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json -count=1 -timeout=8m -p 2 ./relay/adaptor/openai ./relay/adaptor/aiproxy ./relay/adaptor/openrouter ./relay/adaptor ./relay/pricing > "$RUNNER_TEMP/qualification/affected.jsonl" 2> "$RUNNER_TEMP/qualification/affected-stderr.txt"
          go vet ./relay/adaptor/openai ./relay/adaptor/aiproxy ./relay/adaptor/openrouter ./relay/adaptor ./relay/pricing > "$RUNNER_TEMP/qualification/vet.txt" 2>&1
          python3 - "$RUNNER_TEMP/qualification" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          events = [json.loads(line) for line in (root / 'affected.jsonl').read_text().splitlines() if line.startswith('{')]
          packages = {e['Package'] for e in events if e.get('Action') == 'pass' and not e.get('Test')}
          expected = {'github.com/Laisky/one-api/' + p for p in ['relay/adaptor/openai', 'relay/adaptor/aiproxy', 'relay/adaptor/openrouter', 'relay/adaptor', 'relay/pricing']}
          assert packages == expected
          assert not any(e.get('Action') == 'fail' for e in events)
          skipped = {e['Test'] for e in events if e.get('Action') == 'skip' and e.get('Test')}
          assert skipped <= {'TestDeepSeekLiveResponseFallbackAccepted', 'TestDeepSeekLiveContractRejectsUnrepairedHistory'}
          summary = {'packages': sorted(packages), 'top_level_passes': sum(e.get('Action') == 'pass' and bool(e.get('Test')) and '/' not in e['Test'] for e in events), 'passing_test_outcomes': sum(e.get('Action') == 'pass' and bool(e.get('Test')) for e in events), 'skipped_tests': sorted(skipped), 'vet': 'passed'}
          (root / 'affected-summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openai-pr570-review-qualification
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
          retention-days: 14
