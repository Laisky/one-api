name: PR387 review finalize

on:
  push:
    branches:
      - feat/mcp-2026-07-28-protocol
    paths:
      - .github/workflows/pr387-review-finalize.yml
      - .github/review/pr387-review-patch-*.part

permissions:
  contents: write

concurrency:
  group: pr387-review-finalize
  cancel-in-progress: false

jobs:
  apply-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply reviewer fixes and push the source commit
        shell: bash
        run: |
          set -euo pipefail

          cat .github/review/pr387-review-patch-*.part \
            | base64 --decode \
            | gzip --decompress > /tmp/pr387-review.patch
          echo '8d23cb7597fc6cc43d2ed1866a960eda9dd807a295e3720228884cf16bc3dad2  /tmp/pr387-review.patch' \
            | sha256sum --check

          git apply --check /tmp/pr387-review.patch
          git apply /tmp/pr387-review.patch

          rm -rf .github/review
          rm -f .github/workflows/pr387-review-finalize.yml
          rm -f .github/workflows/pr387-*.yml
          rm -f .github/scripts/pr387_repair*.py

          mapfile -t go_files < <(git diff --name-only --diff-filter=ACM | grep '\.go$' || true)
          if (( ${#go_files[@]} > 0 )); then
            gofmt -w "${go_files[@]}"
          fi

          git diff --check
          git config user.name 'Laisky.Cai'
          git config user.email 'github@laisky.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(mcp): address reviewer findings with behavior regressions'
          git push origin HEAD:refs/heads/feat/mcp-2026-07-28-protocol
