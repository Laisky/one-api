name: Generate consolidated frontend security update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: consolidated-frontend-security-update-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/consolidate-frontend-security-updates'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      YARN_VERSION: 1.22.22
      YARN_NETWORK_TIMEOUT: 600000
      FRONTEND_LOCK_BASELINE: /tmp/frontend-lock-baseline
      FRONTEND_SECURITY_REPORT: /tmp/frontend-security-validation-report.md
    steps:
      - name: Checkout the pull-request head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Refresh the base reference
        run: git fetch --no-tags origin main

      - name: Setup the production Node.js line
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pin Yarn Classic
        run: npm install --global "yarn@${YARN_VERSION}"

      - name: Preserve the pre-update lockfiles
        run: |
          set -euo pipefail
          mkdir -p "${FRONTEND_LOCK_BASELINE}"
          for theme in air berry modern; do
            cp "web/${theme}/yarn.lock" "${FRONTEND_LOCK_BASELINE}/${theme}.yarn.lock"
          done

      - name: Update manifests and invalidate only affected lock entries
        run: python3 .github/scripts/prepare_frontend_security_update.py refresh

      - name: Resolve refreshed entries without lifecycle scripts
        run: |
          set -euo pipefail
          for theme in air berry modern; do
            echo "==> resolving ${theme}"
            yarn --cwd "web/${theme}" install \
              --ignore-scripts \
              --non-interactive \
              --network-timeout "${YARN_NETWORK_TIMEOUT}"
          done

      - name: Verify patched floors and query OSV
        run: python3 .github/scripts/prepare_frontend_security_update.py verify

      - name: Reinstall cleanly from frozen lockfiles with lifecycle scripts
        run: |
          set -euo pipefail
          for theme in air berry modern; do
            echo "==> frozen install ${theme}"
            rm -rf "web/${theme}/node_modules"
            yarn --cwd "web/${theme}" install \
              --frozen-lockfile \
              --non-interactive \
              --network-timeout "${YARN_NETWORK_TIMEOUT}"
          done

      - name: Run all frontend test suites
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          yarn --cwd web/modern test --run --passWithNoTests
          yarn --cwd web/air test --watchAll=false --passWithNoTests
          yarn --cwd web/berry test --watchAll=false --passWithNoTests

      - name: Add permanent lockfile and production-build gates
        run: python3 .github/scripts/prepare_frontend_security_update.py harden

      - name: Validate the production Docker frontend build
        run: docker build --target web-builder --progress=plain -t one-api-web-security-check .

      - name: Validate the generated patch scope
        run: python3 .github/scripts/prepare_frontend_security_update.py validate

      - name: Assemble the reviewed artifact
        run: |
          set -euo pipefail
          artifact_root=/tmp/frontend-security-update
          rm -rf "${artifact_root}"
          mkdir -p "${artifact_root}"
          cp --parents \
            .github/workflows/lint.yml \
            Dockerfile \
            web/air/package.json web/air/yarn.lock \
            web/berry/package.json web/berry/yarn.lock \
            web/modern/package.json web/modern/yarn.lock \
            "${artifact_root}"
          cp "${FRONTEND_SECURITY_REPORT}" "${artifact_root}/validation-report.md"
          tar -C /tmp -czf /tmp/frontend-security-update.tar.gz frontend-security-update
          cat "${FRONTEND_SECURITY_REPORT}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload generated patch and validation report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-update
          path: /tmp/frontend-security-update.tar.gz
          if-no-files-found: error
          retention-days: 7
