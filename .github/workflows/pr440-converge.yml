name: PR440 convergence validation
on:
  push:
    branches: [work/pr440-converge-20261002t2205]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export the concurrent commit with its exact ancestry
        run: |
          git merge-base --is-ancestor 114e04cf188e8bf9144423b8934aee9d8cc190ce HEAD
          git bundle create "$RUNNER_TEMP/pr440-converge.bundle" HEAD ^114e04cf188e8bf9144423b8934aee9d8cc190ce
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr440-converge-source
          path: ${{ runner.temp }}/pr440-converge.bundle
          retention-days: 2
