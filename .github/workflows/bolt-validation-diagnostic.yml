name: bolt-validation-diagnostic

on:
  push:
    branches:
      - 'bolt/stream-bridge-allocations-20260818'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    if: "github.event.head_commit.message == 'ci(bolt): diagnose validation'"
    runs-on: ubuntu-latest
    steps:
      - name: Report validation workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = "bolt/stream-bridge-allocations-20260818"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          query = urllib.parse.urlencode({"branch": branch, "per_page": 30})
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs?{query}",
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              runs = json.load(response)["workflow_runs"]

          targets = [
              run for run in runs
              if run.get("name") == "bolt-review-validation"
              or run.get("path") == ".github/workflows/bolt-review-validation.yml"
          ]
          if not targets:
              summary = "No `bolt-review-validation` run was found among the 30 latest branch runs."
          else:
              lines = []
              for run in targets[:5]:
                  lines.append(
                      f"- run `{run['id']}`: status `{run['status']}`, "
                      f"conclusion `{run.get('conclusion')}`, head `{run['head_sha']}`, "
                      f"event `{run['event']}` — {run['html_url']}"
                  )
              summary = "\n".join(lines)

          body = (
              "## ⚡ Bolt validation diagnostic\n\n"
              f"Diagnostic run: https://github.com/{repository}/actions/runs/{os.environ['CURRENT_RUN_ID']}\n\n"
              f"{summary}\n"
          )
          payload = json.dumps({"body": body}).encode()
          comment_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/362/comments",
              data=payload,
              method="POST",
              headers={**headers, "Content-Type": "application/json"},
          )
          urllib.request.urlopen(comment_request).close()
          print(body)
          PY
