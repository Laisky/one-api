name: bolt-final-review-validation

on:
  push:
    branches:
      - 'bolt/stream-bridge-allocations-20260818'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: "github.event.head_commit.message == 'ci(bolt): final validation'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Prepare comparison worktrees
        id: prepare
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/bolt-reviewed 6462f74623a93a8bbc2395bfa566578f1a24c62e
          git worktree add --detach /tmp/bolt-main origin/main
          echo "main_sha=$(git -C /tmp/bolt-main rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reproduce the reviewed overflow
        id: overflow
        continue-on-error: true
        run: |
          set -euo pipefail
          cat >/tmp/reproduce_frame_overflow.go <<'EOF'
          package main

          import (
              "fmt"
              "math"
          )

          func main() {
              overhead := len("data: ") + len("\n\n")
              payloadLen := math.MaxInt - overhead + 1
              frameSize := len("data: ") + payloadLen + len("\n\n")
              if frameSize >= 0 {
                  panic(fmt.Sprintf("expected signed integer wrap, got frameSize=%d", frameSize))
              }
              fmt.Printf("math.MaxInt=%d payloadLen=%d frameSize=%d\n", math.MaxInt, payloadLen, frameSize)
          }
          EOF
          go run /tmp/reproduce_frame_overflow.go | tee /tmp/bolt-overflow.txt

      - name: Run exact-wire contract on reviewed head
        id: reviewed_behavior
        continue-on-error: true
        run: |
          set -euo pipefail
          cd /tmp/bolt-reviewed
          go test ./relay/controller \
            -run '^TestChatToResponseStreamBridge_EmitEventExactBytes$' \
            -count=1 2>&1 | tee /tmp/bolt-reviewed-behavior.txt

      - name: Run fixed behavior and overflow regression tests with race detector
        id: fixed_behavior
        continue-on-error: true
        run: |
          set -euo pipefail
          go test -race ./relay/controller \
            -run '^(TestChatToResponseStreamBridge_EmitEventExactBytes|TestResponseStreamFrameCapacity)$' \
            -count=1 2>&1 | tee /tmp/bolt-fixed-behavior.txt

      - name: Run complete changed package test suite
        id: controller_suite
        continue-on-error: true
        run: |
          set -euo pipefail
          go test ./relay/controller -count=1 2>&1 | tee /tmp/bolt-controller-suite.txt

      - name: Run repository static checks
        id: static_checks
        continue-on-error: true
        run: |
          set -euo pipefail
          test -z "$(gofmt -l \
            relay/controller/response_stream_bridge.go \
            relay/controller/response_stream_bridge_benchmark_test.go)"
          git diff --check 6462f74623a93a8bbc2395bfa566578f1a24c62e HEAD
          go vet ./... 2>&1 | tee /tmp/bolt-vet.txt

      - name: Reproduce current main behavior-equivalence failure
        id: main_format
        continue-on-error: true
        run: |
          set -euo pipefail
          cd /tmp/bolt-main
          go test ./relay/format \
            -run '^TestDetectFormatBehaviorEquivalent$/^wrong-type_model$' \
            -count=1 2>&1 | tee /tmp/bolt-main-format.txt

      - name: Benchmark reviewed and fixed implementations on the same runner
        id: benchmark
        continue-on-error: true
        env:
          GOMAXPROCS: '1'
        run: |
          set -euo pipefail
          (
            cd /tmp/bolt-reviewed
            go test ./relay/controller \
              -run '^$' \
              -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
              -benchmem -benchtime=100ms -count=1 -cpu=1 >/dev/null
          )
          go test ./relay/controller \
            -run '^$' \
            -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
            -benchmem -benchtime=100ms -count=1 -cpu=1 >/dev/null

          : >/tmp/bolt-benchmark-before.txt
          : >/tmp/bolt-benchmark-after.txt
          for i in $(seq 1 10); do
            if (( i % 2 == 1 )); then
              (
                cd /tmp/bolt-reviewed
                go test ./relay/controller -run '^$' \
                  -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
                  -benchmem -benchtime=500ms -count=1 -cpu=1
              ) >>/tmp/bolt-benchmark-before.txt
              go test ./relay/controller -run '^$' \
                -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
                -benchmem -benchtime=500ms -count=1 -cpu=1 \
                >>/tmp/bolt-benchmark-after.txt
            else
              go test ./relay/controller -run '^$' \
                -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
                -benchmem -benchtime=500ms -count=1 -cpu=1 \
                >>/tmp/bolt-benchmark-after.txt
              (
                cd /tmp/bolt-reviewed
                go test ./relay/controller -run '^$' \
                  -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \
                  -benchmem -benchtime=500ms -count=1 -cpu=1
              ) >>/tmp/bolt-benchmark-before.txt
            fi
          done

          python - <<'PY'
          import json
          import re
          import statistics
          from pathlib import Path

          name = "BenchmarkChatToResponseStreamBridgeEmitEvent"
          pattern = re.compile(
              rf"^{name}(?:-\d+)?\s+\d+\s+([0-9.]+)\s+ns/op"
              rf"(?:\s+[0-9.]+\s+MB/s)?\s+([0-9.]+)\s+B/op"
              rf"\s+([0-9.]+)\s+allocs/op$",
              re.MULTILINE,
          )

          def parse(path):
              rows = [tuple(map(float, row)) for row in pattern.findall(Path(path).read_text())]
              if len(rows) != 10:
                  raise SystemExit(f"expected 10 samples in {path}, found {len(rows)}")
              columns = list(zip(*rows))
              return tuple(statistics.median(column) for column in columns)

          before = parse("/tmp/bolt-benchmark-before.txt")
          after = parse("/tmp/bolt-benchmark-after.txt")
          latency_change = (after[0] - before[0]) / before[0] * 100
          result = {
              "before_ns": before[0],
              "after_ns": after[0],
              "latency_change_pct": latency_change,
              "before_bytes": before[1],
              "after_bytes": after[1],
              "before_allocs": before[2],
              "after_allocs": after[2],
              "allocation_equal": before[1:] == after[1:],
              "runtime_guardrail_pass": latency_change <= 15.0,
          }
          Path("/tmp/bolt-benchmark.json").write_text(json.dumps(result))
          print(json.dumps(result, indent=2))
          PY

      - name: Publish complete validation report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          MAIN_SHA: ${{ steps.prepare.outputs.main_sha }}
          PREPARE: ${{ steps.prepare.outcome }}
          OVERFLOW: ${{ steps.overflow.outcome }}
          REVIEWED_BEHAVIOR: ${{ steps.reviewed_behavior.outcome }}
          FIXED_BEHAVIOR: ${{ steps.fixed_behavior.outcome }}
          CONTROLLER_SUITE: ${{ steps.controller_suite.outcome }}
          STATIC_CHECKS: ${{ steps.static_checks.outcome }}
          MAIN_FORMAT: ${{ steps.main_format.outcome }}
          BENCHMARK: ${{ steps.benchmark.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          def read(path, fallback):
              file = Path(path)
              return file.read_text().strip() if file.exists() else fallback

          benchmark_path = Path("/tmp/bolt-benchmark.json")
          benchmark = json.loads(benchmark_path.read_text()) if benchmark_path.exists() else None
          overflow = read("/tmp/bolt-overflow.txt", "overflow reproduction output unavailable")
          main_output = read("/tmp/bolt-main-format.txt", "main comparison output unavailable")
          main_tail = "\n".join(main_output.splitlines()[-14:])

          required = {
              "prepare": os.environ["PREPARE"],
              "overflow reproduction": os.environ["OVERFLOW"],
              "reviewed exact-wire contract": os.environ["REVIEWED_BEHAVIOR"],
              "fixed behavior/race regression": os.environ["FIXED_BEHAVIOR"],
              "relay/controller suite": os.environ["CONTROLLER_SUITE"],
              "format/static checks": os.environ["STATIC_CHECKS"],
              "paired benchmark": os.environ["BENCHMARK"],
          }
          gate = all(value == "success" for value in required.values())
          if benchmark is None:
              gate = False
          else:
              gate = gate and benchmark["allocation_equal"] and benchmark["runtime_guardrail_pass"]

          status_rows = "\n".join(
              f"| {name} | `{status}` |" for name, status in required.items()
          )
          main_result = os.environ["MAIN_FORMAT"]
          main_sha = os.environ.get("MAIN_SHA") or "unavailable"
          run_url = f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}"

          if benchmark:
              change = benchmark["latency_change_pct"]
              if change < 0:
                  latency_summary = f"{abs(change):.2f}% faster"
              elif change > 0:
                  latency_summary = f"{change:.2f}% slower"
              else:
                  latency_summary = "unchanged"
              benchmark_table = f"""
          | Metric (10-sample median) | Reviewed head `6462f74` | Fixed head | Change |
          |---|---:|---:|---:|
          | Runtime | {benchmark['before_ns']:.1f} ns/op | {benchmark['after_ns']:.1f} ns/op | {latency_summary} |
          | Heap bytes | {benchmark['before_bytes']:.0f} B/op | {benchmark['after_bytes']:.0f} B/op | {'unchanged' if benchmark['allocation_equal'] else 'changed'} |
          | Allocations | {benchmark['before_allocs']:.0f} allocs/op | {benchmark['after_allocs']:.0f} allocs/op | {'unchanged' if benchmark['allocation_equal'] else 'changed'} |
          """
          else:
              benchmark_table = "Benchmark parsing did not produce a result."

          body = f"""<!-- bolt-review-validation-final -->
          ## ⚡ Bolt reviewer follow-up

          **Conclusion:** the CodeQL allocation-size finding is valid, not a false positive. The reviewed arithmetic wraps a signed `int` at the representable boundary:

          ```text
          {overflow}
          ```

          Commit `495622c60639bf6ca732b75c5cb32689c65ec291` replaces the unchecked sum with checked additions. Every representable SSE frame still uses the exact-capacity, single-allocation path; an unrepresentable frame is rejected before `make` instead of reaching it with a wrapped capacity.

          ### Behavior and regression evidence

          | Check | Outcome |
          |---|---|
          {status_rows}

          The permanent regression set contains the existing byte-for-byte SSE wire contract plus `TestResponseStreamFrameCapacity`, which covers normal data-only/named frames and every `math.MaxInt` overflow boundary.

          ### Same-runner benchmark

          Command per sample:

          ```bash
          GOMAXPROCS=1 go test ./relay/controller -run '^$' \\
            -bench '^BenchmarkChatToResponseStreamBridgeEmitEvent$' \\
            -benchmem -benchtime=500ms -count=1 -cpu=1
          ```

          Ten alternating samples were collected for reviewed head `6462f74623a93a8bbc2395bfa566578f1a24c62e` and the fixed implementation on the same runner.

          {benchmark_table}

          ### Full-CI failure discrimination

          The focused `relay/format` behavior-equivalence test was also run directly from current `main` commit `{main_sha}`. Its outcome was `{main_result}`:

          ```text
          {main_tail}
          ```

          This establishes whether the unrelated full-suite failure is already present on current `main`; PR #362 does not modify `relay/format`.

          **Validation gate:** {'PASS' if gate else 'FAIL'}

          Validation run: {run_url}
          """
          body = "\n".join(line.strip() for line in body.splitlines()).strip() + "\n"

          payload = json.dumps({"body": body}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/362/comments",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          urllib.request.urlopen(request).close()
          print(body)
          if not gate:
              raise SystemExit("validation gate failed; see published PR report")
          PY
